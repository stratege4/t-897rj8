<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thailand">
<meta name="robots" content="noindex,nofollow">
<title>Thailand 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Designsystem Thailand-Planer, Version 2
   Ruhige Fläche, Jade als einziger Akzent, Statusfarben nur mit Bedeutung. Systemschrift (SF auf dem iPhone, offline vorhanden).
   Layout: Tab-Leiste unten, Seiten mit großer Überschrift, Detailseiten mit Zurück oben links, Formulare mit fester Leiste unten. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --surface2:#F7F8F6; --ink:#15201C; --ink2:#4B5853; --ink3:#87918C; --line:#E1E6E2; --line2:#CDD5D0;
  --accent:#0E6A57; --accent-ink:#FFFFFF; --accent-soft:#E0EFEA;
  --konflikt:#B3261E; --konflikt-soft:#FBE9E7; --fehlt:#94580A; --fehlt-soft:#FCF0DC; --offen:#3D5A70; --offen-soft:#E6EEF4;
  --favorit:#8A6A00; --favorit-soft:#F6EFD6;
  --k-beach:#16809E; --k-food:#B2445F; --k-kultur:#B07B0E; --k-natur:#4F7F2A;
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, Roboto, sans-serif;
  --r:12px; --r-s:10px; --tab:56px; --nav:48px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 8px 28px rgba(18,32,27,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0E1412; --surface:#171F1C; --surface2:#1C2521; --ink:#E8EEEB; --ink2:#A8B4AF; --ink3:#76827D; --line:#26302C; --line2:#33403A;
  --accent:#4CC2A4; --accent-ink:#06231C; --accent-soft:#163029;
  --konflikt:#F2877E; --konflikt-soft:#3A1D1B; --fehlt:#E6AE5C; --fehlt-soft:#33270F; --offen:#9DB9CE; --offen-soft:#1C2A35;
  --favorit:#E3C35A; --favorit-soft:#2F2810;
  --shadow:0 8px 28px rgba(0,0,0,.5); color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.ic{width:20px;height:20px;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Gerüst */
#screen{position:fixed;inset:0 0 calc(var(--tab) + var(--safe-b)) 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#screen.formmode{bottom:0}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--safe-b));padding-bottom:var(--safe-b);background:color-mix(in srgb, var(--surface) 92%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:900}
#tabbar.versteckt{display:none}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink3);position:relative}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:8px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;padding:0 4px;background:var(--konflikt);color:#fff;font-size:10px;line-height:16px;font-weight:700}
.page{min-height:100%;padding:0 0 32px}
.nav{position:sticky;top:0;z-index:50;height:calc(var(--nav) + var(--safe-t));padding:var(--safe-t) 8px 0;display:grid;grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr);align-items:center;background:color-mix(in srgb, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid transparent}
.nav.scrolled{border-bottom-color:var(--line)}
.nav .navtitle{font-weight:600;font-size:16px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbtn{border:0;background:none;min-height:44px;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-size:16px;font-weight:500}
.navbtn .ic{width:22px;height:22px}
.navbtn.strong{font-weight:650}
.nav .right{justify-self:end;display:flex}
.head{padding:4px 16px 12px}
.head h1{margin:0;font-size:30px;line-height:1.15;font-weight:750;letter-spacing:-.02em;text-wrap:balance}
.head .sub{margin-top:4px;color:var(--ink2);font-size:15px}
.content{padding:0 16px;display:flex;flex-direction:column;gap:22px}
.sect{display:flex;flex-direction:column;gap:8px}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.secthead h2{margin:0;font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.secthead .link{border:0;background:none;color:var(--accent);font-size:15px;font-weight:500;min-height:32px;padding:0}
.hint{font-size:13px;color:var(--ink3);padding:0 4px;margin:0}

/* Gruppierte Listen (Inset) */
.group{background:var(--surface);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:10px 14px;border:0;background:none;text-align:left;text-decoration:none;color:var(--ink)}
.row + .row, .row + .rowx, .rowx + .row{border-top:1px solid var(--line)}
button.row:active, a.row:active{background:var(--surface2)}
.row .lead{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--surface2);color:var(--ink2);flex:none}
.row .lead.c{background:color-mix(in srgb, var(--c) 14%, var(--surface));color:var(--c)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:550;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--ink2);overflow-wrap:anywhere}
.row .s2{font-size:13px;color:var(--ink3)}
.row .end{display:flex;align-items:center;gap:6px;color:var(--ink3);flex:none}
.row .chev{width:18px;height:18px;color:var(--ink3)}
.rowx{padding:12px 14px}

/* Status */
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 9px;border-radius:12px;font-size:12px;font-weight:650;white-space:nowrap;border:1px solid transparent}
.pill .ic{width:14px;height:14px}
.s-kandidat{color:var(--ink2);border-color:var(--line2)}
.s-favorit{color:var(--favorit);background:var(--favorit-soft)}
.s-ausgewaehlt{color:var(--accent);border-color:var(--accent);background:var(--surface)}
.s-gebucht{color:var(--accent-ink);background:var(--accent)}
.s-verworfen,.s-storniert{color:var(--ink3);background:var(--surface2);text-decoration:line-through}
.s-idee{color:var(--ink2);border-color:var(--line2)}
.s-geplant{color:var(--offen);background:var(--offen-soft)}
.s-fest{color:var(--accent-ink);background:var(--accent)}
.lvl{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:11px 14px;color:var(--ink);min-height:48px}
.lvl + .lvl{border-top:1px solid var(--line)}
.lvl .mark{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;flex:none;margin-top:1px}
.lvl .mark .ic{width:15px;height:15px}
.lvl.konflikt .mark{background:var(--konflikt-soft);color:var(--konflikt)}
.lvl.fehlt .mark{background:var(--fehlt-soft);color:var(--fehlt)}
.lvl.offen .mark{background:var(--offen-soft);color:var(--offen)}
.lvl .tx{flex:1;font-size:15px;overflow-wrap:anywhere}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:15px;font-size:13px;font-weight:650;border:0}
.count.konflikt{background:var(--konflikt-soft);color:var(--konflikt)}
.count.fehlt{background:var(--fehlt-soft);color:var(--fehlt)}
.count.offen{background:var(--offen-soft);color:var(--offen)}
.count.ok{background:var(--accent-soft);color:var(--accent)}

/* Reise-Zeitachse */
.tl{display:flex;flex-direction:column}
.tlstay{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tlstay .top{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;background:none;width:100%;text-align:left;color:var(--ink)}
.tlstay .date{width:44px;flex:none;text-align:center;border-radius:9px;background:var(--surface2);padding:5px 0}
.tlstay .date b{display:block;font-size:19px;line-height:1.1}
.tlstay .date span{font-size:11px;color:var(--ink2);font-weight:600;text-transform:uppercase}
.tlstay .info{flex:1;min-width:0}
.tlstay h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.tlstay .meta{font-size:14px;color:var(--ink2);margin-top:2px}
.tlstay .lodge{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:11px 14px;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left;color:var(--ink)}
.tlstay .lodge .t{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.tlstay .lodge .t small{display:block;color:var(--ink2);font-size:13px}
.tllink{display:flex;align-items:stretch;gap:12px;padding:0 14px 0 34px;min-height:56px}
.tllink .rail{width:2px;background:var(--line2);flex:none;margin:0 0 0 0}
.tllink .card{flex:1;margin:8px 0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);width:100%;text-align:left;color:var(--ink)}
.tllink .card.dashed{border-style:dashed;background:transparent;color:var(--ink2)}
.tllink .card.warn{border-color:color-mix(in srgb, var(--fehlt) 45%, var(--line));background:var(--fehlt-soft);color:var(--fehlt)}
.tllink .card .t{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.tllink .card .t small{display:block;font-size:13px;color:var(--ink2)}
.tllink .card.warn .t small{color:inherit;opacity:.85}

/* Knöpfe */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;font-size:16px;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--konflikt);border-color:color-mix(in srgb, var(--konflikt) 40%, var(--line2))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.fab{position:fixed;right:16px;bottom:calc(var(--tab) + var(--safe-b) + 16px);height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:650;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line2);background:var(--surface);font-size:14px;font-weight:550;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip .ic{width:17px;height:17px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.c[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.seg{display:flex;padding:3px;border-radius:11px;background:color-mix(in srgb, var(--ink) 7%, transparent);gap:2px}
.seg button{flex:1;border:0;background:none;min-height:34px;border-radius:8px;font-size:14px;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .ic{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Formulare */
.form{display:flex;flex-direction:column;gap:18px}
.fgroup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px}
.field + .field, .fgroup > .frow + .frow, .field + .frow, .frow + .field{border-top:1px solid var(--line)}
.field > span{font-size:13px;color:var(--ink2);font-weight:550}
.field input,.field select,.field textarea{border:0;background:none;padding:2px 0;font-size:16px;width:100%;min-height:30px;outline:none;color:var(--ink)}
.field textarea{min-height:72px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--ink3)}
.frow{display:grid;grid-template-columns:1fr 1fr}
.frow > .field + .field{border-top:0;border-left:1px solid var(--line)}
.flabel{font-size:13px;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:0 4px;margin-bottom:-10px}
.fhint{font-size:13px;color:var(--ink3);padding:0 4px;margin-top:-10px}
.fhint.warn{color:var(--fehlt)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font-size:20px;font-weight:600;display:grid;place-items:center;color:var(--ink)}
.stepper output{min-width:64px;text-align:center;font-weight:650}
.formbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + var(--safe-b));background:color-mix(in srgb, var(--bg) 92%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:flex;gap:10px;z-index:800}
.formbar .btn{flex:1}
.page.hasbar{padding-bottom:calc(96px + var(--safe-b))}

/* Leere Zustände */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 20px;background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r)}
.empty .ic{width:30px;height:30px;color:var(--ink3)}
.empty b{font-size:17px}
.empty p{margin:0;color:var(--ink2);font-size:15px;max-width:34ch}

/* Vergleich: gleich aufgebaute Karten untereinander, auf dem iPhone ohne seitliches Scrollen */
.ccards{display:flex;flex-direction:column;gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.ccard.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ccard.konflikt{border-color:var(--konflikt);box-shadow:inset 0 0 0 1px var(--konflikt)}
.ccard header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ccard header .t{border:0;background:none;padding:0;text-align:left;font-size:17px;font-weight:700;color:var(--ink);overflow-wrap:anywhere;min-height:24px}
.cprice{font-size:16px;font-weight:650;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cprice.best{color:var(--accent)}
.cprice .tag{font-size:12px;font-weight:650;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.ccard dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;font-size:14px}
.ccard dt{color:var(--ink2)}
.ccard dd{margin:0;overflow-wrap:anywhere}
.cnote{margin:0;font-size:14px;color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.ccard footer{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ccard footer .btn{min-height:42px}
.ccard footer .btn.ghost{margin-right:auto;padding:0 6px}
.chosen{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--accent);min-height:42px}
.muted{color:var(--ink3);font-weight:400}

/* Reise-Einstieg */
.subbtn{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;min-height:30px;color:var(--accent);font-size:15px;font-weight:550}
.subbtn .ic{width:16px;height:16px}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.setup-t{display:flex;gap:12px;align-items:flex-start}
.setup-t > .ic{width:32px;height:32px;padding:6px;border-radius:9px;background:var(--offen-soft);color:var(--offen);flex:none}
.setup-t b{display:block;font-size:16px}
.setup-t small{display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.tally{display:flex;gap:10px;font-size:13px;font-weight:650}
.tal.konflikt{color:var(--konflikt)}.tal.fehlt{color:var(--fehlt)}.tal.offen{color:var(--offen)}
.lvl.more{color:var(--accent);font-weight:600;align-items:center}
.lvl.more .chev{width:18px;height:18px}
.allok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--accent-soft);color:var(--accent);font-size:15px;font-weight:550}
.row.addrow{color:var(--accent)}
.row.addrow .lead{background:var(--accent-soft);color:var(--accent)}
.row.addrow .t{font-weight:600}
.btn.small{min-height:38px;padding:0 12px;font-size:15px}
.linkish{border:0;background:none;padding:0;text-align:left;color:var(--ink);font:inherit;font-weight:550}
.note.ok{display:flex;gap:8px;align-items:center;background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:550}
.note.ok .ic{width:18px;height:18px;flex:none}
.tllink .card.konflikt{border-color:color-mix(in srgb, var(--konflikt) 45%, var(--line));background:var(--konflikt-soft);color:var(--konflikt)}
.tllink .card.konflikt .t small{color:inherit;opacity:.85}
.tlstay .lodge.z-konflikt{background:var(--konflikt-soft)}
.tlstay .lodge.z-konflikt .t small{color:var(--konflikt)}

/* Karte */
#mapWrap{position:fixed;inset:0 0 calc(var(--tab) + var(--safe-b)) 0;background:#0E3A4A}
#map{position:absolute;inset:0}
.leaflet-container{background:#0E3A4A;font-family:var(--font)}
.maptop{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;z-index:700;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.maptop > *{pointer-events:auto}
.glass{background:color-mix(in srgb, var(--surface) 88%, transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}
.mapfilter{display:flex;gap:4px;padding:4px;overflow-x:auto}
.mf{flex:1;min-height:38px;padding:0 10px;border-radius:10px;border:0;background:none;display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:650;color:var(--ink3);white-space:nowrap}
.mf .ic{width:18px;height:18px}
.mf[aria-pressed="true"]{color:var(--c);background:color-mix(in srgb, var(--c) 12%, transparent)}
.mapright{position:absolute;right:12px;bottom:84px;z-index:700;display:flex;flex-direction:column;gap:8px}
.mapbtn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.mapbtn.on{color:var(--accent)}
.mapday{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;font-size:14px}
.mapday span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapday .navbtn{min-height:34px}
.mpin{border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.35)}
.mpin .ic{width:60%;height:60%}
.mpin.done{background:#fff;color:var(--c);box-shadow:0 0 0 2.5px var(--c),0 3px 8px rgba(0,0,0,.25);opacity:.6}
.mpin.inplan{box-shadow:0 0 0 2px #fff,0 0 0 5px var(--accent),0 3px 8px rgba(0,0,0,.35)}
.hpin{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#15201C;color:#fff;box-shadow:0 0 0 2px #fff,0 4px 10px rgba(0,0,0,.4)}
.hpin .ic{width:20px;height:20px}
.hpin.kand{background:#fff;color:#15201C;box-shadow:0 0 0 2px #15201C,0 3px 8px rgba(0,0,0,.3)}
.lbl{display:inline-block;transform:translate(-50%,0);white-space:nowrap;font-weight:650;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6);pointer-events:none}
.lbl.town{font-size:13px}.lbl.town.major{font-size:15px}
.lbl.poi{font-size:12px;transform:none}
.lbl.poi.done{opacity:.6}
.rtlbl{display:inline-block;transform:translate(-50%,-50%);background:#15201C;color:#fff;font-size:12px;font-weight:650;padding:3px 8px;border-radius:9px;white-space:nowrap}
.mepin{width:18px;height:18px;border-radius:50%;background:#1E7BFF;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.4)}
.mepin.stale{background:#8AA0B8}
.attrib{position:absolute;left:8px;bottom:6px;z-index:650;font-size:10px;color:rgba(255,255,255,.8);text-shadow:0 0 3px #000;pointer-events:none}
.picker{position:relative;height:min(58vh,460px);margin:0 -16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.picker .pmap{position:absolute;inset:0}
.picker .cross{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-34px 0 0 -17px;z-index:600;pointer-events:none;color:#fff;filter:drop-shadow(0 2px 3px rgba(0,0,0,.7))}
.picker .cross .ic{width:34px;height:34px}

/* Tagesplan */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .btn{min-height:40px;padding:0 12px}
.dl{display:flex;flex-direction:column}
.dlrow{display:grid;grid-template-columns:52px 28px 1fr auto;gap:0 10px;align-items:start}
.dlrow .time{font-weight:650;font-size:15px;padding-top:12px;text-align:right}
.dlrow .rail{position:relative;display:flex;justify-content:center}
.dlrow .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line2)}
.dlrow:first-child .rail::before{top:18px}
.dlrow:last-child .rail::before{bottom:calc(100% - 18px)}
.dlrow .rail i{position:relative;margin-top:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c, var(--ink2));color:#fff;box-shadow:0 0 0 3px var(--bg)}
.dlrow .rail i .ic{width:15px;height:15px}
.dlrow .body{padding:10px 0;min-width:0}
.dlrow .body .t{font-weight:600;border:0;background:none;padding:0;text-align:left;color:var(--ink);font-size:16px;overflow-wrap:anywhere}
.dlrow .body .s{font-size:13px;color:var(--ink2);margin-top:2px}
.dlrow.leg .time{visibility:hidden}
.dlrow.leg .rail i{display:none}
.dlrow.leg .body{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--ink2);padding:6px 0}
.dlrow.leg .body .ic{width:17px;height:17px}
.dlrow.leg .body a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;min-height:32px}
.dlrow.leg.missing .body{color:var(--fehlt)}
.dlrow .tools{padding-top:8px;display:flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink2)}
.iconbtn .ic{width:18px;height:18px}
.mini{display:inline-flex;align-items:center;gap:4px;margin-top:6px}
.mini button{width:36px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--surface);font-weight:700;color:var(--ink)}
.mini output{min-width:54px;text-align:center;font-size:14px;font-weight:600;color:var(--ink2)}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink2);padding:0 4px}
.summary span{display:inline-flex;align-items:center;gap:5px}
.summary .ic{width:17px;height:17px}
.note{border-radius:var(--r-s);padding:11px 13px;font-size:14px;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);margin:0}
.note.warn{background:var(--fehlt-soft);color:var(--fehlt);border-color:transparent}
.note.konflikt{background:var(--konflikt-soft);color:var(--konflikt);border-color:transparent}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r-s);padding:0 12px;min-height:46px}
.search .ic{color:var(--ink3)}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;min-height:44px;min-width:0}
mark{background:var(--accent-soft);color:inherit;border-radius:3px}

/* Spot */
.hero{display:flex;gap:14px;align-items:center;padding:0 16px 4px}
.hero .big{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.hero .big .ic{width:28px;height:28px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;border-radius:17px;background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink2)}
.fact .ic{width:16px;height:16px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate{min-height:56px;border-radius:var(--r-s);border:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2)}
.rate.down .ic{transform:scaleY(-1)}
.rate[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prose{margin:0;font-size:16px;line-height:1.5;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}

/* Blätter (nur kurze Auswahl und Bestätigung) */
.sheetbg{position:fixed;inset:0;background:rgba(10,16,14,.42);z-index:1000;display:flex;align-items:flex-end;animation:fade .18s ease-out}
.sheet{width:100%;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:8px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:14px;animation:up .22s cubic-bezier(.32,.72,0,1)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 2px}
.sheet h3{margin:0;font-size:19px;font-weight:700}
.sheet p{margin:0;color:var(--ink2)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%);z-index:1200;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:550;box-shadow:var(--shadow);animation:up .2s ease-out}
.toast .ic{width:18px;height:18px}
.toast.warn{background:var(--konflikt);color:#fff}
@keyframes down{from{transform:translate(-50%,-14px);opacity:.3}to{transform:translate(-50%,0);opacity:1}}
.toast{animation:down .2s ease-out}
.offline{position:fixed;top:calc(var(--safe-t) + 6px);left:50%;transform:translateX(-50%);z-index:1100;font-size:12px;font-weight:650;padding:4px 10px;border-radius:10px;background:var(--ink);color:var(--bg)}
.code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:12px;word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r-s);padding:10px;max-height:120px;overflow:auto;user-select:all}

</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function nowParts(){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, hh:+p.hour, mm:+p.minute, min:+p.hour*60 + +p.minute};

const today = () => nowParts().date;
const addDays = (iso,n) => { const d = new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const weekday = iso => new Date(iso+"T12:00:00Z").getUTCDay();
const dayDiff = (a,b) => Math.round((new Date(a+"T12:00:00Z")-new Date(b+"T12:00:00Z"))/864e5);
const fmtDate = iso => `${WD[weekday(iso)]} ${iso.slice(8,10)}.${iso.slice(5,7)}.`;
const fmtDateLong = iso => `${WDL[weekday(iso)]}, ${+iso.slice(8,10)}. ${MON[+iso.slice(5,7)-1]}`;
const fmtRange = (a,b) => a && b ? `${+a.slice(8,10)}.${a.slice(5,7) !== b.slice(5,7) ? +a.slice(5,7) + "." : ""} – ${+b.slice(8,10)}.${+b.slice(5,7)}.` : a ? `ab ${fmtDate(a)}` : "ohne Datum";
const toMin = t => { const [h,m] = String(t).split(":").map(Number); return h*60+(m||0); };
const toHHMM = m => { m = Math.round(m); m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const durTxt = m => m >= 60 ? (Math.round(m/30)/2).toString().replace(".",",")+" h" : m+" min";
const legTxt = m => m >= 60 ? Math.floor(m/60) + " h" + (m%60 ? " " + m%60 + " min" : "") : m + " min";

const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
// Luftlinie in km, nur für die Reihenfolge, wenn eine Route fehlt. Wird nie als Fahrzeit angezeigt.
const airKm = (a,b) => { const k = Math.PI/180, x = (b.lng-a.lng)*k*Math.cos((a.lat+b.lat)/2*k), y = (b.lat-a.lat)*k; return Math.hypot(x,y)*6371; };
function nearestTown({lat,lng}){ let best=null,bd=1e9; DATA.labels.forEach(([a,b,n]) => { const dd=(a-lat)**2+((b-lng)*Math.cos(lat*Math.PI/180))**2; if(dd<bd){bd=dd;best=n;} }); return best; }
// Koordinaten aus Text lesen: „13.75, 100.50“ oder ein Google-Maps-Link (@lat,lng oder q=lat,lng). Kein Netz, keine Suche.
function parseCoords(text){
  const t = String(text || "");
  const m = t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/) || t.match(/[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i) || t.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null;
  const lat = +m[1], lng = +m[2];
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? {lat:+lat.toFixed(6), lng:+lng.toFixed(6)} : null;
}

/* ===== 02-daten.js ===== */
/* ---------- Daten: lokaler Speicher, Datensätze mit Feld-Zeitstempeln, Spots ----------
   Alles Persönliche liegt nur in localStorage (KEY) und geht nur über den Abgleich ans andere Gerät.
   Datensätze (Spots in over, Reise in stays/lodgings/conns/opts) bekommen je Feld einen Zeitstempel in _t,
   damit der Abgleich Felder einzeln zusammenführt. Löschen setzt weg:true und bleibt als Markierung stehen. */
const KEY = "thailand2027-v1";
const RECORDS = ["over", "stays", "lodgings", "conns", "opts"];
const COLLECTIONS = ["over", "ratings", "days", "plans", "meta", "stays", "lodgings", "conns", "opts", "etappen", "unterkuenfte"];
const S = Object.assign(Object.fromEntries(COLLECTIONS.map(c => [c, {}])), LS.get(KEY) || {});
COLLECTIONS.forEach(c => { if(!S[c] || typeof S[c] !== "object") S[c] = {}; });
S.filter = new Set(Object.keys(GROUPS));
let saveFailed = false, _placesCache = null;
function persist(){
  _placesCache = null;
  const ok = LS.set(KEY, {...Object.fromEntries(COLLECTIONS.map(c => [c, S[c]])), savedAt:Date.now()});
  if(!ok && !saveFailed){ saveFailed = true; toast("Speichern auf diesem Gerät nicht möglich", "warn", 4000); }
  return ok;
}

// Feldweise schreiben: jedes geänderte Feld bekommt seinen eigenen Zeitstempel
function setRec(col, id, patch){
  const now = Date.now(), cur = S[col][id] || {};
  S[col][id] = {...cur, ...patch, at:now, _t:{...(cur._t || {}), ...Object.fromEntries(Object.keys(patch).filter(k => k !== "at" && k !== "_t").map(k => [k, now]))}};
  if(col === "over") _placesCache = null;
  return S[col][id];
}
// Zwei Stände eines Datensatzes zusammenführen: pro Feld gilt der neuere Zeitstempel (Einträge ohne _t zählen mit at)
function mergeRec(a, b){
  if(!a) return b; if(!b) return a;
  const out = {}, t = {};
  for(const f of [...new Set([...Object.keys(a), ...Object.keys(b)])].sort()){
    if(f === "_t" || f === "at") continue;
    const ta = a._t?.[f] ?? a.at ?? 0, tb = b._t?.[f] ?? b.at ?? 0;
    const src = tb > ta || (tb === ta && JSON.stringify(b[f]) > JSON.stringify(a[f])) ? b : a, other = src === a ? b : a;
    const v = f in src ? src[f] : other[f]; if(v !== undefined) out[f] = v; t[f] = Math.max(ta, tb);
  }
  return {...out, _t:t, at:Math.max(a.at || 0, b.at || 0)};
}
// alle nicht gelöschten Datensätze einer Sammlung, mit id
const live = col => Object.entries(S[col]).filter(([, r]) => r && !r.weg).map(([id, r]) => ({...r, id}));
const rec = (col, id) => { const r = id && S[col][id]; return r && !r.weg ? {...r, id} : null; };
const fieldTime = (r, f) => r?._t?.[f] ?? r?.at ?? 0;

};

/* ===== 03-reise.js ===== */
/* ---------- Reise: Aufenthalte, Unterkunftsoptionen, Verbindungen, Transportoptionen ----------
   stays     Aufenthalt (Ort, von = Anreise, bis = Abreise). Nächte = bis − von. Bleibt bestehen, wenn die Unterkunft wechselt.
   lodgings  Unterkunftsoption eines Aufenthalts (stayId), beliebig viele, jede mit Entscheidungsstatus.
   conns     Verbindung von einem Aufenthalt oder Ort (vonStay/vonText) zu einem anderen (nachStay/nachText).
   opts      Transportoption einer Verbindung (connId), beliebig viele, jede mit Entscheidungsstatus.
   Die App wählt nie selbst aus und schätzt keine fehlenden Zeiten oder Preise. */

const stays = () => live("stays").sort((a, b) => (a.von || "9999").localeCompare(b.von || "9999") || (a.bis || "").localeCompare(b.bis || "") || (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id));
const datedStays = () => stays().filter(s => s.von && s.bis);
const nights = s => s?.von && s?.bis ? dayDiff(s.bis, s.von) : null;
const ST_ORDER = {gebucht:0, ausgewaehlt:1, favorit:2, kandidat:3, verworfen:4, storniert:5};
const byStatus = (a, b) => (ST_ORDER[a.status] ?? 3) - (ST_ORDER[b.status] ?? 3) || (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id);
const lodgingsOf = sid => live("lodgings").filter(l => l.stayId === sid).sort(byStatus);
const conns = () => live("conns");
const optsOf = cid => live("opts").filter(o => o.connId === cid).sort(byStatus);

// Gewählt ist eine Option nur, wenn sie die einzige ausgewählte oder gebuchte ist. Sind mehrere gewählt (paralleler Abgleich),
// gilt keine: item ist null, überall wird der Konflikt gezeigt, bis ihr eine behaltet. So bestimmt nie eine zufällige Option
// Tagesstart, Karte oder Prüfung. alle = die gewählten, gebuchte zuerst.
function chosenOf(list){
  const sel = list.filter(o => GEWAEHLT.has(o.status));
  return {item:sel.length === 1 ? sel[0] : null, mehrere:sel.length > 1, alle:sel};
}
const stayLodging = sid => chosenOf(lodgingsOf(sid)).item;
const connOpt = cid => chosenOf(optsOf(cid)).item;
const siblingsOf = (col, r) => col === "lodgings" ? lodgingsOf(r.stayId) : optsOf(r.connId);

// Auswählen: die bisher ausgewählte wird Favorit. Eine gebuchte wird nie automatisch abgewählt.
// Ist die Option schon gewählt und es gibt einen Konflikt, löst dasselbe den Konflikt zu ihren Gunsten („Behalten“).
function chooseOption(col, id){
  const r = rec(col, id); if(!r) return {ok:false};
  const sibs = siblingsOf(col, r);
  const gebucht = sibs.find(o => o.id !== id && o.status === "gebucht");
  if(gebucht) return {ok:false, blockiert:gebucht};
  sibs.filter(o => o.id !== id && o.status === "ausgewaehlt").forEach(o => setRec(col, o.id, {status:"favorit"}));
  if(!GEWAEHLT.has(r.status)) setRec(col, id, {status:"ausgewaehlt"});
  return {ok:true};
}
// Option einem anderen Aufenthalt bzw. einer anderen Verbindung zuordnen (auch zum Retten nach einem Abgleich, siehe Prüfung).
// Ist sie gewählt und dort ist schon eine gewählt, wird nichts verschoben: erst eine der beiden auf Favorit setzen.
function moveOption(col, id, parentId){
  const r = rec(col, id), key = col === "lodgings" ? "stayId" : "connId"; if(!r || !parentId || r[key] === parentId) return {ok:!!r};
  if(GEWAEHLT.has(r.status)){
    const dort = chosenOf(col === "lodgings" ? lodgingsOf(parentId) : optsOf(parentId)).alle[0];
    if(dort) return {ok:false, blockiert:dort};
  }
  setRec(col, id, {[key]:parentId});
  return {ok:true};
}
function setOptionStatus(col, id, status){
  const r = rec(col, id); if(!r) return {ok:false};
  if(status === "ausgewaehlt" || status === "gebucht"){
    const sibs = siblingsOf(col, r);
    const gebucht = sibs.find(o => o.id !== id && o.status === "gebucht");
    if(gebucht) return {ok:false, blockiert:gebucht};
    sibs.filter(o => o.id !== id && o.status === "ausgewaehlt").forEach(o => setRec(col, o.id, {status:"favorit"}));
  }
  setRec(col, id, {status});
  return {ok:true};
}

// Preise: nur was eingetragen ist, je Nacht und gesamt nur bei bekannter Nächtezahl, keine Umrechnung
function lodgingPrice(l, n){
  if(!Number.isFinite(l?.preis)) return {nacht:null, gesamt:null};
  if(l.bezug === "gesamt") return {nacht: n ? l.preis / n : null, gesamt:l.preis};
  return {nacht:l.preis, gesamt: n ? l.preis * n : null};
}

/* ---------- Orte und Bezeichnungen ---------- */
const stayName = s => s?.ort || "Aufenthalt ohne Ort";
const connEnd = (c, seite) => { const sid = c[seite + "Stay"], s = sid && rec("stays", sid); return s ? stayName(s) : c[seite + "Text"] || null; };
const connTitle = c => `${connEnd(c, "von") || "?"} → ${connEnd(c, "nach") || "?"}`;
const optStart = o => o.datum && o.ab ? o.datum + "T" + o.ab : null;
const optEnd = o => (o.anDatum || o.datum) && o.an ? (o.anDatum || o.datum) + "T" + o.an : null;
const optWhen = o => [o.datum ? fmtDate(o.datum) : null, o.ab && o.an ? `${o.ab}–${o.an}${o.anDatum && o.anDatum !== o.datum ? " (" + fmtDate(o.anDatum) + ")" : ""}` : o.ab ? "ab " + o.ab : o.an ? "an " + o.an : null].filter(Boolean).join(" ");
const optDauer = o => o.dauerMin ? (o.dauerOk ? legTxt(o.dauerMin) : "ca. " + legTxt(o.dauerMin)) : null;

/* ---------- Zeitraum und Reisetage ---------- */
const tripRange = () => { const r = S.meta.reise; return r?.start && r?.end && r.end >= r.start ? r : null; };
// Zeitraum der Reise: eingetragen, sonst aus der Planung (Aufenthalte und eindeutig gewählte Verbindungen), sonst null.
// Abgeleitet ist nur ein Vorschlag, festgelegt wird er im Formular „Reisezeitraum“.
function tripBounds(){
  const r = tripRange(); if(r) return {start:r.start, end:r.end, quelle:"eingetragen"};
  const ds = datedStays().filter(s => s.bis > s.von), os = conns().map(c => connOpt(c.id)).filter(o => o?.datum);
  if(!ds.length && !os.length) return null;
  const a = [...ds.map(s => s.von), ...os.map(o => o.datum)].sort(), e = [...ds.map(s => s.bis), ...os.map(o => o.anDatum || o.datum)].sort();
  return {start:a[0], end:e.pop(), quelle:"aus der Planung"};
}
const tripDays = () => { const b = tripBounds(); const a = b ? b.start : today(), n = b ? dayDiff(b.end, b.start) + 1 : 7; return Array.from({length:Math.max(1, n)}, (_, i) => addDays(a, i)); };
const stayForNight = d => datedStays().find(s => s.von <= d && d < s.bis) || null;
const stayForDay = d => stayForNight(d) || stayForNight(addDays(d, -1));
// Nacht d verbringt ihr unterwegs, wenn eine gewählte Option am Tag d (oder früher) abfährt und erst danach ankommt.
// Bei einem Auswahlkonflikt nur, wenn alle gewählten Optionen darin übereinstimmen: nichts wird aus einer zufälligen Option abgeleitet.
const nightInTransit = d => conns().some(c => { const sel = chosenOf(optsOf(c.id)).alle; return sel.length > 0 && sel.every(o => o.datum && o.anDatum && o.datum <= d && d < o.anDatum); });
// Unterkunftsentscheidung eines Aufenthalts als Zustand: gewaehlt (genau eine), konflikt (mehrere), offen (Optionen da), leer
function stayChoice(sid){
  const ls = lodgingsOf(sid), ch = chosenOf(ls), k = ls.filter(l => !RAUS.has(l.status)).length;
  return {...ch, zustand:ch.mehrere ? "konflikt" : ch.item ? "gewaehlt" : k ? "offen" : "leer", aktiv:k};
}
const connChoice = cid => { const os = optsOf(cid), ch = chosenOf(os), k = os.filter(o => !RAUS.has(o.status)).length; return {...ch, zustand:ch.mehrere ? "konflikt" : ch.item ? "gewaehlt" : k ? "offen" : "leer", aktiv:k}; };

/* ---------- Anschluss an die Tagesplanung ----------
   Ein Tag startet an der gewählten Unterkunft des Aufenthalts der Vornacht und endet an der der Nacht.
   Wechselt der Aufenthalt (Reisetag), endet der Plan beim letzten Stopp, die Weiterreise ist eine Verbindung. */
const NEAR_KM = 80;
const lodgingPoint = l => l && Number.isFinite(l.lat) && Number.isFinite(l.lng) ? {id:l.id, name:l.name, lat:l.lat, lng:l.lng} : null;
const ukNight = d => { const s = stayForNight(d); return s ? lodgingPoint(stayLodging(s.id)) : null; };
const isTravelDay = d => { const a = stayForNight(addDays(d, -1)), b = stayForNight(d); return !!(a && b && a.id !== b.id); };
// Gab es einen Aufenthalt in der Vornacht, startet der Tag nur dort. Ist dessen Unterkunft offen oder ungeklärt, gibt es keinen Start
// (früher sprang der Start dann auf die Unterkunft der nächsten Nacht, am Reisetag also an den falschen Ort).
const dayStart = d => stayForNight(addDays(d, -1)) ? ukNight(addDays(d, -1)) : ukNight(d);
const dayEnd = d => isTravelDay(d) ? null : ukNight(d);
const baseFor = d => ukNight(d) || ukNight(addDays(d, -1));
// alle Unterkünfte mit Ort, die für die Karte und das Vorladen zählen (nicht verworfen oder storniert)
const mapLodgings = () => live("lodgings").filter(l => Number.isFinite(l.lat) && !RAUS.has(l.status) && rec("stays", l.stayId));
// Verbindungen, die an einem Tag abfahren oder ankommen (gewählte Option, sonst die Verbindung selbst)
function connsOnDay(d){
  return conns().map(c => ({c, o:connOpt(c.id)})).filter(({c, o}) => {
    if(o) return o.datum === d || o.anDatum === d;
    const v = c.vonStay && rec("stays", c.vonStay), n = c.nachStay && rec("stays", c.nachStay);
    return v?.bis === d || (!v && n?.von === d);
  });
}

/* ---------- Chronologische Übersicht ----------
   Eine Zeitachse aus Aufenthalten, Verbindungen, Nächten ohne Aufenthalt und Platzhaltern für fehlende Verbindungen.
   Verbindungen stehen am Datum ihrer gewählten Option, sonst an der Ab- bzw. Anreise des verknüpften Aufenthalts.
   So erscheinen auch Flüge ohne verknüpften Aufenthalt an der richtigen Stelle. Am selben Tag gilt:
   Platzhalter davor (0) · ankommende Verbindung (1) · Aufenthalt (2) · abfahrende Verbindung (3) · Platzhalter danach (4) · Lücke (5).
   Ohne Datum und ohne Bezug bleiben nur Verbindungen ohne gewählte Option und Aufenthalte ohne Datum (rest, ohneDatum). */
function overview(){
  const ds = datedStays().filter(s => s.bis > s.von), dsIds = new Set(ds.map(s => s.id)), cs = conns(), b = tripBounds(), items = [], rest = [];
  const put = (d, rang, x) => items.push({...x, _d:d, _r:rang});
  ds.forEach(s => put(s.von, 2, {art:"stay", s}));
  cs.forEach(c => {
    const o = connOpt(c.id), v = dsIds.has(c.vonStay) ? rec("stays", c.vonStay) : null, n = dsIds.has(c.nachStay) ? rec("stays", c.nachStay) : null;
    const d = o?.datum || v?.bis || n?.von;
    if(!d) return rest.push(c);
    put(d, n && d === n.von ? 1 : 3, {art:"conn", c});
  });
  ds.forEach((s, i) => {
    if(i === 0 && !cs.some(c => c.nachStay === s.id)) put(s.von, 0, {art:"connFehlt", nach:s, richtung:"anreise"});
    const next = ds[i + 1];
    if(next && !cs.some(c => c.vonStay === s.id && c.nachStay === next.id)) put(next.von, 0, {art:"connFehlt", von:s, nach:next});
    if(!next && !cs.some(c => c.vonStay === s.id)) put(s.bis, 4, {art:"connFehlt", von:s, richtung:"abreise"});
  });
  if(b){ // Nächte ohne Aufenthalt, zusammengefasst. Eine Nacht in einer gewählten Nachtverbindung (Flug, Nachtzug) ist keine Lücke.
    let start = null;
    for(let d = b.start; d <= b.end; d = addDays(d, 1)){
      const frei = d < b.end && !stayForNight(d) && !nightInTransit(d);
      if(frei && !start) start = d;
      if(!frei && start){ put(start, 5, {art:"luecke", von:start, bis:d, n:dayDiff(d, start)}); start = null; }
    }
  }
  items.sort((x, y) => x._d.localeCompare(y._d) || x._r - y._r);
  const ohneDatum = stays().filter(s => !s.von || !s.bis || s.bis <= s.von);
  return {items, rest, ohneDatum};
}
// Vorhandene Verbindungen, die zu einem Platzhalter passen (die fehlende Seite ist noch frei), passende Ortsnamen zuerst
function connCandidates(x){
  // keine Verbindung, die schon von diesem Ort abfährt, als Anreise anbieten (und umgekehrt)
  const ab = (c, s) => c.vonStay === s.id || (!c.vonStay && c.vonText && norm(c.vonText) === norm(stayName(s)));
  const an = (c, s) => c.nachStay === s.id || (!c.nachStay && c.nachText && norm(c.nachText) === norm(stayName(s)));
  const frei = c => x.von && x.nach ? (!c.vonStay || c.vonStay === x.von.id) && (!c.nachStay || c.nachStay === x.nach.id) : x.nach ? !c.nachStay && !ab(c, x.nach) : !c.vonStay && !an(c, x.von);
  const passt = c => !!((x.nach && c.nachText && norm(c.nachText) === norm(stayName(x.nach))) || (x.von && c.vonText && norm(c.vonText) === norm(stayName(x.von))));
  return conns().filter(frei).sort((a, c) => passt(c) - passt(a));
}
// Verbindung mit dem Aufenthalt des Platzhalters verknüpfen. Der bisherige Ortstext bleibt stehen, angezeigt wird der Aufenthalt.
function linkConn(cid, x){
  const c = rec("conns", cid); if(!c) return false;
  const patch = {};
  if(x.von && !c.vonStay) patch.vonStay = x.von.id;
  if(x.nach && !c.nachStay) patch.nachStay = x.nach.id;
  if(Object.keys(patch).length) setRec("conns", cid, patch);
  return true;
}

/* ---------- Prüfung ----------
   konflikt = echter Widerspruch, fehlt = es fehlt ein Eintrag, offen = noch keine Entscheidung.
   Jeder Punkt nennt, wohin ein Tipp führt. Nichts wird automatisch gewählt oder geschätzt. */
function planIssues(){
  const out = [], add = (lvl, text, ziel, datum) => out.push({lvl, text, ziel, datum:datum || ""});
  const all = stays(), ds = datedStays(), r = tripRange();
  if(!r) add("offen", "Reisezeitraum noch nicht festgelegt", ["zeitraum"]);
  all.filter(s => s.von && s.bis && s.bis <= s.von).forEach(s => add("konflikt", `${stayName(s)}: Abreise liegt nicht nach der Anreise`, ["stay", {id:s.id}], s.von));
  all.filter(s => !s.von || !s.bis).forEach(s => add("fehlt", `${stayName(s)}: An- oder Abreisedatum fehlt`, ["stay", {id:s.id}]));
  for(let i = 0; i < ds.length; i++) for(let j = i + 1; j < ds.length; j++){
    const a = ds[i], c = ds[j];
    if(a.bis > a.von && c.bis > c.von && a.von < c.bis && c.von < a.bis) add("konflikt", `${stayName(a)} und ${stayName(c)} überschneiden sich`, ["stay", {id:c.id}], c.von);
  }
  if(r) ds.filter(s => s.von < r.start || s.bis > r.end).forEach(s => add("konflikt", `${stayName(s)} liegt außerhalb des Reisezeitraums`, ["stay", {id:s.id}], s.von));
  const ov = overview();
  ov.items.filter(x => x.art === "luecke").forEach(x => add("fehlt", `${plural(x.n, "Nacht", "Nächte")} ohne Aufenthalt (${fmtRange(x.von, x.bis)})`, ["neuStay", {von:x.von, luecke:x.bis}], x.von));
  ds.forEach(s => {
    const ch = stayChoice(s.id);
    if(ch.zustand === "konflikt") add("konflikt", `${stayName(s)}: ${ch.alle.length} Unterkünfte gleichzeitig gewählt, bis ihr eine behaltet, gilt keine`, ["stay", {id:s.id}], s.von);
    else if(ch.zustand === "offen") add("offen", `${stayName(s)}: Unterkunft noch nicht gewählt (${plural(ch.aktiv, "Option", "Optionen")})`, ["stay", {id:s.id}], s.von);
    else if(ch.zustand === "leer") add("offen", `${stayName(s)}: noch keine Unterkunft erfasst`, ["stay", {id:s.id}], s.von);
    else if(!lodgingPoint(ch.item)) add("fehlt", `${stayName(s)}: Ort der Unterkunft fehlt, Tagespläne haben keinen Startpunkt`, ["lodging", {id:ch.item.id}], s.von);
  });
  ov.items.filter(x => x.art === "connFehlt").forEach(x => add("fehlt",
    x.richtung === "anreise" ? `Anreise nach ${stayName(x.nach)} fehlt` : x.richtung === "abreise" ? `Abreise ab ${stayName(x.von)} fehlt` : `Keine Verbindung ${stayName(x.von)} → ${stayName(x.nach)}`,
    ["neuConn", {vonStay:x.von?.id || null, nachStay:x.nach?.id || null}], x.von?.bis || x.nach?.von));
  // Nach einem Abgleich kann eine Option an einem gelöschten Aufenthalt oder einer gelöschten Verbindung hängen. Sie ginge sonst still verloren.
  live("lodgings").filter(l => !rec("stays", l.stayId)).forEach(l => add("konflikt", `${l.name || "Unterkunft"}: gehört zu einem gelöschten Aufenthalt, neu zuordnen oder löschen`, ["lodgingEdit", {id:l.id}]));
  live("opts").filter(o => !rec("conns", o.connId)).forEach(o => add("konflikt", `${[TRANSPORT[o.art]?.[0], o.anbieter].filter(Boolean).join(" ") || "Transportoption"}: gehört zu einer gelöschten Verbindung, neu zuordnen oder löschen`, ["optEdit", {id:o.id}], o.datum));
  conns().forEach(c => {
    const ch = connChoice(c.id), t = connTitle(c);
    if(!connEnd(c, "von") || !connEnd(c, "nach")) add("fehlt", `Verbindung ${t}: Start oder Ziel fehlt`, ["conn", {id:c.id}]);
    // Bei einem Konflikt wird keine der gewählten Optionen weiter geprüft, sonst stammten Zeiten und Preise aus einer zufälligen
    if(ch.zustand === "konflikt") return add("konflikt", `${t}: ${ch.alle.length} Optionen gleichzeitig gewählt, bis ihr eine behaltet, gilt keine`, ["conn", {id:c.id}], ch.alle[0]?.datum);
    if(!ch.item){ add("offen", ch.aktiv ? `${t}: noch keine Option gewählt` : `${t}: noch keine Option erfasst`, ["conn", {id:c.id}], optsOf(c.id)[0]?.datum); return; }
    const o = ch.item, st = optStart(o), en = optEnd(o);
    if(st && en && en < st) add("konflikt", `${t}: Ankunft liegt vor der Abfahrt`, ["opt", {id:o.id}], o.datum);
    const v = c.vonStay && rec("stays", c.vonStay), n = c.nachStay && rec("stays", c.nachStay);
    if(v?.bis && o.datum && o.datum !== v.bis) add("konflikt", `${t}: Abfahrt am ${fmtDate(o.datum)}, Abreise aus ${stayName(v)} am ${fmtDate(v.bis)}`, ["opt", {id:o.id}], o.datum);
    const anD = o.anDatum || o.datum;
    if(n?.von && anD && o.an && anD !== n.von) add("konflikt", `${t}: Ankunft am ${fmtDate(anD)}, Aufenthalt in ${stayName(n)} beginnt am ${fmtDate(n.von)}`, ["opt", {id:o.id}], anD);
    if(r && o.datum && (o.datum < r.start || o.datum > r.end)) add("konflikt", `${t}: liegt außerhalb des Reisezeitraums`, ["opt", {id:o.id}], o.datum);
    const fehlt = [!o.datum && "Datum", !o.ab && "Abfahrt", !o.an && "Ankunft", !Number.isFinite(o.preis) && o.status !== "gebucht" && "Preis"].filter(Boolean);
    if(fehlt.length) add("fehlt", `${t}: ${fehlt.join(", ")} fehlt`, ["opt", {id:o.id}], o.datum);
  });
  const rang = {konflikt:0, fehlt:1, offen:2};
  return out.sort((a, c) => rang[a.lvl] - rang[c.lvl] || (a.datum || "9999").localeCompare(c.datum || "9999"));
}

/* ---------- Übernahme der Daten aus Version 1 (etappen, unterkuenfte) ----------
   Wiederholbar: legt nur an, was noch fehlt. Gleiche IDs und Zeitstempel auf beiden Geräten, damit der Abgleich zusammenpasst.
   Alte Unterkunft u → Aufenthalt st-<u> plus Option u. Alte Etappe e → Verbindung cn-<e> plus Option e. */
const ALT_STATUS = {idee:"kandidat", geplant:"ausgewaehlt", gebucht:"gebucht"};
function migrateLegacy(){
  let n = 0;
  const stamped = (fields, t) => ({...fields, at:t, _t:Object.fromEntries(Object.keys(fields).map(k => [k, t]))});
  for(const [id, u] of Object.entries(S.unterkuenfte || {})){

    const t = u.at || Date.now(), sid = "st-" + id;
    if(!S.stays[sid]) S.stays[sid] = stamped({ort:u.name || "Aufenthalt", von:u.von || null, bis:u.bis || null, status:u.status === "gebucht" ? "fest" : "geplant", notiz:null, createdAt:u.createdAt || t}, t);
    S.lodgings[id] = stamped({stayId:sid, name:u.name || "Unterkunft", art:null, lat:Number.isFinite(u.lat) ? u.lat : null, lng:Number.isFinite(u.lng) ? u.lng : null, status:ALT_STATUS[u.status] || "kandidat", notiz:u.notiz || null, createdAt:u.createdAt || t}, t);
    n++;
  }
  for(const [id, e] of Object.entries(S.etappen || {})){
    if(!e || e.weg || S.opts[id]) continue;
    const t = e.at || Date.now(), cid = "cn-" + id;
    const find = txt => { const k = norm(txt); return k ? Object.entries(S.stays).find(([, s]) => !s.weg && norm(s.ort) === k)?.[0] || null : null; };
    if(!S.conns[cid]){ const vs = find(e.von), ns = find(e.nach); S.conns[cid] = stamped({vonStay:vs, vonText:vs ? null : e.von || null, nachStay:ns, nachText:ns ? null : e.nach || null, notiz:null, createdAt:e.createdAt || t}, t); }
    S.opts[id] = stamped({connId:cid, art:TRANSPORT[e.art] ? e.art : "sonst", datum:e.datum || null, ab:e.ab || null, anDatum:e.anDatum || null, an:e.an || null, dauerMin:e.dauerMin || null, dauerOk:!!e.dauerOk, anbieter:e.anbieter || null, nummer:null, preis:null, waehrung:null, link:null, status:ALT_STATUS[e.status] || "kandidat", notiz:[e.notiz, e.kosten ? "Kosten (alt): " + e.kosten : null].filter(Boolean).join("\n") || null, createdAt:e.createdAt || t}, t);
    n++;
  }
  return n;
}
// Aufenthalt löschen: seine Unterkunftsoptionen gehen mit, Verbindungen bleiben und behalten den Ortsnamen als Text
function deleteStay(id){
  const s = rec("stays", id); if(!s) return;
  lodgingsOf(id).forEach(l => setRec("lodgings", l.id, {weg:true}));
  conns().forEach(c => {
    if(c.vonStay === id) setRec("conns", c.id, {vonStay:null, vonText:stayName(s)});
    if(c.nachStay === id) setRec("conns", c.id, {nachStay:null, nachText:stayName(s)});
  });
  setRec("stays", id, {weg:true});
}
function deleteConn(id){ optsOf(id).forEach(o => setRec("opts", o.id, {weg:true})); setRec("conns", id, {weg:true}); }

/* ===== 04-routen.js ===== */
/* ---------- Routen (OpenStreetMap) ----------
   Vorab berechnete Autorouten stehen in DATA.routes (routen.js), alles andere wird bei Netz nachgeladen und nur auf
   dem Gerät gespeichert (RCACHE). Fahrzeiten ab Unterkünften entstehen nur hier, nie in den öffentlichen Dateien.
   Verkehrsmittel eines Tagesplans, Autozeiten gelten nie für andere Verkehrsmittel:
   auto  Straßenrouten über router.project-osrm.org (der Dienst rechnet nur Auto, auch wenn man "foot" anfragt)
   fuss  Fußrouten über routing.openstreetmap.de (FOSSGIS, Profil routed-foot), ohne Puffer
   frei  Boot, Bus, Bahn: keine Berechnung, nur von euch eingetragene Zeiten je Abschnitt */
const ROUTE_FACTOR = 1.15; // Puffer für Ortsdurchfahrten, Parkplatzsuche, Verkehr
const RCACHE = LS.get("thailand2027-routes") || {};
const rid = x => (x && x.id) || null;
const rkey = (a,b) => [a,b].sort().join("|");
const LMODES = {auto:{l:"Auto, Taxi", icon:"auto", gm:"driving", wort:"Fahrt"}, fuss:{l:"Zu Fuß", icon:"gehen1", gm:"walking", wort:"zu Fuß"}, frei:{l:"Boot, Bus, Bahn", icon:"faehre", gm:"transit", wort:"unterwegs"}};
const modeOf = plan => LMODES[plan?.modus] ? plan.modus : "auto";
// Cache-Schlüssel mit Koordinaten: ein verschobener Punkt bekommt nie eine alte Route
const pkey = x => x.id + "@" + (+x.lat).toFixed(4) + "," + (+x.lng).toFixed(4);
const ckey = (a, b, mode) => (mode === "fuss" ? "fuss:" : "") + [pkey(a), pkey(b)].sort().join("|");
function routeFor(a,b,mode="auto"){ if(mode === "frei") return null; const ka = rid(a), kb = rid(b); if(!ka || !kb) return null; if(ka===kb) return [0,0,""]; return (mode === "auto" && !a.moved && !b.moved ? DATA.routes?.[rkey(ka,kb)] : null) || RCACHE[ckey(a, b, mode)] || null; }
function travel(a,b,mode="auto"){ const r = routeFor(a,b,mode); return r ? Math.round(r[0]*(mode === "auto" ? ROUTE_FACTOR : 1)) : null; } // null = noch keine Zeit
// Fahrzeit ab der Unterkunft des aktiven Tages, nur für Spots im Umkreis (sonst null)
const hotelMin = p => { const b = baseFor(editDay()); if(!b || airKm(b, p) > NEAR_KM) return null; const m = travel(b, p); return m === null ? null : Math.max(5, Math.round(m/5)*5); };
async function osrm(a,b,mode="auto"){
  const host = mode === "fuss" ? "https://routing.openstreetmap.de/routed-foot" : "https://router.project-osrm.org";
  const js = await fetch(`${host}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=polyline`).then(r => r.json());
  if(js.code !== "Ok") throw new Error(js.code);
  const r = js.routes[0]; return [Math.round(r.duration/6)/10, Math.round(r.distance/100)/10, r.geometry];
}
const rPending = new Set();
function ensureRoutes(pairs, mode="auto"){
  if(navigator.onLine === false || mode === "frei") return;
  const key = ([a,b]) => ckey(a, b, mode);
  // zu Fuß nur bis 25 km Luftlinie, darüber ist eine Gehzeit keine Planungsgrundlage
  const todo = pairs.filter(([a,b]) => rid(a) && rid(b) && rid(a)!==rid(b) && !routeFor(a,b,mode) && !rPending.has(key([a,b])) && (mode !== "fuss" || airKm(a,b) <= 25));
  if(!todo.length) return;
  todo.forEach(p => rPending.add(key(p)));
  (async () => {
    let got = 0;
    for(const [a,b] of todo){ const k = key([a,b]); try{ RCACHE[k] = await osrm(a,b,mode); got++; }catch(e){} rPending.delete(k); await new Promise(r => setTimeout(r, 300)); }
    if(got){ LS.set("thailand2027-routes", RCACHE); reorderEditDay(); onDataChanged({quiet:true}); }
  })();
}
// Neue Zeiten können eine bessere Reihenfolge ergeben. Die Reihenfolge ist berechnet, kein Nutzereintrag, daher kein neuer Zeitstempel.
function reorderEditDay(){ const pl = dayPlanFor(editDay()); if(!pl || modeOf(pl.plan) === "frei") return; const vor = pl.plan.stationen.map(x => x.placeId).join(); optimizeOrder(pl.plan); if(pl.plan.stationen.map(x => x.placeId).join() !== vor) persist(); }
const polyCache = {};
function decodePoly(str){
  if(polyCache[str]) return polyCache[str];
  let i = 0, lat = 0, lng = 0; const out = [];
  while(i < str.length){ for(const k of [0,1]){ let b, sh = 0, r = 0; do{ b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; }while(b >= 32); const d = r & 1 ? ~(r >> 1) : r >> 1; if(k) lng += d; else lat += d; } out.push([lat/1e5, lng/1e5]); }
  return polyCache[str] = out;
}
// Abstand des Punkts zur nächsten Straße (ein Punkt auf einer internen Zufahrt verfälscht Fahrzeiten)
async function roadGap(lat, lng){ const js = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}?number=1`).then(r => r.json()); if(js.code !== "Ok") throw new Error(js.code); return Math.round(js.waypoints[0].distance); }
const mapsLeg = (from, to, mode="auto") => `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${encodeURIComponent(to.mapsQuery || `${to.lat},${to.lng}`)}&travelmode=${LMODES[mode].gm}`;
const mapsDir = p => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.mapsQuery || `${p.lat},${p.lng}`)}`;
const mapsPlace = p => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;

/* ===== 05-tagesplan.js ===== */
/* ---------- Tagesplan ----------
   Ihr wählt die Spots, die App bestimmt nur die Reihenfolge mit der kürzesten Zeit im Verkehrsmittel des Tages
   (Unterkunft → Spots → Unterkunft, ohne gewählte Unterkunft: erster bis letzter Stopp).
   Es werden nie Spots hinzugefügt, die ihr nicht selbst ausgewählt habt. Unverändert aus Version 1 übernommen. */
function defaultDay(){
  const d = today(), b = tripBounds();
  if(b && d < b.start) return b.start;
  return (!b || d < b.end) && nowParts().hh >= 17 ? addDays(d, 1) : d;
}
// Der aktive Tag: gilt für Spot-Suche, Fahrzeiten ab Unterkunft und die Route auf der Karte gleichermaßen (geräteeigen)
function editDay(){ const e = S.meta.editDay; return e && e >= today() ? e : defaultDay(); }
const dayPlanFor = date => { const pid = S.days[date]?.planId; return (pid && S.plans[pid]) || null; };
function dayStartMin(date){
  let m = 9*60 + 30;
  if(date === today()) m = Math.max(m, Math.ceil((nowParts().min + 20)/15)*15);
  return m;
}
const stationFor = p => ({placeId:p.id, name:p.name, art:"station", dauerMin:Math.max(30, Math.round((p.dauerMin||60)/15)*15), notiz:null});
function ensureDayPlan(date){
  let pid = S.days[date]?.planId, pl = pid && S.plans[pid];
  if(pl && pl.eigen) return pid;
  // ältere, automatisch erzeugte Pläne: nur die Spots übernehmen, Pausen und Einschübe fallen weg
  const stationen = pl ? pl.plan.stationen.filter(x => x.placeId && P(x.placeId)).map(x => stationFor(P(x.placeId))) : [];
  if(!pl){ // feste ID je Tag: legen beide Geräte denselben Tag an, ist es derselbe Plan
    pid = "plan-" + date;
    if(S.plans[pid]?.eigen){ touchDay(date, {planId:pid}); return pid; }
  }
  const now = Date.now();
  S.plans[pid] = {datum:date, erzeugtUm:now, at:now, status:"übernommen", eigen:true, plan:{titel:"", start:toHHMM(dayStartMin(date)), stationen, datum:date, log:Object.fromEntries(stationen.map(x => [x.placeId, {in:true, at:now}]))}};
  touchDay(date, {planId:pid});
  retitle(S.plans[pid].plan);
  return pid;
}
function retitle(plan){ const regions = [...new Set(plan.stationen.map(x => P(x.placeId)?.region).filter(Boolean))]; plan.titel = WDL[weekday(plan.datum)] + (regions.length ? " · " + regions.slice(0,2).join(" & ") : ""); }
const planOrigin = plan => dayStart(plan.datum), planEnd = plan => dayEnd(plan.datum);
function planLegs(plan){ const pts = [planOrigin(plan), ...plan.stationen.map(x => x.placeId && P(x.placeId)).filter(Boolean), planEnd(plan)].filter(Boolean); return pts.slice(1).map((b,i) => [pts[i], b]); }
// Zeit eines Abschnitts im Verkehrsmittel des Tages: berechnet (route), selbst eingetragen (eigen) oder unbekannt (min null)
function legTime(plan, a, b){
  const mode = modeOf(plan);
  if(mode === "frei"){ const e = rid(a) && rid(b) ? plan.leg?.[rkey(rid(a), rid(b))] : null; return {min: e && Number.isFinite(e.min) ? e.min : null, km:null, src: e ? "eigen" : null, mode}; }
  const min = travel(a, b, mode); return {min, km: routeFor(a, b, mode)?.[1] ?? null, src: min === null ? null : "route", mode};
}
// Kosten einer Reihenfolge. Fehlt eine Zeit, zählt die Luftlinie (Auto 1,5, zu Fuß 12, Boot/Bus/Bahn 2 Minuten je km), nur zum Sortieren.
const AIRMIN = {auto:1.5, fuss:12, frei:2};
const legCost = (plan, a, b) => legTime(plan, a, b).min ?? airKm(a,b)*AIRMIN[modeOf(plan)];
function planDrive(plan, order=plan.stationen){ let t = 0, prev = planOrigin(plan); for(const x of order){ const p = P(x.placeId); if(!p) continue; if(prev) t += legCost(plan, prev, p); prev = p; } const end = planEnd(plan); return t + (prev && end ? legCost(plan, prev, end) : 0); }
function setMode(date, mode){
  const pl = dayPlanFor(date); if(!pl || modeOf(pl.plan) === mode) return;
  pl.plan.modus = mode; pl.plan.modusAt = pl.at = Date.now();
  optimizeOrder(pl.plan); ensureRoutes(planLegs(pl.plan), mode); persist();
}
// eigene Zeit für einen Abschnitt (Boot, Bus, Bahn), in 5-Minuten-Schritten, erster Tipp setzt 15 Minuten
function setLeg(date, key, delta){
  const pl = dayPlanFor(date); if(!pl) return;
  const cur = pl.plan.leg?.[key]?.min;
  const min = Number.isFinite(cur) ? Math.min(12*60, Math.max(0, cur + delta)) : delta > 0 ? 15 : null;
  if(min === null) return;
  pl.plan.leg = {...(pl.plan.leg || {}), [key]:{min, at:Date.now()}}; pl.at = Date.now(); persist();
}
function optimizeOrder(plan){
  const st = plan.stationen.filter(x => x.placeId && P(x.placeId));
  let best = st, bc = planDrive(plan, st);
  if(st.length <= 8){ // alle Reihenfolgen durchprobieren
    const perm = (rest, pre) => { if(!rest.length){ const c = planDrive(plan, pre); if(c < bc - .01){ bc = c; best = pre; } return; } rest.forEach((x,i) => perm([...rest.slice(0,i), ...rest.slice(i+1)], [...pre, x])); };
    perm(st, []);
  } else { // viele Stopps: Abschnitte umdrehen, solange es kürzer wird (2-opt)
    let better = true;
    while(better){ better = false;

/* ===== 06-abgleich.js ===== */
/* ---------- Abgleich zwischen zwei Handys ----------
   Der Stand geht als Code (gzip, base64url) oder Link (#sync=) ans andere Gerät und wird dort zusammengeführt, nie überschrieben:
   - Datensätze (Spots, Aufenthalte, Unterkunfts- und Transportoptionen, Verbindungen) feldweise nach Zeitstempel,

   - Tagespläne stoppweise (mergePlans), Bewertungen nach Zeitstempel, Besucht-Listen vereinigt und auf den Status gekürzt.

const SYNC_KEY = "thailand2027";

function snapshot(){ return {app:SYNC_KEY, v:2, t:Date.now(), ...Object.fromEntries(COLLECTIONS.filter(c => c !== "meta").map(c => [c, S[c]])), meta:sharedMeta()}; }
// Vergleich unabhängig von der Reihenfolge der Felder, sonst zählt ein bloß umsortierter Eintrag als Änderung
const canon = x => JSON.stringify(x, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(f => [f, v[f]])) : v);
function mergeState(js){
  let n = 0;

  for(const col of RECORDS) for(const [k, v] of Object.entries(js[col] || {})){ const m = mergeRec(S[col][k], v); if(canon(m) !== canon(S[col][k])) n++; S[col][k] = m; }
  for(const col of ["unterkuenfte", "etappen"]) for(const [k, v] of Object.entries(js[col] || {})) if(neuer(S[col][k], v)) S[col][k] = v;
  for(const [k, v] of Object.entries(js.ratings || {})) if(neuer(S.ratings[k], v)){ if((S.ratings[k]?.emoji || null) !== (v.emoji || null)) n++; S.ratings[k] = v; }
  _placesCache = null; // ab hier Spots und Status aus dem eben zusammengeführten over lesen

    const a = S.plans[k];
    const m = !a ? v : v.eigen && a.eigen ? mergePlans(a, v) : neuer(a, v) ? v : a;
    if(canon(a) !== canon(m)) n++;

  }
  const visited = id => P(id)?.status === "besucht";
  for(const [k, v] of Object.entries(js.days || {})){
    const a = S.days[k] || {};

    if(a.planId && v.planId && a.planId !== v.planId && S.plans[a.planId]?.eigen && S.plans[v.planId]?.eigen){
      const [keep, drop] = [a.planId, v.planId].sort();

    }

  if((js.meta?.at || 0) > (S.meta.at || 0) && canon(js.meta) !== canon(sharedMeta())) n++;
  if((js.meta?.at || 0) > (S.meta.at || 0)) S.meta = {...S.meta, ...js.meta, ...Object.fromEntries(LOCAL_META.map(k => [k, S.meta[k]]))};

const b64 = buf => { let out = ""; for(const c of new Uint8Array(buf)) out += String.fromCharCode(c); return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };

async function packState(){
  const js = JSON.stringify(snapshot());

    try{ return "z" + b64(await new Response(new Blob([js]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); }catch(e){}
  }
