<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5EEE3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thailand">
<meta name="robots" content="noindex,nofollow">
<title>Thailand 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Designsystem Thailand-Planer, Version 3 („warm“)
   Warme Sandflächen, Petrol für Orientierung und Auswahl, Koralle nur für die eine Hauptaktion einer Ansicht.
   Statusfarben haben überall dieselbe Bedeutung und stehen nie allein (immer mit Text, oft mit Symbol).
   Systemschrift (SF auf dem iPhone, offline vorhanden), keine Webfonts, keine externen Bilder.
   Die alten Variablennamen (--ink, --accent, --fehlt …) sind Aliase, damit Module, die sie im Stil-Attribut nutzen, weiter stimmen. */
:root{
  /* Flächen */
  --bg:#F5EEE3; --surface:#FFFAF2; --surface-raised:#FFFFFF; --sand:#E8C39D; --sand-soft:#F0E1CB; --border:#E8DCCB; --border-strong:#DCCAB2;
  /* Meer und Natur */
  --sea-light:#DDEFEA; --sea:#8ECBC5; --teal:#327F78; --teal-dark:#245F59; --nature:#A9C98C;
  /* Sonne */
  --coral:#F07855; --coral-strong:#C2512E; --mango:#F2BC67;
  /* Text */
  --text:#293A3D; --text-muted:#6F7A75; --text-faint:#9A9F98;
  /* Status: Hintergrund und Schrift, je Bedeutung genau ein Paar */
  --success-bg:#DDEBDD; --success:#2E6B4A;
  --warning-bg:#F9E8C6; --warning:#8F5F0E;          /* offen: Entscheidung steht aus */
  --missing-bg:#F0E1CB; --missing:#86592A;          /* fehlt: Angabe fehlt, blockiert nichts */
  --danger-bg:#F4D9CF; --danger:#A93F25;            /* Konflikt */
  --favorit-bg:#FBEFD5; --favorit-ink:#946A12;
  /* Kategorien der Spots */
  --k-beach:#2E8E9C; --k-food:#CC6A3F; --k-kultur:#B0812C; --k-natur:#5C8C43;
  /* Formen, Abstände, Schatten */
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --r-xl:22px; --r-lg:18px; --r:16px; --r-s:12px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-7:32px;
  --tab:58px; --nav:48px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --shadow-soft:0 1px 2px rgba(92,64,34,.05), 0 6px 20px rgba(92,64,34,.06);
  --shadow:0 10px 30px rgba(70,48,24,.16);
  /* Aliase für ältere Namen */
  --ink:var(--text); --ink2:var(--text-muted); --ink3:var(--text-faint); --line:var(--border); --line2:var(--border-strong); --surface2:#F8F0E4;
  --accent:var(--teal); --accent-ink:#FFFFFF; --accent-soft:var(--sea-light);
  --konflikt:var(--danger); --konflikt-soft:var(--danger-bg); --fehlt:var(--missing); --fehlt-soft:var(--missing-bg); --offen:var(--warning); --offen-soft:var(--warning-bg);
  --favorit:var(--favorit-ink); --favorit-soft:var(--favorit-bg);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#1A1613; --surface:#241F1A; --surface-raised:#2C2620; --sand:#8A6B4C; --sand-soft:#33291F; --border:#3A3129; --border-strong:#4A3F35;
  --sea-light:#1C3431; --sea:#4E8F89; --teal:#72C2B8; --teal-dark:#9AD6CE; --nature:#7E9B66;
  --coral:#F08A6B; --coral-strong:#C2512E; --mango:#F2C47A;
  --text:#F2E9DD; --text-muted:#BBAE9E; --text-faint:#8C8174;
  --success-bg:#1E3326; --success:#9FD0AE; --warning-bg:#382B13; --warning:#F0C46E; --missing-bg:#34291C; --missing:#DDB27A;
  --danger-bg:#3E2219; --danger:#F29C84; --favorit-bg:#352B14; --favorit-ink:#EBC46F;
  --k-beach:#5BB4C1; --k-food:#E48B62; --k-kultur:#D6A752; --k-natur:#8CBB70;
  --surface2:#2A231D; --accent-ink:#10231F;
  --shadow-soft:0 1px 2px rgba(0,0,0,.3); --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.42 var(--font);-webkit-text-size-adjust:100%;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.ic{width:20px;height:20px;flex:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Gerüst ---------- */
#screen{position:fixed;inset:0 0 calc(var(--tab) + var(--safe-b)) 0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#screen.formmode{bottom:0}
#tabbar{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--safe-b));padding-bottom:var(--safe-b);background:color-mix(in srgb, var(--surface) 90%, transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);z-index:900}
#tabbar.versteckt{display:none}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--text-faint);position:relative}
.tab .ic{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--teal-dark)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:50%;width:22px;height:3px;margin-left:-11px;border-radius:0 0 3px 3px;background:var(--coral)}
.tab .dot{position:absolute;top:7px;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;padding:0 4px;background:var(--danger);color:#fff;font-size:10px;line-height:17px;font-weight:700}
.page{min-height:100%;padding:0 0 var(--sp-7)}
.nav{position:sticky;top:0;z-index:50;height:calc(var(--nav) + var(--safe-t));padding:var(--safe-t) 8px 0;display:grid;grid-template-columns:minmax(64px,1fr) auto minmax(64px,1fr);align-items:center;background:color-mix(in srgb, var(--bg) 88%, transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid transparent}
.nav.scrolled{border-bottom-color:var(--border)}
.nav .navtitle{font-weight:650;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.navbtn{border:0;background:none;min-height:44px;min-width:44px;padding:0 8px;display:inline-flex;align-items:center;gap:2px;color:var(--teal);font-size:17px;font-weight:500}
.navbtn .ic{width:22px;height:22px}
.navbtn.strong{font-weight:650}
.nav .right{justify-self:end;display:flex}
.head{padding:var(--sp-1) var(--sp-4) var(--sp-4)}
.head h1{margin:0;font-size:32px;line-height:1.12;font-weight:720;letter-spacing:-.02em;text-wrap:balance}
.head .sub{margin-top:6px;color:var(--text-muted);font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.content{padding:0 var(--sp-4);display:flex;flex-direction:column;gap:var(--sp-6)}
.sect{display:flex;flex-direction:column;gap:var(--sp-2)}
.secthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:0 4px}
.secthead h2{margin:0;font-size:17px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.secthead .link{border:0;background:none;color:var(--teal);font-size:15px;font-weight:600;min-height:36px;padding:0}
.hint{font-size:13px;line-height:1.4;color:var(--text-muted);padding:0 4px;margin:0}

/* ---------- Kopfbild der Reise (eigene Illustration, kein Foto) ---------- */
.trip-hero{--h-sky1:#F7DDBC;--h-sky2:#F5EEE3;--h-sun:#F2BC67;--h-isle:#4F8576;--h-isle2:#8DB4A4;--h-sea1:#A7D6CF;--h-sea2:#8ECBC5;--h-wave:#FFFAF2;
  position:relative;overflow:hidden;padding:calc(var(--safe-t) + 22px) var(--sp-4) 0;min-height:calc(var(--safe-t) + 200px);display:flex;flex-direction:column;justify-content:flex-start}
@media (prefers-color-scheme: dark){ .trip-hero{--h-sky1:#3B2A1E;--h-sky2:#1A1613;--h-sun:#C98A45;--h-isle:#2C4A42;--h-isle2:#3A5A50;--h-sea1:#22504B;--h-sea2:#1B3D3A;--h-wave:#5E8F88} }
.trip-hero svg.scene{position:absolute;inset:0;width:100%;height:100%}
.trip-hero .ht{position:relative;z-index:1}
.trip-hero h1{margin:0;font-size:34px;line-height:1.08;font-weight:750;letter-spacing:-.025em;color:#1F3A3A}
.trip-hero .sub{margin-top:6px;font-size:15px;color:#3C5552;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.trip-hero .sub .subbtn{color:#1F5C55}
.trip-hero .hadd{position:absolute;z-index:2;top:calc(var(--safe-t) + 8px);right:10px;width:44px;height:44px;border-radius:50%;border:0;display:grid;place-items:center;color:#1F3A3A;background:color-mix(in srgb, #FFFAF2 70%, transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (prefers-color-scheme: dark){ .trip-hero h1{color:#F5EDE1} .trip-hero .sub{color:#D9CBB8} .trip-hero .sub .subbtn{color:#9AD6CE} .trip-hero .hadd{color:#F5EDE1;background:rgba(36,31,26,.6)} }
.trip-hero + .content{margin-top:-10px;position:relative}

/* ---------- Gruppierte Listen ---------- */
.group{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow-soft)}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:11px 14px;border:0;background:none;text-align:left;text-decoration:none;color:var(--text)}
.row + .row, .row + .rowx, .rowx + .row{border-top:1px solid var(--border)}
button.row:active, a.row:active{background:var(--surface2)}
.row .lead{width:36px;height:36px;border-radius:var(--r-s);display:grid;place-items:center;background:var(--sand-soft);color:var(--teal-dark);flex:none}
.row .lead.c{background:color-mix(in srgb, var(--c) 15%, var(--surface));color:var(--c)}
.row .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .s{font-size:14px;color:var(--text-muted);overflow-wrap:anywhere}
.row .s2{font-size:13px;color:var(--text-faint)}
.row .end{display:flex;align-items:center;gap:6px;color:var(--text-faint);flex:none}
.row .chev{width:18px;height:18px;color:var(--text-faint)}
.rowx{padding:12px 14px}

/* ---------- Status: eine Bedeutung, ein Aussehen ---------- */
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:var(--r-pill);font-size:12px;font-weight:650;white-space:nowrap;border:1px solid transparent}
.pill .ic{width:13px;height:13px}
.s-kandidat,.s-idee{color:var(--text-muted);border-color:var(--border-strong);background:transparent}
.s-favorit{color:var(--favorit-ink);background:var(--favorit-bg)}
.s-ausgewaehlt{color:var(--teal-dark);border-color:var(--teal);background:var(--sea-light)}
.s-gebucht,.s-fest{color:var(--success);background:var(--success-bg)}
.s-geplant{color:var(--teal-dark);background:var(--sea-light)}
.s-verworfen,.s-storniert{color:var(--text-faint);background:var(--surface2);text-decoration:line-through}
.lvl{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:12px 14px;color:var(--text);min-height:50px}
.lvl + .lvl{border-top:1px solid var(--border)}
.lvl .mark{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;margin-top:0}
.lvl .mark .ic{width:15px;height:15px}
.lvl.konflikt .mark{background:var(--danger-bg);color:var(--danger)}
.lvl.fehlt .mark{background:var(--missing-bg);color:var(--missing)}
.lvl.offen .mark{background:var(--warning-bg);color:var(--warning)}
.lvl .tx{flex:1;font-size:15px;overflow-wrap:anywhere}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.count{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:var(--r-pill);font-size:13px;font-weight:650;border:0}
.count.konflikt{background:var(--danger-bg);color:var(--danger)}
.count.fehlt{background:var(--missing-bg);color:var(--missing)}
.count.offen{background:var(--warning-bg);color:var(--warning)}
.count.ok{background:var(--success-bg);color:var(--success)}

/* ---------- Planung im Überblick ---------- */
.ovw .row .lead{background:var(--sand-soft);color:var(--teal-dark)}
.ovw .row .s b{font-weight:650;color:var(--text)}
.ovw .flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:2px 8px;border-radius:var(--r-pill)}
.ovw .flag .ic{width:12px;height:12px}
.flag.konflikt{background:var(--danger-bg);color:var(--danger)}
.flag.fehlt{background:var(--missing-bg);color:var(--missing)}
.flag.offen{background:var(--warning-bg);color:var(--warning)}
.flag.ok{background:var(--success-bg);color:var(--success)}

/* ---------- Reise-Zeitachse: Aufenthalte als Karten, Verbindungen als Ereignisse auf einer Linie ---------- */
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:31px;top:24px;bottom:24px;width:2px;border-radius:1px;background:var(--border-strong)}
.tlstay{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-soft)}
.tlstay .top{display:flex;gap:12px;align-items:flex-start;padding:14px;border:0;background:none;width:100%;text-align:left;color:var(--text)}
.tlstay .date{width:36px;flex:none;text-align:center;border-radius:var(--r-s);background:var(--sea-light);color:var(--teal-dark);padding:5px 0 4px}
.tlstay .date b{display:block;font-size:18px;line-height:1.1;font-weight:700}
.tlstay .date span{font-size:10px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.tlstay .info{flex:1;min-width:0}
.tlstay h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;overflow-wrap:anywhere}
.tlstay .meta{font-size:14px;color:var(--text-muted);margin-top:2px}
.tlstay .lodge{display:flex;align-items:center;gap:10px;border-top:1px solid var(--border);padding:11px 14px;width:100%;border-left:0;border-right:0;border-bottom:0;background:var(--surface2);text-align:left;color:var(--text)}
.tlstay .lodge .t{flex:1;min-width:0;font-size:15px;font-weight:550;overflow-wrap:anywhere}
.tlstay .lodge .t small{display:block;color:var(--text-muted);font-size:13px;font-weight:400}
.tlstay .lodge.z-konflikt{background:var(--danger-bg)}
.tlstay .lodge.z-konflikt .t small{color:var(--danger)}
.tllink{position:relative;display:flex;align-items:stretch;gap:0;padding:0 0 0 52px;min-height:58px}
.tllink .rail{display:none}
.tllink .card{position:relative;flex:1;margin:8px 0;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);width:100%;text-align:left;color:var(--text)}
.tllink .card::before{content:"";position:absolute;left:-26px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface);border:2px solid var(--teal)}
.tllink .card > .ic:first-child{color:var(--teal-dark)}
.tllink .card.dashed{border-style:dashed;border-color:var(--border-strong);background:transparent;color:var(--text-muted)}
.tllink .card.dashed::before{border-color:var(--border-strong)}
.tllink .card.dashed > .ic:first-child{color:var(--text-muted)}
.tllink .card.warn{border:1px dashed color-mix(in srgb, var(--warning) 45%, var(--border));background:var(--warning-bg);color:var(--warning)}
.tllink .card.warn::before{border-color:var(--mango);background:var(--mango)}
.tllink .card.warn > .ic:first-child{color:var(--warning)}
.tllink .card.konflikt{border-color:color-mix(in srgb, var(--danger) 45%, var(--border));background:var(--danger-bg);color:var(--danger)}
.tllink .card.konflikt::before{border-color:var(--danger);background:var(--danger)}
.tllink .card.konflikt > .ic:first-child{color:var(--danger)}
.tllink .card .t{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.tllink .card .t small{display:block;font-size:13px;font-weight:400;color:var(--text-muted)}
.tllink .card.warn .t small,.tllink .card.konflikt .t small{color:inherit;opacity:.85}

/* ---------- Knöpfe ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r-s);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:16px;text-decoration:none}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--coral-strong);border-color:var(--coral-strong);color:#fff;font-weight:650;box-shadow:0 4px 14px color-mix(in srgb, var(--coral) 30%, transparent)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb, var(--danger) 35%, var(--border))}
.btn.ghost{border-color:transparent;background:transparent;color:var(--teal);box-shadow:none}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.btn.small{min-height:38px;padding:0 13px;font-size:15px;white-space:nowrap;border-radius:var(--r-pill)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.fab{position:fixed;right:16px;bottom:calc(var(--tab) + var(--safe-b) + 16px);height:52px;padding:0 20px;border-radius:26px;border:0;background:var(--coral-strong);color:#fff;font-weight:650;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);z-index:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:var(--r-pill);border:1px solid var(--border-strong);background:var(--surface);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.chip .ic{width:17px;height:17px}
.chip small{font-weight:600;color:var(--text-faint)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:color-mix(in srgb, var(--accent-ink) 75%, transparent)}
.chip.c[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.seg{display:flex;padding:3px;border-radius:var(--r-s);background:color-mix(in srgb, var(--sand) 30%, var(--surface));gap:2px}
.seg button{flex:1;border:0;background:none;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button .ic{width:17px;height:17px}
.seg button[aria-pressed="true"]{background:var(--surface-raised);color:var(--teal-dark);box-shadow:0 1px 3px rgba(80,55,30,.14)}
@media (prefers-color-scheme: dark){ .seg button[aria-pressed="true"]{background:var(--surface-raised)} }

/* ---------- Formulare ---------- */
.form{display:flex;flex-direction:column;gap:20px}
.fgroup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.field{display:flex;flex-direction:column;gap:4px;padding:10px 14px}
.field + .field, .fgroup > .frow + .frow, .field + .frow, .frow + .field{border-top:1px solid var(--border)}
.field > span{font-size:13px;color:var(--text-muted);font-weight:600}
.field input,.field select,.field textarea{border:0;background:none;padding:2px 0;font-size:16px;width:100%;min-height:32px;outline:none;color:var(--text)}
.field textarea{min-height:76px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:var(--text-faint)}
.field:focus-within{background:color-mix(in srgb, var(--sea-light) 45%, var(--surface))}
.frow{display:grid;grid-template-columns:1fr 1fr}
.frow > .field + .field{border-top:0;border-left:1px solid var(--border)}
.flabel{font-size:15px;font-weight:650;color:var(--text);padding:0 4px;margin-bottom:-12px}
.fhint{font-size:13px;color:var(--text-muted);padding:0 4px;margin-top:-12px}
.fhint.warn{color:var(--missing)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:42px;border-radius:var(--r-s);border:1px solid var(--border-strong);background:var(--surface-raised);font-size:20px;font-weight:600;display:grid;place-items:center;color:var(--text)}
.stepper output{min-width:70px;text-align:center;font-weight:650}
.formbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + var(--safe-b));background:color-mix(in srgb, var(--bg) 92%, transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;gap:10px;z-index:800}
.formbar .btn{flex:1}
.formbar.overtab{bottom:calc(var(--tab) + var(--safe-b));padding-bottom:10px;z-index:850}
.formbar .status{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:650;color:var(--teal-dark);min-height:48px}
.page.hasbar{padding-bottom:calc(100px + var(--safe-b))}

/* ---------- Leere Zustände und Hinweise ---------- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:30px 20px;background:var(--surface);border:1px dashed var(--border-strong);border-radius:var(--r-lg)}
.empty .ic{width:32px;height:32px;color:var(--sand)}
.empty b{font-size:17px}
.empty p{margin:0;color:var(--text-muted);font-size:15px;max-width:34ch}
.note{border-radius:var(--r);padding:12px 14px;font-size:14px;background:var(--surface2);color:var(--text-muted);border:1px solid var(--border);margin:0}
.note.warn{background:var(--missing-bg);color:var(--missing);border-color:transparent}
.note.konflikt{background:var(--danger-bg);color:var(--danger);border-color:transparent}
.note.ok{display:flex;gap:8px;align-items:center;background:var(--success-bg);color:var(--success);border-color:transparent;font-weight:600}
.note.ok .ic{width:18px;height:18px;flex:none}
.note.info{display:flex;gap:10px;align-items:flex-start;background:var(--sea-light);color:var(--teal-dark);border-color:transparent}
.note.info .ic{width:18px;height:18px;flex:none;margin-top:1px}

/* ---------- Reise-Einstieg ---------- */
.subbtn{display:inline-flex;align-items:center;gap:2px;border:0;background:none;padding:0;min-height:32px;color:var(--teal);font-size:15px;font-weight:600}
.subbtn .ic{width:16px;height:16px}
.setup{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow-soft)}
.setup-t{display:flex;gap:12px;align-items:flex-start}
.setup-t > .ic{width:40px;height:40px;padding:9px;border-radius:var(--r-s);background:var(--warning-bg);color:var(--warning);flex:none}
.setup-t b{display:block;font-size:17px}
.setup-t small{display:block;font-size:14px;color:var(--text-muted);margin-top:3px}
.tally{display:flex;gap:10px;font-size:13px;font-weight:650}
.tal.konflikt{color:var(--danger)}.tal.fehlt{color:var(--missing)}.tal.offen{color:var(--warning)}
.lvl.more{color:var(--teal);font-weight:600;align-items:center}
.lvl.more .chev{width:18px;height:18px}
.allok{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--success-bg);color:var(--success);font-size:15px;font-weight:600}
.row.addrow{color:var(--teal)}
.row.addrow .lead{background:var(--sea-light);color:var(--teal-dark)}
.row.addrow .t{font-weight:600}
.linkish{border:0;background:none;padding:0;text-align:left;color:var(--text);font:inherit;font-weight:600}

/* ---------- Vergleich ---------- */
.ccards{display:flex;flex-direction:column;gap:14px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-soft)}
.ccard.on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal), var(--shadow-soft)}
.ccard.konflikt{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.ccard header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ccard header .who{display:flex;align-items:center;gap:12px;min-width:0}
.ccard .thumb{width:46px;height:46px;flex:none;border-radius:var(--r-s);display:grid;place-items:center;background:linear-gradient(160deg, var(--sea-light), color-mix(in srgb, var(--sand) 55%, var(--surface)));color:var(--teal-dark)}
.ccard .thumb .ic{width:22px;height:22px}
.ccard header .t{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--text);overflow-wrap:anywhere;min-width:0}
.ccard header .t small{display:block;font-size:13px;font-weight:500;color:var(--text-muted)}
.ccard header .tt{min-width:0}
.cprice{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:var(--r-s);background:var(--surface2)}
.cprice b{display:block;font-size:18px;font-weight:700}
.cprice small{display:block;font-size:13px;color:var(--text-muted);margin-top:1px}
.cprice.best b{color:var(--teal-dark)}
.cprice .tag{flex:none;font-size:12px;font-weight:650;padding:3px 9px;border-radius:var(--r-pill);background:var(--sea-light);color:var(--teal-dark)}
.cp-leer{font-size:15px;color:var(--text-muted)}
.ccard dl{margin:0;display:grid;grid-template-columns:96px 1fr;gap:0;font-size:14px}
.ccard dt,.ccard dd{padding:7px 0;border-top:1px solid var(--border);min-height:38px;display:flex;align-items:center}
.ccard dt:first-of-type,.ccard dd:first-of-type{border-top:0}
.ccard dt{color:var(--text-muted)}
.ccard dd{margin:0;overflow-wrap:anywhere;flex-wrap:wrap;gap:4px 6px}
.ccard dd a{display:inline-flex;align-items:center;gap:4px;font-weight:600;text-decoration:none;min-height:34px}
.ccard dd a .ic{width:16px;height:16px}
.ccard .kp{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%}
.ccard .kp .btn{flex:none}
.stars{letter-spacing:1px;color:var(--mango)}
.stars span{color:var(--border-strong)}
.cnote{margin:0;font-size:14px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:10px}
.ccard footer{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.ccard footer .btn{min-height:44px}
.ccard footer .btn.ghost{margin-right:auto;padding:0 6px}
.chosen{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--teal-dark);min-height:44px}
.muted{color:var(--text-faint);font-weight:400}

/* Leerwerte: optional nicht ausgefüllt (–), wichtig aber nicht eingetragen (neutral), fehlt laut Prüfung (Statusfarbe „fehlt“) */
.v-leer{color:var(--text-faint)}
.v-nicht{color:var(--text-faint);font-size:13px}
.v-fehlt{display:inline-flex;align-items:center;gap:4px;color:var(--missing);font-weight:650;font-size:13px}
.v-fehlt .ic{width:15px;height:15px}

/* ---------- Unterkunft: Liste, Detail, Kartenpunkt ---------- */
.pt{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--text-faint)}
.pt .ic{width:14px;height:14px}
.pt.ok{color:var(--teal)}
.pt.fehlt{color:var(--missing);font-weight:650}
.row.lrow{padding:0;gap:0;align-items:stretch}
.lrow .rowmain{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 6px 11px 14px;border:0;background:none;text-align:left;color:var(--text)}
.lrow .rowmain:active{background:var(--surface2)}
.lrow .rowmain .end{display:flex;align-items:center;flex:none}
.pinbtn{flex:none;width:52px;border:0;border-left:1px solid var(--border);background:none;display:grid;place-items:center;color:var(--teal)}
.pinbtn.leer{color:var(--text-faint)}
.pinbtn:active{background:var(--surface2)}
.row .end .btn.small{min-height:36px;padding:0 12px;font-size:14px}
.row .end .btn.small.ghost{padding:0 6px}
.dhead{display:flex;flex-direction:column;gap:14px}
.dsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dsum > div{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;min-width:0;box-shadow:var(--shadow-soft)}
.dsum > div > span:first-child{display:block;font-size:12px;font-weight:600;color:var(--text-muted)}
.stars{white-space:nowrap}
.dsum b{display:block;font-size:18px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.dsum small{display:block;font-size:13px;color:var(--text-muted);margin-top:1px}
.minimap{position:relative;height:150px;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--sea-light)}
.minimap .mmap{position:absolute;inset:0}

/* ---------- Verbindungsformular ---------- */
.routesum{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow-soft)}
.rs-end{min-width:0}
.rs-end b{display:block;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.rs-end b.offen{color:var(--text-faint);font-weight:600}
.rs-end small{display:block;font-size:12px;color:var(--text-muted);margin-top:2px}
.rs-end:last-child{text-align:right}
.rs-arrow{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sea-light);color:var(--teal-dark)}
.rs-arrow .ic{width:18px;height:18px}

/* ---------- Kartenauswahl ---------- */
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pickrow .hint{padding:0;font-variant-numeric:tabular-nums;min-width:0}
.pickrow .btn{flex:none}

/* ---------- Karte ----------
   Standard ist die helle, warm eingefärbte Karte (Meer Lagune, Land Creme). Satellit ist eine Wahl (#mapWrap.ebene-sat).
   Oben Ansicht und Filter, unten links die Werkzeuge, rechts „+ Spot“. Ein ausgewählter Marker zeigt unten eine Infokarte. */
#mapWrap{position:fixed;inset:0 0 calc(var(--tab) + var(--safe-b)) 0;background:#B8E0D8}
#mapWrap.ebene-sat{background:#1E4A52}
#map{position:absolute;inset:0}
.leaflet-container{background:#B8E0D8;font-family:var(--font)}
.ebene-sat .leaflet-container{background:#1E4A52}
.kref{opacity:.92}
@media (prefers-color-scheme: dark){ #mapWrap:not(.ebene-sat) .leaflet-tile-pane{filter:brightness(.84) saturate(.95)} }
.maptop{position:absolute;top:calc(var(--safe-t) + 10px);left:12px;right:12px;z-index:700;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.maptop > *{pointer-events:auto}
.glass{background:color-mix(in srgb, var(--surface) 90%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid color-mix(in srgb, var(--border) 85%, transparent);box-shadow:0 2px 10px rgba(70,48,24,.10);border-radius:var(--r)}
.maptop .seg{align-self:flex-start;min-width:210px}
.mapfilter{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:3px}
.mf{min-height:38px;padding:0 6px;border-radius:var(--r-s);border:1px solid transparent;background:none;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:650;color:var(--text-faint);white-space:nowrap;min-width:0}
.mf .ic{width:17px;height:17px;flex:none}
.mf[aria-pressed="true"]{color:var(--c);background:color-mix(in srgb, var(--c) 14%, var(--surface));border-color:color-mix(in srgb, var(--c) 30%, transparent)}
.mf[aria-pressed="false"] .ic{opacity:.6}
.mapday{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 12px;font-size:14px;color:var(--text)}
.mapday > .ic{color:var(--teal);width:18px;height:18px}
.mapday span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mapday .navbtn{min-height:36px;font-size:15px}
.mapbar{position:absolute;left:12px;right:12px;bottom:18px;z-index:700;display:flex;align-items:center;justify-content:space-between;gap:10px;pointer-events:none}
.mapbar > *{pointer-events:auto}
.maptools{display:flex;padding:3px;gap:2px}
.maptools button{min-width:44px;height:42px;border:0;background:none;border-radius:var(--r-s);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;color:var(--teal-dark);font-size:14px;font-weight:600}
.maptools button + button{border-left:1px solid transparent}
.maptools button[aria-pressed="true"]{background:var(--teal);color:var(--accent-ink)}
.maptools button.on{color:var(--coral-strong)}
.mapadd{height:46px;padding:0 18px 0 14px;border-radius:23px;border:0;background:var(--coral-strong);color:#fff;font-weight:650;font-size:16px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(70,48,24,.18)}
.mapadd .ic{width:20px;height:20px}
#mapWrap.hascard .mapbar{display:none}
.mapcard{position:absolute;left:12px;right:12px;bottom:20px;z-index:720;background:color-mix(in srgb, var(--surface) 96%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 20px rgba(70,48,24,.14);animation:up .2s ease-out}
.mc-head{display:flex;align-items:flex-start;gap:12px}
.mc-ic{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff}
.mc-ic.hotel{border-radius:12px;background:#245F59}
.mc-ic .ic{width:21px;height:21px}
.mc-t{flex:1;min-width:0}
.mc-t b{display:block;font-size:17px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.mc-t small{display:block;font-size:13px;color:var(--text-muted);margin-top:2px}
.mc-x{width:36px;height:36px;margin:-4px -4px 0 0;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;color:var(--text-muted);flex:none}
.mc-x .ic{width:16px;height:16px}
.mc-facts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mc-fact{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:var(--r-pill);background:var(--surface2);font-size:13px;color:var(--text-muted)}
.mc-fact .ic{width:14px;height:14px}
.mc-acts{display:flex;gap:8px}
.mc-acts .btn{flex:1;min-height:44px;border-radius:var(--r-s)}
/* Marker: Spots rund in der Kategoriefarbe, Unterkünfte als Quadrat (gewählt gefüllt, Kandidat hell). Stopps des aktiven Tages mit Nummer. */
.mpin{position:relative;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;box-shadow:0 0 0 2px #FFFAF2,0 2px 6px rgba(40,25,10,.28);transition:transform .15s}
.mpin .ic{width:58%;height:58%}
.mpin.done{background:#FFFAF2;color:var(--c);box-shadow:0 0 0 2px var(--c),0 2px 6px rgba(40,25,10,.2);opacity:.65}
.mpin.inplan{box-shadow:0 0 0 2px #FFFAF2,0 0 0 4px var(--coral),0 2px 6px rgba(40,25,10,.28)}
.mpin .nr{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;background:var(--coral-strong);color:#fff;font-size:11px;font-weight:750;line-height:18px;text-align:center;box-shadow:0 0 0 2px #FFFAF2}
.hpin{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:#245F59;color:#fff;box-shadow:0 0 0 2px #FFFAF2,0 3px 10px rgba(40,25,10,.32);transition:transform .15s}
.hpin .ic{width:20px;height:20px}
.hpin.kand{background:#FFFAF2;color:#245F59;box-shadow:0 0 0 2px #245F59,0 2px 6px rgba(40,25,10,.22)}
.mpin.sel,.hpin.sel{transform:scale(1.18);box-shadow:0 0 0 3px #FFFAF2,0 0 0 6px var(--coral),0 4px 12px rgba(40,25,10,.3)}
.lbl{display:inline-block;transform:translate(-50%,0);white-space:nowrap;font-weight:650;color:#23413E;text-shadow:0 0 2px #FFFAF2,0 0 4px #FFFAF2,0 0 7px #FFFAF2;pointer-events:none}
.ebene-sat .lbl{color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 8px rgba(0,0,0,.6)}
.lbl.town{font-size:13px}.lbl.town.major{font-size:15px}
.lbl.poi{font-size:12px;transform:none}
.lbl.poi.done{opacity:.6}
.rtlbl{display:inline-block;transform:translate(-50%,-50%);background:#245F59;color:#fff;font-size:12px;font-weight:650;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;box-shadow:0 0 0 2px #FFFAF2}
.mepin{width:18px;height:18px;border-radius:50%;background:#1E7BFF;box-shadow:0 0 0 3px #fff,0 0 0 9px rgba(30,123,255,.18),0 2px 8px rgba(0,0,0,.3)}
.mepin.stale{background:#8AA0B8;box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.3)}
.attrib{position:absolute;left:10px;bottom:3px;z-index:650;font-size:10px;color:rgba(41,58,61,.72);text-shadow:0 0 3px #FFFAF2;pointer-events:none}
.ebene-sat .attrib{color:rgba(255,255,255,.8);text-shadow:0 0 3px #000}
.picker{position:relative;height:min(58vh,460px);margin:0 -16px;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.picker .pmap{position:absolute;inset:0}
.picker .cross{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-38px 0 0 -19px;z-index:600;pointer-events:none;color:var(--coral);filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.picker .cross .ic{width:38px;height:38px;fill:#FFFAF2}

/* ---------- Tagesplan ---------- */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .btn{min-height:40px;padding:0 12px}
.dl{display:flex;flex-direction:column}
.dlrow{display:grid;grid-template-columns:52px 28px 1fr auto;gap:0 10px;align-items:start}
.dlrow .time{font-weight:700;font-size:15px;padding-top:12px;text-align:right;color:var(--text)}
.dlrow .rail{position:relative;display:flex;justify-content:center}
.dlrow .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--border-strong)}
.dlrow:first-child .rail::before{top:18px}
.dlrow:last-child .rail::before{bottom:calc(100% - 18px)}
.dlrow .rail i{position:relative;margin-top:8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c, var(--teal));color:#fff;box-shadow:0 0 0 3px var(--surface)}
.dlrow .rail i .ic{width:15px;height:15px}
.dlrow .body{padding:10px 0;min-width:0}
.dlrow .body .t{font-weight:650;border:0;background:none;padding:0;text-align:left;color:var(--text);font-size:16px;overflow-wrap:anywhere}
.dlrow .body .s{font-size:13px;color:var(--text-muted);margin-top:2px}
.dlrow.leg .time{visibility:hidden}
.dlrow.leg .rail i{display:none}
.dlrow.leg .body{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--text-muted);padding:6px 0}
.dlrow.leg .body .ic{width:17px;height:17px}
.dlrow.leg .body a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600;min-height:34px}
.dlrow.leg.missing .body{color:var(--missing)}
.dlrow .tools{padding-top:8px;display:flex;align-items:center;gap:4px}
.iconbtn{width:42px;height:42px;border-radius:var(--r-s);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-muted)}
.iconbtn .ic{width:18px;height:18px}
.mini{display:inline-flex;align-items:center;gap:4px;margin-top:6px}
.mini button{width:38px;height:34px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface-raised);font-weight:700;color:var(--text)}
.mini output{min-width:54px;text-align:center;font-size:14px;font-weight:600;color:var(--text-muted)}
.summary{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--text-muted);padding:0 4px}
.summary span{display:inline-flex;align-items:center;gap:5px}
.summary .ic{width:17px;height:17px;color:var(--teal)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--r-s);padding:0 12px;min-height:48px}
.search:focus-within{border-color:var(--teal)}
.search .ic{color:var(--text-faint)}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;min-height:46px;min-width:0}
mark{background:var(--warning-bg);color:inherit;border-radius:3px}

/* ---------- Spot ---------- */
.hero{display:flex;gap:14px;align-items:center;padding:0 16px 4px}
.hero .big{width:54px;height:54px;border-radius:var(--r);display:grid;place-items:center;background:var(--c);color:#fff;flex:none}
.hero .big .ic{width:28px;height:28px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.fact{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);font-size:14px;color:var(--text-muted)}
.fact .ic{width:16px;height:16px}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate{min-height:58px;border-radius:var(--r-s);border:1px solid var(--border-strong);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600;color:var(--text-muted)}
.rate.down .ic{transform:scaleY(-1)}
.rate[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--accent-ink)}
.prose{margin:0;font-size:16px;line-height:1.5;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}

/* ---------- Blätter, Hinweise ---------- */
.sheetbg{position:fixed;inset:0;background:rgba(40,28,16,.38);z-index:1000;display:flex;align-items:flex-end;animation:fade .18s ease-out}
.sheet{width:100%;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 16px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:14px;animation:up .24s cubic-bezier(.32,.72,0,1)}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--border-strong);margin:0 auto 2px}
.sheet h3{margin:0;font-size:20px;font-weight:700}
.sheet p{margin:0;color:var(--text-muted)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 10px);transform:translateX(-50%);z-index:1200;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px);padding:11px 16px;border-radius:var(--r);background:#245F59;color:#fff;font-size:15px;font-weight:600;box-shadow:var(--shadow);animation:down .2s ease-out}
.toast .ic{width:18px;height:18px}
.toast.warn{background:var(--danger);color:#fff}
@media (prefers-color-scheme: dark){ .toast{background:#2F5D57} .toast.warn{background:#8E3420} }
@keyframes down{from{transform:translate(-50%,-14px);opacity:.3}to{transform:translate(-50%,0);opacity:1}}
.offline{position:fixed;top:calc(var(--safe-t) + 6px);left:50%;transform:translateX(-50%);z-index:1100;font-size:12px;font-weight:650;padding:4px 10px;border-radius:var(--r-pill);background:var(--text);color:var(--bg)}
.code{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:12px;word-break:break-all;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-s);padding:10px;max-height:120px;overflow:auto;user-select:all}
.ccard header .tt small{display:block;font-size:13px;margin-top:1px}
/* Verbindung im Verlauf: gewählt (Ring), gebucht (gefüllt), Entscheidung offen (Mango-Ring, Untertitel amber), Lücke (gestrichelt, Fläche), Konflikt (rot) */
.tllink .card.gebucht::before{background:var(--teal)}
.tllink .card.offen{border-color:color-mix(in srgb, var(--mango) 55%, var(--border))}
.tllink .card.offen::before{border-color:var(--mango)}
.tllink .card.offen > .ic:first-child{color:var(--warning)}
.tllink .card.offen .t small{color:var(--warning)}
/* Dunkelmodus: Akzentflächen sind dort hell, Schrift darauf dunkel */
@media (prefers-color-scheme: dark){ .tab .dot{color:#2A120C} .chip.c[aria-pressed="true"]{color:#1A1613} }
/* Verkehrsmittel im Reiseverlauf: Symbol in einer ruhigen, gerundeten Fläche. Die Fläche folgt dem Zustand, nicht dem Verkehrsmittel. */
.tllink .card > .ic:first-child{width:34px;height:34px;padding:7px;border-radius:10px;background:var(--sea-light);color:var(--teal-dark)}
.tllink .card.offen > .ic:first-child{background:var(--warning-bg);color:var(--warning)}
.tllink .card.konflikt > .ic:first-child{background:color-mix(in srgb, var(--danger) 14%, var(--surface));color:var(--danger)}
.tllink .card.warn > .ic:first-child{background:color-mix(in srgb, var(--mango) 30%, var(--surface));color:var(--warning)}
.tllink .card.dashed > .ic:first-child{background:var(--sand-soft);color:var(--text-muted)}
.tllink .card.gebucht > .ic:first-child{background:var(--success-bg);color:var(--success)}

</style>
</head>

/* ---------- Hilfsfunktionen ---------- */

function nowParts(){
  const f = new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {date:`${p.year}-${p.month}-${p.day}`, hh:+p.hour, mm:+p.minute, min:+p.hour*60 + +p.minute};
}
const today = () => nowParts().date;
const addDays = (iso,n) => { const d = new Date(iso+"T12:00:00Z"); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); };
const weekday = iso => new Date(iso+"T12:00:00Z").getUTCDay();
const dayDiff = (a,b) => Math.round((new Date(a+"T12:00:00Z")-new Date(b+"T12:00:00Z"))/864e5);
const fmtDate = iso => `${WD[weekday(iso)]} ${iso.slice(8,10)}.${iso.slice(5,7)}.`;
const fmtDateLong = iso => `${WDL[weekday(iso)]}, ${+iso.slice(8,10)}. ${MON[+iso.slice(5,7)-1]}`;
const fmtRange = (a,b) => a && b ? `${+a.slice(8,10)}.${a.slice(5,7) !== b.slice(5,7) ? +a.slice(5,7) + "." : ""} – ${+b.slice(8,10)}.${+b.slice(5,7)}.` : a ? `ab ${fmtDate(a)}` : "ohne Datum";
const toMin = t => { const [h,m] = String(t).split(":").map(Number); return h*60+(m||0); };
const toHHMM = m => { m = Math.round(m); m = ((m%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); };
const durTxt = m => m >= 60 ? (Math.round(m/30)/2).toString().replace(".",",")+" h" : m+" min";
const legTxt = m => m >= 60 ? Math.floor(m/60) + " h" + (m%60 ? " " + m%60 + " min" : "") : m + " min";
const plural = (n, eins, viele) => `${n} ${n === 1 ? eins : viele}`;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const norm = x => String(x||"").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
// Geld nur so genau, wie ihr es eingetragen habt, nie umgerechnet
const money = (n, cur) => Number.isFinite(n) ? new Intl.NumberFormat("de-DE", {style:"currency", currency:cur || "THB", maximumFractionDigits: n % 1 ? 2 : 0}).format(n) : null;
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } } };
// Luftlinie in km, nur für die Reihenfolge, wenn eine Route fehlt. Wird nie als Fahrzeit angezeigt.
const airKm = (a,b) => { const k = Math.PI/180, x = (b.lng-a.lng)*k*Math.cos((a.lat+b.lat)/2*k), y = (b.lat-a.lat)*k; return Math.hypot(x,y)*6371; };
function nearestTown({lat,lng}){ let best=null,bd=1e9; DATA.labels.forEach(([a,b,n]) => { const dd=(a-lat)**2+((b-lng)*Math.cos(lat*Math.PI/180))**2; if(dd<bd){bd=dd;best=n;} }); return best; }
// Koordinaten aus Text lesen: „13.75, 100.50“ oder ein Google-Maps-Link (@lat,lng oder q=lat,lng). Kein Netz, keine Suche.
function parseCoords(text){
  const t = String(text || "");
  const m = t.match(/@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/) || t.match(/[?&](?:q|query|ll|destination)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i) || t.match(/(-?\d{1,2}\.\d{3,})\s*[,;\s]\s*(-?\d{1,3}\.\d{3,})/);
  if(!m) return null;
  const lat = +m[1], lng = +m[2];
  return Math.abs(lat) <= 90 && Math.abs(lng) <= 180 ? {lat:+lat.toFixed(6), lng:+lng.toFixed(6)} : null;
}

/* ===== 02-daten.js ===== */
/* ---------- Daten: lokaler Speicher, Datensätze mit Feld-Zeitstempeln, Spots ----------
   Alles Persönliche liegt nur in localStorage (KEY) und geht nur über den Abgleich ans andere Gerät.
   Datensätze (Spots in over, Reise in stays/lodgings/conns/opts) bekommen je Feld einen Zeitstempel in _t,
   damit der Abgleich Felder einzeln zusammenführt. Löschen setzt weg:true und bleibt als Markierung stehen. */
const KEY = "thailand2027-v1";
const RECORDS = ["over", "stays", "lodgings", "conns", "opts"];
const COLLECTIONS = ["over", "ratings", "days", "plans", "meta", "stays", "lodgings", "conns", "opts", "etappen", "unterkuenfte"];
const S = Object.assign(Object.fromEntries(COLLECTIONS.map(c => [c, {}])), LS.get(KEY) || {});
COLLECTIONS.forEach(c => { if(!S[c] || typeof S[c] !== "object") S[c] = {}; });
S.filter = new Set(Object.keys(GROUPS));
let saveFailed = false, _placesCache = null;
function persist(){
  _placesCache = null;
  const ok = LS.set(KEY, {...Object.fromEntries(COLLECTIONS.map(c => [c, S[c]])), savedAt:Date.now()});
  if(!ok && !saveFailed){ saveFailed = true; toast("Speichern auf diesem Gerät nicht möglich", "warn", 4000); }
  return ok;
}

// Feldweise schreiben: jedes geänderte Feld bekommt seinen eigenen Zeitstempel
function setRec(col, id, patch){
  const now = Date.now(), cur = S[col][id] || {};
  S[col][id] = {...cur, ...patch, at:now, _t:{...(cur._t || {}), ...Object.fromEntries(Object.keys(patch).filter(k => k !== "at" && k !== "_t").map(k => [k, now]))}};
  if(col === "over") _placesCache = null;
  return S[col][id];
}
// Zwei Stände eines Datensatzes zusammenführen: pro Feld gilt der neuere Zeitstempel (Einträge ohne _t zählen mit at)
function mergeRec(a, b){
  if(!a) return b; if(!b) return a;
  const out = {}, t = {};
  for(const f of [...new Set([...Object.keys(a), ...Object.keys(b)])].sort()){
    if(f === "_t" || f === "at") continue;
    const ta = a._t?.[f] ?? a.at ?? 0, tb = b._t?.[f] ?? b.at ?? 0;
    const src = tb > ta || (tb === ta && JSON.stringify(b[f]) > JSON.stringify(a[f])) ? b : a, other = src === a ? b : a;
    const v = f in src ? src[f] : other[f]; if(v !== undefined) out[f] = v; t[f] = Math.max(ta, tb);
  }
  return {...out, _t:t, at:Math.max(a.at || 0, b.at || 0)};
}
// alle nicht gelöschten Datensätze einer Sammlung, mit id
const live = col => Object.entries(S[col]).filter(([, r]) => r && !r.weg).map(([id, r]) => ({...r, id}));
const rec = (col, id) => { const r = id && S[col][id]; return r && !r.weg ? {...r, id} : null; };
const fieldTime = (r, f) => r?._t?.[f] ?? r?.at ?? 0;

/* ---------- Spots ---------- */
const places = () => {
  if(_placesCache) return _placesCache;
  const out = {}; DATA.places.forEach(p => out[p.id] = p);
  for(const [id, o] of Object.entries(S.over)){ const m = {...(out[id] || {}), ...o, id}; if(m.name && Number.isFinite(m.lat) && TYPES[m.typ] && !m.weg) out[id] = m; else delete out[id]; }
  return _placesCache = out;
};
const P = id => places()[id];
const ownSpot = id => !DATA.places.some(p => p.id === id);
const rating = id => S.ratings[id]?.emoji ? S.ratings[id] : null; // {emoji:null} = gelöscht, bleibt für den Abgleich stehen
const setOver = (id, patch) => setRec("over", id, patch);
const touchDay = (d, patch) => { S.days[d] = {...(S.days[d] || {}), ...patch, at:Date.now()}; };
const KEYWORDS = [
  ["markt", /markt|market|talat|basar|bazar/i],
  ["tempel", /tempel|temple|\bwat\b|pagode|pagoda|stupa|chedi|schrein|shrine|buddha/i],

  ["strand", /strand|beach|bucht|\bbay\b|\bao\b|\bkoh\b|\bko\b|insel|island|lagune|lagoon|schnorchel|snorkel|baden/i],
  ["aussicht", /aussicht|viewpoint|view|wasserfall|waterfall|nam ?tok|nationalpark|national park|\bdoi\b|höhle|cave|\btham\b|dschungel|jungle|wander|natur|berg|see\b|park/i],
  ["erlebnis", /museum|kochkurs|cooking|elefant|elephant|massage|muay|show|kajak|kayak|tour|boot|boat|tauchen|dive/i],

];

/* ===== 03-reise.js ===== */
/* ---------- Reise: Aufenthalte, Unterkunftsoptionen, Verbindungen, Transportoptionen ----------
   stays     Aufenthalt (Ort, von = Anreise, bis = Abreise). Nächte = bis − von. Bleibt bestehen, wenn die Unterkunft wechselt.
   lodgings  Unterkunftsoption eines Aufenthalts (stayId), beliebig viele, jede mit Entscheidungsstatus.
   conns     Verbindung von einem Aufenthalt oder Ort (vonStay/vonText) zu einem anderen (nachStay/nachText).
   opts      Transportoption einer Verbindung (connId), beliebig viele, jede mit Entscheidungsstatus.
   Die App wählt nie selbst aus und schätzt keine fehlenden Zeiten oder Preise. */

const stays = () => live("stays").sort((a, b) => (a.von || "9999").localeCompare(b.von || "9999") || (a.bis || "").localeCompare(b.bis || "") || (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id));
const datedStays = () => stays().filter(s => s.von && s.bis);
const nights = s => s?.von && s?.bis ? dayDiff(s.bis, s.von) : null;
const ST_ORDER = {gebucht:0, ausgewaehlt:1, favorit:2, kandidat:3, verworfen:4, storniert:5};
const byStatus = (a, b) => (ST_ORDER[a.status] ?? 3) - (ST_ORDER[b.status] ?? 3) || (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id);
const lodgingsOf = sid => live("lodgings").filter(l => l.stayId === sid).sort(byStatus);
const conns = () => live("conns");
const optsOf = cid => live("opts").filter(o => o.connId === cid).sort(byStatus);

// Gewählt ist eine Option nur, wenn sie die einzige ausgewählte oder gebuchte ist. Sind mehrere gewählt (paralleler Abgleich),
// gilt keine: item ist null, überall wird der Konflikt gezeigt, bis ihr eine behaltet. So bestimmt nie eine zufällige Option
// Tagesstart, Karte oder Prüfung. alle = die gewählten, gebuchte zuerst.
function chosenOf(list){
  const sel = list.filter(o => GEWAEHLT.has(o.status));
  return {item:sel.length === 1 ? sel[0] : null, mehrere:sel.length > 1, alle:sel};
}
const stayLodging = sid => chosenOf(lodgingsOf(sid)).item;
const connOpt = cid => chosenOf(optsOf(cid)).item;
const siblingsOf = (col, r) => col === "lodgings" ? lodgingsOf(r.stayId) : optsOf(r.connId);

// Auswählen: die bisher ausgewählte wird Favorit. Eine gebuchte wird nie automatisch abgewählt.
// Ist die Option schon gewählt und es gibt einen Konflikt, löst dasselbe den Konflikt zu ihren Gunsten („Behalten“).
function chooseOption(col, id){
  const r = rec(col, id); if(!r) return {ok:false};
  const sibs = siblingsOf(col, r);
  const gebucht = sibs.find(o => o.id !== id && o.status === "gebucht");
  if(gebucht) return {ok:false, blockiert:gebucht};
  sibs.filter(o => o.id !== id && o.status === "ausgewaehlt").forEach(o => setRec(col, o.id, {status:"favorit"}));
  if(!GEWAEHLT.has(r.status)) setRec(col, id, {status:"ausgewaehlt"});
  return {ok:true};
}
// Option einem anderen Aufenthalt bzw. einer anderen Verbindung zuordnen (auch zum Retten nach einem Abgleich, siehe Prüfung).
// Ist sie gewählt und dort ist schon eine gewählt, wird nichts verschoben: erst eine der beiden auf Favorit setzen.
function moveOption(col, id, parentId){
  const r = rec(col, id), key = col === "lodgings" ? "stayId" : "connId"; if(!r || !parentId || r[key] === parentId) return {ok:!!r};
  if(GEWAEHLT.has(r.status)){
    const dort = chosenOf(col === "lodgings" ? lodgingsOf(parentId) : optsOf(parentId)).alle[0];
    if(dort) return {ok:false, blockiert:dort};
  }
  setRec(col, id, {[key]:parentId});
  return {ok:true};
}
function setOptionStatus(col, id, status){
  const r = rec(col, id); if(!r) return {ok:false};
  if(status === "ausgewaehlt" || status === "gebucht"){
    const sibs = siblingsOf(col, r);
    const gebucht = sibs.find(o => o.id !== id && o.status === "gebucht");
    if(gebucht) return {ok:false, blockiert:gebucht};
    sibs.filter(o => o.id !== id && o.status === "ausgewaehlt").forEach(o => setRec(col, o.id, {status:"favorit"}));
  }
  setRec(col, id, {status});
  return {ok:true};
}

// Preise: nur was eingetragen ist, je Nacht und gesamt nur bei bekannter Nächtezahl, keine Umrechnung
function lodgingPrice(l, n){
  if(!Number.isFinite(l?.preis)) return {nacht:null, gesamt:null};
  if(l.bezug === "gesamt") return {nacht: n ? l.preis / n : null, gesamt:l.preis};
  return {nacht:l.preis, gesamt: n ? l.preis * n : null};
}

/* ---------- Orte und Bezeichnungen ---------- */
const stayName = s => s?.ort || "Aufenthalt ohne Ort";
const connEnd = (c, seite) => { const sid = c[seite + "Stay"], s = sid && rec("stays", sid); return s ? stayName(s) : c[seite + "Text"] || null; };
const connTitle = c => `${connEnd(c, "von") || "?"} → ${connEnd(c, "nach") || "?"}`;
const optStart = o => o.datum && o.ab ? o.datum + "T" + o.ab : null;
const optEnd = o => (o.anDatum || o.datum) && o.an ? (o.anDatum || o.datum) + "T" + o.an : null;
const optWhen = o => [o.datum ? fmtDate(o.datum) : null, o.ab && o.an ? `${o.ab}–${o.an}${o.anDatum && o.anDatum !== o.datum ? " (" + fmtDate(o.anDatum) + ")" : ""}` : o.ab ? "ab " + o.ab : o.an ? "an " + o.an : null].filter(Boolean).join(" ");
const optDauer = o => o.dauerMin ? (o.dauerOk ? legTxt(o.dauerMin) : "ca. " + legTxt(o.dauerMin)) : null;

/* ---------- Zeitraum und Reisetage ---------- */
const tripRange = () => { const r = S.meta.reise; return r?.start && r?.end && r.end >= r.start ? r : null; };
// Zeitraum der Reise: eingetragen, sonst aus der Planung (Aufenthalte und eindeutig gewählte Verbindungen), sonst null.
// Abgeleitet ist nur ein Vorschlag, festgelegt wird er im Formular „Reisezeitraum“.
function tripBounds(){
  const r = tripRange(); if(r) return {start:r.start, end:r.end, quelle:"eingetragen"};
  const ds = datedStays().filter(s => s.bis > s.von), os = conns().map(c => connOpt(c.id)).filter(o => o?.datum);
  if(!ds.length && !os.length) return null;
  const a = [...ds.map(s => s.von), ...os.map(o => o.datum)].sort(), e = [...ds.map(s => s.bis), ...os.map(o => o.anDatum || o.datum)].sort();
  return {start:a[0], end:e.pop(), quelle:"aus der Planung"};
}
const tripDays = () => { const b = tripBounds(); const a = b ? b.start : today(), n = b ? dayDiff(b.end, b.start) + 1 : 7; return Array.from({length:Math.max(1, n)}, (_, i) => addDays(a, i)); };
const stayForNight = d => datedStays().find(s => s.von <= d && d < s.bis) || null;
const stayForDay = d => stayForNight(d) || stayForNight(addDays(d, -1));
// Nacht d verbringt ihr unterwegs, wenn eine gewählte Option am Tag d (oder früher) abfährt und erst danach ankommt.
// Bei einem Auswahlkonflikt nur, wenn alle gewählten Optionen darin übereinstimmen: nichts wird aus einer zufälligen Option abgeleitet.
const nightInTransit = d => conns().some(c => { const sel = chosenOf(optsOf(c.id)).alle; return sel.length > 0 && sel.every(o => o.datum && o.anDatum && o.datum <= d && d < o.anDatum); });
// Unterkunftsentscheidung eines Aufenthalts als Zustand: gewaehlt (genau eine), konflikt (mehrere), offen (Optionen da), leer
function stayChoice(sid){
  const ls = lodgingsOf(sid), ch = chosenOf(ls), k = ls.filter(l => !RAUS.has(l.status)).length;
  return {...ch, zustand:ch.mehrere ? "konflikt" : ch.item ? "gewaehlt" : k ? "offen" : "leer", aktiv:k};
}
// Unmittelbarer Nachbar eines Aufenthalts für Vorbelegungen: genau ein Aufenthalt, der am Anreisetag endet (vor) bzw. am Abreisetag
// beginnt (nach). Kein oder mehrere Kandidaten (Lücke, Überschneidung) = null, die Seite bleibt offen. Nie für Prüfungen verwenden.
function neighborStay(s, seite){
  if(!s?.von || !s?.bis) return null;
  const c = datedStays().filter(x => x.id !== s.id && x.bis > x.von && (seite === "vor" ? x.bis === s.von : x.von === s.bis));
  return c.length === 1 ? c[0] : null;
}
const connChoice = cid => { const os = optsOf(cid), ch = chosenOf(os), k = os.filter(o => !RAUS.has(o.status)).length; return {...ch, zustand:ch.mehrere ? "konflikt" : ch.item ? "gewaehlt" : k ? "offen" : "leer", aktiv:k}; };

/* ---------- Anschluss an die Tagesplanung ----------
   Ein Tag startet an der gewählten Unterkunft des Aufenthalts der Vornacht und endet an der der Nacht.
   Wechselt der Aufenthalt (Reisetag), endet der Plan beim letzten Stopp, die Weiterreise ist eine Verbindung. */
const NEAR_KM = 80;
const lodgingPoint = l => l && Number.isFinite(l.lat) && Number.isFinite(l.lng) ? {id:l.id, name:l.name, lat:l.lat, lng:l.lng} : null;
const ukNight = d => { const s = stayForNight(d); return s ? lodgingPoint(stayLodging(s.id)) : null; };
const isTravelDay = d => { const a = stayForNight(addDays(d, -1)), b = stayForNight(d); return !!(a && b && a.id !== b.id); };
// Gab es einen Aufenthalt in der Vornacht, startet der Tag nur dort. Ist dessen Unterkunft offen oder ungeklärt, gibt es keinen Start
// (früher sprang der Start dann auf die Unterkunft der nächsten Nacht, am Reisetag also an den falschen Ort).
const dayStart = d => stayForNight(addDays(d, -1)) ? ukNight(addDays(d, -1)) : ukNight(d);
const dayEnd = d => isTravelDay(d) ? null : ukNight(d);
const baseFor = d => ukNight(d) || ukNight(addDays(d, -1));
// alle Unterkünfte mit Ort, die für die Karte und das Vorladen zählen (nicht verworfen oder storniert)
const mapLodgings = () => live("lodgings").filter(l => Number.isFinite(l.lat) && !RAUS.has(l.status) && rec("stays", l.stayId));
// Verbindungen, die an einem Tag abfahren oder ankommen (gewählte Option, sonst die Verbindung selbst)
function connsOnDay(d){
  return conns().map(c => ({c, o:connOpt(c.id)})).filter(({c, o}) => {
    if(o) return o.datum === d || o.anDatum === d;
    const v = c.vonStay && rec("stays", c.vonStay), n = c.nachStay && rec("stays", c.nachStay);
    return v?.bis === d || (!v && n?.von === d);
  });
}

/* ---------- Chronologische Übersicht ----------
   Eine Zeitachse aus Aufenthalten, Verbindungen, Nächten ohne Aufenthalt und Platzhaltern für fehlende Verbindungen.
   Verbindungen stehen am Datum ihrer gewählten Option, sonst an der Ab- bzw. Anreise des verknüpften Aufenthalts.
   So erscheinen auch Flüge ohne verknüpften Aufenthalt an der richtigen Stelle. Am selben Tag gilt:
   Platzhalter davor (0) · ankommende Verbindung (1) · Aufenthalt (2) · abfahrende Verbindung (3) · Platzhalter danach (4) · Lücke (5).
   Ohne Datum und ohne Bezug bleiben nur Verbindungen ohne gewählte Option und Aufenthalte ohne Datum (rest, ohneDatum). */
function overview(){
  const ds = datedStays().filter(s => s.bis > s.von), dsIds = new Set(ds.map(s => s.id)), cs = conns(), b = tripBounds(), items = [], rest = [];
  const put = (d, rang, x) => items.push({...x, _d:d, _r:rang});
  ds.forEach(s => put(s.von, 2, {art:"stay", s}));
  cs.forEach(c => {
    const o = connOpt(c.id), v = dsIds.has(c.vonStay) ? rec("stays", c.vonStay) : null, n = dsIds.has(c.nachStay) ? rec("stays", c.nachStay) : null;
    const d = o?.datum || v?.bis || n?.von;
    if(!d) return rest.push(c);
    put(d, n && d === n.von ? 1 : 3, {art:"conn", c});
  });
  ds.forEach((s, i) => {
    if(i === 0 && !cs.some(c => c.nachStay === s.id)) put(s.von, 0, {art:"connFehlt", nach:s, richtung:"anreise"});
    const next = ds[i + 1];
    if(next && !cs.some(c => c.vonStay === s.id && c.nachStay === next.id)) put(next.von, 0, {art:"connFehlt", von:s, nach:next});
    if(!next && !cs.some(c => c.vonStay === s.id)) put(s.bis, 4, {art:"connFehlt", von:s, richtung:"abreise"});
  });
  if(b){ // Nächte ohne Aufenthalt, zusammengefasst. Eine Nacht in einer gewählten Nachtverbindung (Flug, Nachtzug) ist keine Lücke.
    let start = null;
    for(let d = b.start; d <= b.end; d = addDays(d, 1)){
      const frei = d < b.end && !stayForNight(d) && !nightInTransit(d);
      if(frei && !start) start = d;
      if(!frei && start){ put(start, 5, {art:"luecke", von:start, bis:d, n:dayDiff(d, start)}); start = null; }
    }
  }
  items.sort((x, y) => x._d.localeCompare(y._d) || x._r - y._r);
  const ohneDatum = stays().filter(s => !s.von || !s.bis || s.bis <= s.von);
  return {items, rest, ohneDatum};
}
// Vorhandene Verbindungen, die zu einem Platzhalter passen (die fehlende Seite ist noch frei), passende Ortsnamen zuerst
function connCandidates(x){
  // keine Verbindung, die schon von diesem Ort abfährt, als Anreise anbieten (und umgekehrt)
  const ab = (c, s) => c.vonStay === s.id || (!c.vonStay && c.vonText && norm(c.vonText) === norm(stayName(s)));
  const an = (c, s) => c.nachStay === s.id || (!c.nachStay && c.nachText && norm(c.nachText) === norm(stayName(s)));
  const frei = c => x.von && x.nach ? (!c.vonStay || c.vonStay === x.von.id) && (!c.nachStay || c.nachStay === x.nach.id) : x.nach ? !c.nachStay && !ab(c, x.nach) : !c.vonStay && !an(c, x.von);
  const passt = c => !!((x.nach && c.nachText && norm(c.nachText) === norm(stayName(x.nach))) || (x.von && c.vonText && norm(c.vonText) === norm(stayName(x.von))));
  return conns().filter(frei).sort((a, c) => passt(c) - passt(a));
}
// Verbindung mit dem Aufenthalt des Platzhalters verknüpfen. Der bisherige Ortstext bleibt stehen, angezeigt wird der Aufenthalt.
function linkConn(cid, x){
  const c = rec("conns", cid); if(!c) return false;
  const patch = {};
  if(x.von && !c.vonStay) patch.vonStay = x.von.id;
  if(x.nach && !c.nachStay) patch.nachStay = x.nach.id;
  if(Object.keys(patch).length) setRec("conns", cid, patch);
  return true;
}

/* ---------- Prüfung ----------
   konflikt = echter Widerspruch, fehlt = es fehlt ein Eintrag, offen = noch keine Entscheidung.
   Jeder Punkt nennt, wohin ein Tipp führt. Nichts wird automatisch gewählt oder geschätzt. */
function planIssues(){
  const out = [], add = (lvl, text, ziel, datum) => out.push({lvl, text, ziel, datum:datum || ""});
  const all = stays(), ds = datedStays(), r = tripRange();
  if(!r) add("offen", "Reisezeitraum noch nicht festgelegt", ["zeitraum"]);
  all.filter(s => s.von && s.bis && s.bis <= s.von).forEach(s => add("konflikt", `${stayName(s)}: Abreise liegt nicht nach der Anreise`, ["stay", {id:s.id}], s.von));
  all.filter(s => !s.von || !s.bis).forEach(s => add("fehlt", `${stayName(s)}: An- oder Abreisedatum fehlt`, ["stay", {id:s.id}]));
  for(let i = 0; i < ds.length; i++) for(let j = i + 1; j < ds.length; j++){
    const a = ds[i], c = ds[j];
    if(a.bis > a.von && c.bis > c.von && a.von < c.bis && c.von < a.bis) add("konflikt", `${stayName(a)} und ${stayName(c)} überschneiden sich`, ["stay", {id:c.id}], c.von);
  }
  if(r) ds.filter(s => s.von < r.start || s.bis > r.end).forEach(s => add("konflikt", `${stayName(s)} liegt außerhalb des Reisezeitraums`, ["stay", {id:s.id}], s.von));
  const ov = overview();
  ov.items.filter(x => x.art === "luecke").forEach(x => add("fehlt", `${plural(x.n, "Nacht", "Nächte")} ohne Aufenthalt (${fmtRange(x.von, x.bis)})`, ["neuStay", {von:x.von, luecke:x.bis}], x.von));
  ds.forEach(s => {
    const ch = stayChoice(s.id);
    if(ch.zustand === "konflikt") add("konflikt", `${stayName(s)}: ${ch.alle.length} Unterkünfte gleichzeitig gewählt, bis ihr eine behaltet, gilt keine`, ["stay", {id:s.id}], s.von);
    else if(ch.zustand === "offen") add("offen", `${stayName(s)}: Unterkunft noch nicht gewählt (${plural(ch.aktiv, "Option", "Optionen")})`, ["stay", {id:s.id}], s.von);
    else if(ch.zustand === "leer") add("offen", `${stayName(s)}: noch keine Unterkunft erfasst`, ["stay", {id:s.id}], s.von);
    else if(!lodgingPoint(ch.item)) add("fehlt", `${stayName(s)}: Kartenpunkt der gewählten Unterkunft fehlt, Tagespläne haben keinen Startpunkt`, ["ortWahl", {lodgingId:ch.item.id}], s.von);
  });
  ov.items.filter(x => x.art === "connFehlt").forEach(x => add("fehlt",
    x.richtung === "anreise" ? `Anreise nach ${stayName(x.nach)} fehlt` : x.richtung === "abreise" ? `Abreise ab ${stayName(x.von)} fehlt` : `Keine Verbindung ${stayName(x.von)} → ${stayName(x.nach)}`,
    ["neuConn", {vonStay:x.von?.id || null, nachStay:x.nach?.id || null}], x.von?.bis || x.nach?.von));
  // Nach einem Abgleich kann eine Option an einem gelöschten Aufenthalt oder einer gelöschten Verbindung hängen. Sie ginge sonst still verloren.
  live("lodgings").filter(l => !rec("stays", l.stayId)).forEach(l => add("konflikt", `${l.name || "Unterkunft"}: gehört zu einem gelöschten Aufenthalt, neu zuordnen oder löschen`, ["lodgingEdit", {id:l.id}]));
  live("opts").filter(o => !rec("conns", o.connId)).forEach(o => add("konflikt", `${[TRANSPORT[o.art]?.[0], o.anbieter].filter(Boolean).join(" ") || "Transportoption"}: gehört zu einer gelöschten Verbindung, neu zuordnen oder löschen`, ["optEdit", {id:o.id}], o.datum));
  conns().forEach(c => {
    const ch = connChoice(c.id), t = connTitle(c);
    if(!connEnd(c, "von") || !connEnd(c, "nach")) add("fehlt", `Verbindung ${t}: Start oder Ziel fehlt`, ["conn", {id:c.id}]);
    // Bei einem Konflikt wird keine der gewählten Optionen weiter geprüft, sonst stammten Zeiten und Preise aus einer zufälligen
    if(ch.zustand === "konflikt") return add("konflikt", `${t}: ${ch.alle.length} Optionen gleichzeitig gewählt, bis ihr eine behaltet, gilt keine`, ["conn", {id:c.id}], ch.alle[0]?.datum);
    if(!ch.item){ add("offen", ch.aktiv ? `${t}: noch keine Option gewählt` : `${t}: noch keine Option erfasst`, ["conn", {id:c.id}], optsOf(c.id)[0]?.datum); return; }
    const o = ch.item, st = optStart(o), en = optEnd(o);
    if(st && en && en < st) add("konflikt", `${t}: Ankunft liegt vor der Abfahrt`, ["opt", {id:o.id}], o.datum);
    const v = c.vonStay && rec("stays", c.vonStay), n = c.nachStay && rec("stays", c.nachStay);
    if(v?.bis && o.datum && o.datum !== v.bis) add("konflikt", `${t}: Abfahrt am ${fmtDate(o.datum)}, Abreise aus ${stayName(v)} am ${fmtDate(v.bis)}`, ["opt", {id:o.id}], o.datum);
    const anD = o.anDatum || o.datum;
    if(n?.von && anD && o.an && anD !== n.von) add("konflikt", `${t}: Ankunft am ${fmtDate(anD)}, Aufenthalt in ${stayName(n)} beginnt am ${fmtDate(n.von)}`, ["opt", {id:o.id}], anD);
    if(r && o.datum && (o.datum < r.start || o.datum > r.end)) add("konflikt", `${t}: liegt außerhalb des Reisezeitraums`, ["opt", {id:o.id}], o.datum);
    const fehlt = [!o.datum && "Datum", !o.ab && "Abfahrt", !o.an && "Ankunft", !Number.isFinite(o.preis) && o.status !== "gebucht" && "Preis"].filter(Boolean);
    if(fehlt.length) add("fehlt", `${t}: ${fehlt.join(", ")} fehlt`, ["opt", {id:o.id}], o.datum);
  });
  const rang = {konflikt:0, fehlt:1, offen:2};
  return out.sort((a, c) => rang[a.lvl] - rang[c.lvl] || (a.datum || "9999").localeCompare(c.datum || "9999"));
}

/* ---------- Übernahme der Daten aus Version 1 (etappen, unterkuenfte) ----------
   Wiederholbar: legt nur an, was noch fehlt. Gleiche IDs und Zeitstempel auf beiden Geräten, damit der Abgleich zusammenpasst.
   Alte Unterkunft u → Aufenthalt st-<u> plus Option u. Alte Etappe e → Verbindung cn-<e> plus Option e. */
const ALT_STATUS = {idee:"kandidat", geplant:"ausgewaehlt", gebucht:"gebucht"};
function migrateLegacy(){

    S.lodgings[id] = stamped({stayId:sid, name:u.name || "Unterkunft", art:null, lat:Number.isFinite(u.lat) ? u.lat : null, lng:Number.isFinite(u.lng) ? u.lng : null, status:ALT_STATUS[u.status] || "kandidat", notiz:u.notiz || null, createdAt:u.createdAt || t}, t);
    n++;

    const t = e.at || Date.now(), cid = "cn-" + id;
    const find = txt => { const k = norm(txt); return k ? Object.entries(S.stays).find(([, s]) => !s.weg && norm(s.ort) === k)?.[0] || null : null; };
    if(!S.conns[cid]){ const vs = find(e.von), ns = find(e.nach); S.conns[cid] = stamped({vonStay:vs, vonText:vs ? null : e.von || null, nachStay:ns, nachText:ns ? null : e.nach || null, notiz:null, createdAt:e.createdAt || t}, t); }
    S.opts[id] = stamped({connId:cid, art:TRANSPORT[e.art] ? e.art : "sonst", datum:e.datum || null, ab:e.ab || null, anDatum:e.anDatum || null, an:e.an || null, dauerMin:e.dauerMin || null, dauerOk:!!e.dauerOk, anbieter:e.anbieter || null, nummer:null, preis:null, waehrung:null, link:null, status:ALT_STATUS[e.status] || "kandidat", notiz:[e.notiz, e.kosten ? "Kosten (alt): " + e.kosten : null].filter(Boolean).join("\n") || null, createdAt:e.createdAt || t}, t);
    n++;
  }
  return n;
}
// Aufenthalt löschen: seine Unterkunftsoptionen gehen mit, Verbindungen bleiben und behalten den Ortsnamen als Text
function deleteStay(id){
  const s = rec("stays", id); if(!s) return;
  lodgingsOf(id).forEach(l => setRec("lodgings", l.id, {weg:true}));
  conns().forEach(c => {
    if(c.vonStay === id) setRec("conns", c.id, {vonStay:null, vonText:stayName(s)});
    if(c.nachStay === id) setRec("conns", c.id, {nachStay:null, nachText:stayName(s)});
