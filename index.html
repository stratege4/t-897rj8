      : zStart === "gewaehlt" ? row({icon:"pin", c:"--fehlt", t:"Kartenpunkt der Unterkunft fehlt", s:`${esc(stayLodging(sStart.id).name)}: ohne Punkt beginnt der Plan beim ersten Stopp. Jetzt setzen`, go:"ortWahl", p:{lodgingId:stayLodging(sStart.id).id}})
      : row({icon:"hotel", t:sStart ? "Noch keine Unterkunft gewählt" : "Kein Aufenthalt an diesem Tag", s:sStart ? "Ohne Startpunkt beginnt der Plan beim ersten Stopp" : "Aufenthalt in „Reise“ anlegen", go:sStart ? "stay" : "neuStay", p:sStart ? {id:sStart.id} : {von:d}}),
    ...cs.map(({c, o}) => { const z = connChoice(c.id).zustand; return row({icon:o ? TRANSPORT[o.art]?.[1] || "reise" : z === "konflikt" ? "warn" : "reise", c:z === "konflikt" ? "--konflikt" : null, t:esc(connTitle(c)), s:esc(o ? [optWhen(o), STATUS[o.status]].filter(Boolean).join(" · ") : z === "konflikt" ? "Mehrere Optionen gewählt, ungeklärt" : "noch keine Option gewählt"), go:"conn", p:{id:c.id}}); }),
  ];
  let body;

  else {
    const plan = pl.plan, rows = timeline(plan), endT = rows[rows.length - 1].time, anz = plan.stationen.filter(x => P(x.placeId)).length;
    const drive = rows.filter(r => r.kind === "drive").reduce((a, r) => a + (r.min || 0), 0), missing = rows.filter(r => r.kind === "drive" && r.min === null).length;
    const km = rows.filter(r => r.kind === "drive").reduce((a, r) => a + (r.km || 0), 0);
    const link = r => `<a href="${mapsLeg(r.from, r.to, mode)}" target="_blank" rel="noopener">${ic("route")}Route</a>`;
    const tl = rows.filter(r => r.kind !== "end").map(r => {
      if(r.kind === "drive"){
        if(mode === "frei"){ const k = rkey(rid(r.from), rid(r.to)); return `<div class="dlrow leg${r.min === null ? " missing" : ""}"><span class="time"></span><span class="rail"><i></i></span><div class="body">${ic(M.icon)}<span>${r.min === null ? "Zeit offen" : legTxt(r.min) + " (eure Angabe)"}</span><span class="mini"><button data-leg="${k}" data-dd="-5" aria-label="5 Minuten weniger">−</button><button data-leg="${k}" data-dd="5" aria-label="5 Minuten mehr">+</button></span>${link(r)}</div><span></span></div>`; }
        if(r.min === null) return `<div class="dlrow leg missing"><span class="time"></span><span class="rail"><i></i></span><div class="body">${ic(M.icon)}<span>${mode === "fuss" && airKm(r.from, r.to) > 25 ? "Zu weit zum Gehen" : (mode === "fuss" ? "Gehzeit" : "Fahrzeit") + " noch nicht berechnet"}</span>${link(r)}</div><span></span></div>`;
        return `<div class="dlrow leg"><span class="time"></span><span class="rail"><i></i></span><div class="body">${ic(M.icon)}<span>ca. ${legTxt(r.min)}${mode === "fuss" ? " zu Fuß" : ""}${r.km >= 1 ? " · " + Math.round(r.km) + " km" : ""}${mode === "fuss" && r.min > 60 ? " · weiter Fußweg" : ""}</span>${link(r)}</div><span></span></div>`;
      }

      return `<div class="dlrow"><span class="time">${toHHMM(r.time)}</span><span class="rail"><i style="--c:var(${c})">${ic(icon)}</i></span><div class="body">${r.place ? `<button class="t" ${attrGo("spot", {id:r.place.id})}>${esc(r.name)}</button><div class="mini"><button data-stay="${r.index}" data-dd="-15" aria-label="Kürzer bleiben">−</button><output>${durTxt(r.dauer)}</output><button data-stay="${r.index}" data-dd="15" aria-label="Länger bleiben">+</button></div>` : `<span class="t">${esc(r.name)}</span>`}</div>${r.index !== undefined ? `<span class="tools"><button class="iconbtn" data-del="${r.index}" aria-label="${esc(r.name)} aus dem Tag nehmen">${ic("x")}</button></span>` : "<span></span>"}</div>`;

/* ---------- Bereich Karte: Spots, Unterkünfte, Route des aktiven Tages ----------
   Die Karte (Leaflet) wird einmal angelegt und bleibt bestehen, Detailseiten legen sich darüber.
   Zwei Kartenebenen vom selben Anbieter (Esri, server.arcgisonline.com, der Service Worker speichert beide wie bisher):
   „Karte“  helle Grundkarte (Light Gray Canvas), auf dem Gerät warm eingefärbt, darüber Esris Beschriftung. Standard.
   „Satellit“ Luftbild wie bisher, wahlweise. Die Wahl gilt nur auf diesem Gerät (localStorage), sie ändert keine Daten.
   Vorgeladen werden für die Karte die Landesübersicht (Zoom 5 bis 8) und 6 km um jede Unterkunft (Zoom 10 bis 14). */
let map = null, markerLayer, routeLayer, poiLabelLayer, meLayer;
const TILE_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const BASE_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}";
const REF_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}";
const ATTRIB = {karte:"Karte © Esri, HERE, Garmin, OpenStreetMap-Mitwirkende", sat:"Bilder © Esri, Maxar, Earthstar Geographics"};
const VIEW = {center:[13.0, 101.0], bounds:[[4.5, 96.5], [21.5, 106.5]]};
UI.karteModus = "karte";
UI.mapSel = null; // ausgewählter Marker {art:"spot"|"lodging", id}
let ebene = LS.get("thailand2027-ebene") === "sat" ? "sat" : "karte", ebenen = {};
const zoomBucket = z => z < 11 ? 0 : z < 12 ? 1 : 2;
let lastBucket = -1;

// Farbtabelle für die helle Karte: Esri liefert Graustufen (Wasser 208, Land 232 bis 239, Linien dunkler).
// Jede Graustufe bekommt einen warmen Farbton: Wasser Lagune, Küstensaum Salbei, Land Creme. Kantenglättung bleibt erhalten.
const WARM_LUT = (() => {
  const st = [[0,[60,82,80]], [150,[132,150,144]], [196,[150,200,192]], [208,[184,224,216]], [220,[208,226,204]], [228,[233,225,206]], [236,[242,234,217]], [250,[252,248,239]], [255,[255,253,248]]];
  const r = new Uint8ClampedArray(256), g = new Uint8ClampedArray(256), b = new Uint8ClampedArray(256);
  for(let i = 0; i < 256; i++){ let k = 0; while(k < st.length - 2 && i > st[k + 1][0]) k++; const [a0, c0] = st[k], [a1, c1] = st[k + 1], f = Math.min(1, Math.max(0, (i - a0) / (a1 - a0))); r[i] = c0[0] + (c1[0] - c0[0]) * f; g[i] = c0[1] + (c1[1] - c0[1]) * f; b[i] = c0[2] + (c1[2] - c0[2]) * f; }
  return {r, g, b};
})();
// Helle Karte als eigene Kachelebene: Bild laden, einfärben, als Canvas zeigen. Geht das Einfärben nicht (fremder Cache), bleibt das Graubild.
function warmLayer(opt = {}){
  const W = L.GridLayer.extend({ createTile(c, done){
    const t = document.createElement("canvas"); t.width = t.height = 256;
    const img = new Image(); img.crossOrigin = "anonymous";
    img.onload = () => { const g = t.getContext("2d"); g.drawImage(img, 0, 0);
      try{ const d = g.getImageData(0, 0, 256, 256), a = d.data, {r, g:gg, b} = WARM_LUT; for(let i = 0; i < a.length; i += 4){ const l = (a[i] * 77 + a[i+1] * 150 + a[i+2] * 29) >> 8; a[i] = r[l]; a[i+1] = gg[l]; a[i+2] = b[l]; } g.putImageData(d, 0, 0); }catch(e){}
      done(null, t); };
    img.onerror = () => done(new Error("Kachel fehlt"), t);
    img.src = BASE_URL.replace("{z}", c.z).replace("{y}", c.y).replace("{x}", c.x);
    return t; } });

const refLayer = (opt = {}) => L.tileLayer(REF_URL, {maxNativeZoom:16, maxZoom:18, minZoom:5, crossOrigin:true, updateWhenZooming:false, className:"kref", ...opt});
// für kleine Karten (Unterkunftsdetail): dieselbe helle Karte mit Beschriftung
const karteLayers = () => [warmLayer(), refLayer({zIndex:3})];

function tileUrls(sw, ne, z0, z1, tmpl = TILE_URL){
  const out = [];
  for(let z = z0; z <= z1; z++){ const a = map.project([ne[0], sw[1]], z).divideBy(256).floor(), b = map.project([sw[0], ne[1]], z).divideBy(256).floor();
    for(let x = a.x; x <= b.x; x++) for(let y = a.y; y <= b.y; y++) out.push(tmpl.replace("{z}", z).replace("{y}", y).replace("{x}", x)); }
  return out;
}
// Vorladen gilt der Standardkarte (Grundkarte und Beschriftung, beide klein). Satellit wird nicht mehr vorgeladen, nur was ihr anseht, landet im Speicher.
// Eigene Schlüssel mit „karte:“, damit erledigte Satelliten-Jobs aus älteren Fassungen die neue Ebene nicht blockieren. Die Grenze von 4000 Kacheln im Service Worker gilt unverändert.
const tileJobKey = u => "karte:uk:" + u.lat.toFixed(3) + "," + u.lng.toFixed(3);
const beide = (sw, ne, z0, z1) => [...tileUrls(sw, ne, z0, z1, BASE_URL), ...tileUrls(sw, ne, z0, z1, REF_URL)];
let prefetching = false;
async function prefetchTiles(){
  const con = navigator.connection;
  if(prefetching || !map || navigator.onLine === false || con?.saveData || !navigator.serviceWorker?.controller) return;
  const done = new Set(LS.get("thailand2027-tiles") || []), jobs = [];
  if(!done.has("karte:land")) jobs.push(["karte:land", beide(VIEW.bounds[0], VIEW.bounds[1], 5, 8)]);
  mapLodgings().forEach(u => { const k = tileJobKey(u); if(done.has(k)) return; const dy = 6/111, dx = dy/Math.cos(u.lat*Math.PI/180); jobs.push([k, beide([u.lat-dy, u.lng-dx], [u.lat+dy, u.lng+dx], 10, 14)]); });
  if(!jobs.length) return;
  prefetching = true;
  try{
    for(const [k, urls] of jobs){
      let ok = 0;
      for(let i = 0; i < urls.length; i += 4){
        if(navigator.onLine === false) return;
        const r = await Promise.all(urls.slice(i, i+4).map(u => fetch(u, {mode:"cors"}).then(x => x.ok).catch(() => false)));
        ok += r.filter(Boolean).length; await new Promise(res => setTimeout(res, 120));

}

    L.marker([p.lat, p.lng], {keyboard:true, zIndexOffset:on ? 4500 : done ? -300 : nr ? 500 : 0, title:p.name + (done ? ", schon gesehen" : ""), icon:L.divIcon({className:"", html:`<div class="mpin${done ? " done" : ""}${nr ? " inplan" : ""}${on ? " sel" : ""}" style="--c:var(${TYPES[p.typ][1]});width:${size}px;height:${size}px">${ic(TIC(p.typ))}${nr ? `<b class="nr">${nr}</b>` : ""}</div>`, iconSize:[size,size], iconAnchor:[size/2,size/2]})})
      .addTo(markerLayer).on("click", e => { L.DomEvent.stopPropagation(e); openMapCard({art:"spot", id:p.id}); });
    if(bucket === 2 && !TOWNNAMES.has(p.name)) L.marker([p.lat, p.lng], {interactive:false, keyboard:false, zIndexOffset:-500, icon:L.divIcon({className:"", html:`<span class="lbl poi${done ? " done" : ""}">${esc(p.name)}</span>`, iconSize:null, iconAnchor:[-size/2-4, 10]})}).addTo(poiLabelLayer);
  });
  const box = $("#mDay");
  if(pl && pl.plan.stationen.some(s => P(s.placeId))){
    const legs = planLegs(pl.plan), mode = modeOf(pl.plan);
    ensureRoutes(legs, mode);
    // Route: auf der hellen Karte petrol mit cremefarbenem Rand, auf dem Satellitenbild hell mit dunklem Rand
    const [rand, linie] = sat ? ["#0B1411", "#7FE0C6"] : ["#FFFAF2", "#2A7A72"];
    const gezeigt = []; // Beschriftungen, die sich überdecken würden (Hin- und Rückweg auf fast derselben Straße), nur einmal
    legs.forEach(([a, b]) => {
      const r = routeFor(a, b, mode), lt = legTime(pl.plan, a, b);
      const pts = r && r[2] ? decodePoly(r[2]) : [[a.lat, a.lng], [b.lat, b.lng]];
      const dash = r ? null : "2 10"; // ohne berechnete Route nur gestrichelt, keine Straßenlinie
      L.polyline(pts, {color:rand, opacity:sat ? .55 : .95, weight:8, lineCap:"round", lineJoin:"round", dashArray:dash, interactive:false}).addTo(routeLayer);
      L.polyline(pts, {color:linie, opacity:1, weight:4, lineCap:"round", lineJoin:"round", dashArray:dash, interactive:false}).addTo(routeLayer);
      const mid = midOf(pts), px = map.latLngToContainerPoint(mid), frei = !gezeigt.some(q => Math.abs(q.x - px.x) < 90 && Math.abs(q.y - px.y) < 28);
      if(lt.min !== null && lt.min >= (bucket === 0 ? 20 : 3) && frei && gezeigt.push(px)) L.marker(mid, {interactive:false, keyboard:false, zIndexOffset:-800, icon:L.divIcon({className:"", html:`<span class="rtlbl">${lt.src === "eigen" ? "" : "ca. "}${lt.min} min${mode === "fuss" ? " zu Fuß" : ""}</span>`, iconSize:null, iconAnchor:[0,0]})}).addTo(routeLayer);
    });
    if(box){ box.hidden = false; box.innerHTML = `${ic("route")}<span>Route ${esc(fmtDate(ad))} · ${plural(order.size, "Stopp", "Stopps")}</span><button class="navbtn" data-openday>Tag öffnen</button>`; box.querySelector("[data-openday]").onclick = () => go("day", {d:ad}); }
  } else if(box) box.hidden = true;
}

function midOf(pts){
  const d = pts.slice(1).map((p, i) => Math.hypot(p[0]-pts[i][0], (p[1]-pts[i][1])*.77));
  let half = d.reduce((a, b) => a + b, 0)/2;
  for(let i = 0; i < d.length; i++){ if(half <= d[i]){ const f = d[i] ? half/d[i] : 0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f]; } half -= d[i]; }
  return pts[0];
}

/* ---------- Eigener Standort ---------- */
let ME = null, meWatch = null, meError = null, meFollow = false;
const IN_AREA = (lat, lng) => lat > VIEW.bounds[0][0] && lat < VIEW.bounds[1][0] && lng > VIEW.bounds[0][1] && lng < VIEW.bounds[1][1];
function drawMe(){
  if(!map || !meLayer) return; meLayer.clearLayers(); if(!ME) return;
  const stale = Date.now() - ME.at > 120000;
  if(ME.acc < 1500) L.circle([ME.lat, ME.lng], {radius:ME.acc, color:"#1E7BFF", weight:1, opacity:.5, fillOpacity:.1, interactive:false}).addTo(meLayer);
  L.marker([ME.lat, ME.lng], {zIndexOffset:4000, keyboard:false, title:"Du bist hier", icon:L.divIcon({className:"", html:`<div class="mepin${stale ? " stale" : ""}"></div>`, iconSize:[18,18], iconAnchor:[9,9]})}).addTo(meLayer);
}
function centerMe(){
  if(ME && ME.inArea) return map?.setView([ME.lat, ME.lng], Math.max(map.getZoom(), 14));
  if(ME) return toast("Du bist gerade nicht in Thailand", "standort");
  if(meError === 1) return toast("Standort nicht freigegeben. In den Einstellungen für diese Seite erlauben.", "warn", 4000, true);
  if(!navigator.geolocation) return toast("Standort nicht verfügbar", "warn", 2600, true);
  meFollow = true; startLocate(); toast("Standort wird gesucht", "standort");
}
function startLocate(){
  if(!navigator.geolocation || meWatch !== null) return;
  meWatch = navigator.geolocation.watchPosition(pos => {
    const {latitude:lat, longitude:lng, accuracy} = pos.coords;
    meError = null; ME = {lat, lng, acc:accuracy, at:Date.now(), inArea:IN_AREA(lat, lng)};
    drawMe(); if(meFollow){ meFollow = false; centerMe(); }
    $("#mLoc")?.classList.toggle("on", ME.inArea);
  }, err => { meError = err.code; if(err.code === 1){ stopLocate(); ME = null; drawMe(); } }, {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}
function stopLocate(){ if(meWatch !== null){ navigator.geolocation.clearWatch(meWatch); meWatch = null; } }

        row({icon:"pin", t:"Spots", s:plural(n.spots, "Spot", "Spots") + (hidden.length ? `, davon ${hidden.length} ausgeblendet` : ""), go:hidden.length ? "ausgeblendet" : null}),

VIEWS.syncSend = () => ({title:"Stand senden", large:true,
  html:`<ol class="hint" style="font-size:15px;color:var(--ink2);padding-left:20px;margin:0;display:flex;flex-direction:column;gap:6px"><li>„Code kopieren“ tippen.</li><li>Den Code per Nachricht ans andere iPhone schicken.</li><li>Dort in der installierten App unter „Mehr“ den Stand übernehmen.</li></ol>
    <button class="btn primary block" data-act="copy">${ic("kopieren")}Code kopieren</button>
    <div class="code" id="code" hidden></div>
    <button class="btn block" data-act="share">${ic("teilen")}Als Link teilen</button>
    <p class="hint">Ein Link öffnet nur Safari, nicht die installierte App, weil iOS beide getrennt speichert. In der installierten App immer den Code nehmen.</p>`,
  mount(el){
    el.querySelector('[data-act="copy"]').onclick = async () => {
      const code = await packState(), box = el.querySelector("#code");
      try{ await navigator.clipboard.writeText(code); toast("Code kopiert"); box.hidden = true; }
      catch(e){ box.hidden = false; box.textContent = code; toast("Kopieren nicht erlaubt, Code unten markieren", "info", 3200); }
    };
    el.querySelector('[data-act="share"]').onclick = async () => {
      const url = location.origin + location.pathname + "#sync=" + await packState();
      if(url.length > 60000) return toast("Zu groß für einen Link, bitte den Code nehmen", "warn", 3500, true);
      if(navigator.share){ try{ await navigator.share({title:"Thailand-Stand", text:url}); return; }catch(e){ if(e.name === "AbortError") return; } }
      try{ await navigator.clipboard.writeText(url); toast("Link kopiert"); }catch(e){ toast("Teilen nicht möglich", "warn", 2600, true); }
    };
  }});
VIEWS.syncReceive = () => ({title:"Stand übernehmen", form:true,
  html:`<p class="hint">Code vom anderen iPhone einfügen. Es wird zusammengeführt: bei jedem Feld gilt die neuere Änderung, nichts wird ungefragt gelöscht.</p>
    <div class="fgroup">${fArea("code", "Code", "", "Hier einfügen")}</div>`,
  bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="apply">Übernehmen</button>`,
  mount(el){ el.querySelector('[data-act="apply"]').onclick = async () => { const v = readForm(el).code; if(!v) return toast("Kein Code eingefügt", "warn", 2400, true); const r = await importCode(v); if(!r.ok) return toast(r.grund, "warn", 3600, true); back(); syncResult(r.n); }; }});
function syncResult(n){
  onDataChanged();
  sheet(`<h3>${n ? plural(n, "Änderung", "Änderungen") + " übernommen" : "Ihr wart schon gleichauf"}</h3><p>Zusammengeführt, nichts überschrieben. Jetzt einmal den eigenen Stand zurücksenden, dann ist das andere iPhone auch aktuell.</p>
    <div class="btns"><button class="btn" data-x>Später</button><button class="btn primary" data-back-send>${ic("kopieren")}Zurücksenden</button></div>`,
    sh => { sh.querySelector("[data-x]").onclick = closeSheets; sh.querySelector("[data-back-send]").onclick = () => { closeSheets(); openInTab("mehr", "syncSend"); }; });
}
function syncFromLink(){
  const m = location.hash.match(/^#sync=(.+)$/); if(!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  importCode(m[1]).then(r => r.ok ? syncResult(r.n) : toast(r.grund, "warn", 3600, true));
}
VIEWS.sicherung = () => ({title:"Sicherung", large:true,
  html:`<p class="hint">Eine Datei mit eurem ganzen Stand, zum Aufbewahren oder wenn ein Code zu groß wird. Laden führt zusammen wie der Abgleich.</p>
    <div class="btns"><button class="btn primary" data-act="exp">${ic("herunter")}Sichern</button><label class="btn" for="imp">${ic("einfuegen")}Laden</label><input type="file" id="imp" accept="application/json,.json" hidden></div>`,
  mount(el){
    el.querySelector('[data-act="exp"]').onclick = async () => {
      const file = new File([JSON.stringify({...snapshot(), exportiertAm:new Date().toISOString()}, null, 1)], `thailand-${today()}.json`, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:"Thailand Sicherung"}); return; }catch(e){ if(e.name === "AbortError") return; } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
    el.querySelector("#imp").onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      try{ const js = JSON.parse(await f.text()); if(js.app !== SYNC_KEY) throw 0; const n = mergeState(js); persist(); syncResult(n); }
      catch(err){ toast("Die Datei gehört nicht zu diesem Reiseplaner", "warn", 3200, true); }
    };
  }});

/* ---------- Start ---------- */
const APP_VERSION = "Version 2.4";
migrateLegacy() && persist(); // Daten aus Version 1 übernehmen, wiederholbar
render();
syncFromLink();
addEventListener("hashchange", syncFromLink);
// Akku schonen: nur orten, solange die App sichtbar ist und der Standort einmal angefragt wurde
document.addEventListener("visibilitychange", () => { if(document.hidden) stopLocate(); else if(ME && meError !== 1) startLocate(); });
setInterval(drawMe, 60000);
addEventListener("online", () => { onDataChanged(); prefetchTiles(); });
addEventListener("offline", () => toast("Offline. Alles Gespeicherte bleibt nutzbar.", "info", 3000));
addEventListener("resize", () => map && map.invalidateSize({pan:false}));
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadCtrl && !window._reloaded){ window._reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
}

</script>
