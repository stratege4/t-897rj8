<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F6EFE3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Thailand">
<meta name="robots" content="noindex,nofollow">
<title>Thailand 2027</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#F6EFE3; --surface:#FFFBF4; --surface2:#EFE4D2; --line:rgba(74,52,32,.12); --line2:rgba(74,52,32,.2);
  --text:#3A2E24; --mute:#8A7866; --accent:#C65D3B; --accent-ink:#FFF8EF; --accent2:#2F7E8A; --gold:#D9A441;
  --t-strand:#2E8FA3; --t-ort:#C65D3B; --t-essen:#A8475F; --t-cafe:#8A5A3C; --t-aussicht:#6E8B3D; --t-erlebnis:#C98D1F;
  --plan:#8B5E3C; --plan-ink:#FFF8EF; --good:#6E8B3D; --warn:#C98D1F; --bad:#A8475F; --pinring:#FFFBF4; --ink-on-color:#FFFBF4;
  --display:"Fraunces", Georgia, serif; --sans:"Manrope", -apple-system, system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --shadow:0 10px 28px rgba(92,62,34,.16); --panelh:52dvh;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
[hidden]{display:none!important}
.ic{width:24px;height:24px;display:block;flex:none}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
.muted{color:var(--mute)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:700}

/* map */
.mapwrap{position:fixed;inset:0;height:100dvh;z-index:0}
#map{position:absolute!important;inset:0;background:#0E3A4A}
.leaflet-container{background:#0E3A4A;font-family:var(--sans)}
.leaflet-tile{transition:opacity .2s ease-out}
.basemap{image-rendering:auto}
.mapshade{position:absolute;inset:0;pointer-events:none;z-index:450;background:linear-gradient(to bottom,rgba(246,239,227,.30),rgba(246,239,227,0) 15%);}
.mapui{position:absolute;z-index:700;pointer-events:none}
.mapui>*{pointer-events:auto}
.mapui.top{top:calc(var(--safe-t) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mapui.right{right:12px;top:calc(var(--safe-t) + 70px);display:flex;flex-direction:column;gap:8px}
.mapui.bottom{left:0;right:0;bottom:calc(var(--panelh) + 16px);display:flex;justify-content:center;align-items:stretch;gap:8px;padding-inline:12px;transition:bottom .34s cubic-bezier(.32,.72,0,1)}
.glass{background:rgba(255,251,244,.82);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow)}
.daybadge{padding:8px 13px;display:flex;flex-direction:column;line-height:1.2;font-size:12px;font-weight:700;color:var(--mute)}
.daybadge .big{font-family:var(--display);font-size:22px;color:var(--text);display:flex;align-items:baseline;gap:4px}
.daybadge .big small{font-size:14px;color:var(--mute)}
.daybadge .row{display:flex;align-items:center;gap:5px}
.daybadge .ic{width:15px;height:15px}
.gbtn.on{background:var(--accent2)!important;color:#FFFBF4!important}
.gbtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;cursor:pointer;border:1px solid var(--line2);background:rgba(255,251,244,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow);color:var(--text)}
.tfbar{display:flex;gap:2px;padding:5px}
.tfil{height:42px;padding:0 14px;border-radius:12px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;gap:7px;color:var(--mute);opacity:.5;font-size:12.5px;font-weight:800;letter-spacing:.01em}
.tfl{white-space:nowrap}
.tfil .ic{width:22px;height:22px}
.tfil.on{opacity:1;color:var(--c);background:rgba(74,52,32,.06)}
.offline{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:12px;font-weight:700;color:var(--bad)}
.attrib{position:absolute;right:8px;bottom:calc(var(--panelh) + 2px);z-index:460;font-size:9px;color:rgba(255,255,255,.62);text-shadow:0 1px 2px rgba(0,0,0,.45);pointer-events:none;transition:bottom .34s cubic-bezier(.32,.72,0,1)}

/* pins and labels */
.mpin{position:relative;border-radius:50%;background:var(--c);color:#FFFBF4;display:grid;place-items:center;box-shadow:0 0 0 2.5px #FFFBF4,0 4px 10px rgba(74,52,32,.35);cursor:pointer}
.mpin .ic{width:58%;height:58%;stroke-width:2.2}
.mpin.done{background:var(--surface);color:var(--c);box-shadow:0 0 0 2.5px var(--c),0 3px 8px rgba(74,52,32,.25);opacity:.5}
.mpin.done .ic{stroke-width:2.4}
.hotelpin{width:38px;height:38px;border-radius:13px;background:var(--text);color:#FFFBF4;display:grid;place-items:center;box-shadow:0 0 0 2.5px #FFFBF4,0 5px 12px rgba(74,52,32,.4)}
.hotelpin .ic{width:22px;height:22px;stroke-width:2.2}
.lbl{color:#FFFFFF;white-space:nowrap;pointer-events:none;text-shadow:0 0 2px rgba(10,20,25,.95),0 1px 3px rgba(10,20,25,.85),0 0 9px rgba(10,20,25,.6)}
.lbl.town{font:700 13px/1 var(--sans);letter-spacing:.02em}
.lbl.town.major{font:700 16.5px/1 var(--sans);letter-spacing:.01em}
.lbl.poi.done{opacity:.5}
.lbl.poi{display:inline-block;color:var(--text);font:800 12.5px/1 var(--sans);background:rgba(255,251,244,.95);padding:5px 9px;border-radius:9px;text-shadow:none;box-shadow:0 2px 8px rgba(20,14,8,.3)}
.mepin{position:relative;width:20px;height:20px;border-radius:50%;background:#1E7BFF;box-shadow:0 0 0 3px #FFFFFF,0 2px 8px rgba(0,0,0,.45)}
.mepin:after{content:"";position:absolute;inset:-9px;border-radius:50%;background:rgba(30,123,255,.35);animation:mepulse 2s ease-out infinite}
@keyframes mepulse{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.mepin:after{animation:none;opacity:.35}}
.mepin.stale{background:#8A9BB0}
.crosshair #map{cursor:crosshair}
.placing{position:absolute;left:12px;right:12px;top:calc(var(--safe-t) + 10px);z-index:900;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700}

/* panel */
.panel{position:fixed;left:0;right:0;bottom:0;height:var(--panelh);background:var(--bg);border-radius:26px 26px 0 0;z-index:800;box-shadow:0 -10px 30px rgba(92,62,34,.16);display:flex;flex-direction:column;transition:transform .34s cubic-bezier(.32,.72,0,1)}
.grip{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.grip:before{content:"";width:44px;height:5px;border-radius:5px;background:var(--line2)}
.wrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;max-width:560px;width:100%;margin:0 auto;padding-inline:16px;padding-block:4px calc(118px + var(--safe-b));display:flex;flex-direction:column;gap:18px}
/* eingeklappt: nur Griff und Tagesplan-Knopf bleiben sichtbar, der Rest ist Karte */
body{--peek:calc(110px + var(--safe-b))}
body.mapfull{--panelh:var(--peek)}
body.mapfull .panel{transform:translateY(calc(100% - var(--peek)))}
body.mapfull .grip{height:30px}
.wrap{transition:opacity .2s}
body.mapfull .wrap{opacity:0;pointer-events:none}
#morning:empty,#planpin:empty{display:none}
.card{box-shadow:0 6px 18px rgba(92,62,34,.08);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card.hi{background:linear-gradient(160deg,var(--surface2),var(--surface));border-color:var(--line2)}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.cardhead h2{font-family:var(--display);font-size:19px;font-weight:600}
.rowhead{display:flex;align-items:center;gap:8px}
.rowhead h2{font-family:var(--display);font-size:20px;margin-right:auto}
.iconlink{border:0;background:none;color:var(--mute);display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;padding:8px 4px}
.iconlink .ic{width:18px;height:18px}
.iconlink.accent{color:var(--accent2)}
.iconlink.plan{color:var(--plan)}

.helpbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);color:var(--mute);font:800 15px/1 var(--sans);cursor:pointer;display:grid;place-items:center}
.helprow{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line)}
.helprow:first-of-type{border-top:0}
.helprow .hi{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--text)}
.helprow b{display:block;font-size:14px}
.helprow span{font-size:13px;color:var(--mute)}

/* suggestion cards */
.scards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 8px;margin-inline:-16px;scrollbar-width:none}
.scards::-webkit-scrollbar{display:none}
.scard{box-shadow:0 6px 18px rgba(92,62,34,.1);flex:none;width:70%;max-width:260px;scroll-snap-align:start;scroll-margin-left:16px;border:1px solid var(--line);background:var(--surface);border-radius:20px;overflow:hidden;padding:0;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.sc-top{position:relative;height:112px;background:radial-gradient(120% 90% at 20% 10%,color-mix(in srgb,var(--c) 22%,#FFFBF4),color-mix(in srgb,var(--c) 45%,#EFE4D2));display:grid;place-items:center;overflow:hidden;color:var(--c)}
.sc-top img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-top .ic{width:44px;height:44px;stroke-width:1.6}
.sc-top img~.tchip{position:absolute;left:8px;bottom:8px}
.tchip{width:30px;height:30px;border-radius:10px;background:var(--c);color:#FFFBF4;display:grid;place-items:center}
.tchip .ic{width:18px!important;height:18px!important;stroke-width:2.2!important}
.sc-body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.sc-name{font-weight:800;font-size:15px;line-height:1.2}
.meta{display:flex;gap:10px;font-size:12.5px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta .ic{width:15px;height:15px}
.sc-why{font-size:12.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 65%,rgba(246,239,227,0));z-index:900;transition:transform .34s cubic-bezier(.32,.72,0,1)}
.bottombar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.primary{flex:1;border:0;border-radius:18px;min-height:56px;background:var(--plan);color:var(--plan-ink);font-weight:800;font-size:16.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 10px 24px rgba(139,94,60,.35)}
.round{width:56px;height:56px;border-radius:18px;border:1px solid rgba(139,94,60,.25);background:#E8D9C0;color:#6B4A2F;box-shadow:0 10px 24px rgba(139,94,60,.2);cursor:pointer;display:grid;place-items:center}
.round .ic{width:26px;height:26px;stroke-width:2.2}

/* buttons */
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:14px;min-height:46px;padding:0 14px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn .ic{width:19px;height:19px}
.btn.solid{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.light{background:var(--text);color:var(--bg);border-color:transparent}
.btn[disabled]{opacity:.45}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 12px;min-height:38px;cursor:pointer;font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.chip .ic{width:16px;height:16px}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:transparent}
a.chip{text-decoration:none;color:var(--text)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(58,46,36,.35);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:90%;border-radius:26px 26px 0 0;overflow:auto;padding:8px 18px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:14px;border-top:1px solid var(--line2);box-shadow:0 -12px 40px rgba(92,62,34,.25);overscroll-behavior:contain}
.sheet>*{flex-shrink:0}
.sheet.tall{height:92%}
.spotsearch{position:relative}
.spotsearch .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--mute);pointer-events:none}
.spotsearch input{width:100%;font:600 16px/1.2 var(--sans);color:var(--text);background:var(--surface);border:1.5px solid var(--line2);border-radius:16px;padding:15px 14px 15px 44px;-webkit-appearance:none;appearance:none}
.spotsearch input:focus{border-color:var(--accent2);outline:none}
.spotsearch input::-webkit-search-cancel-button{-webkit-appearance:none}
.sres{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:-6px}
.sres:empty{display:none}
.sritem{display:grid;grid-template-columns:34px 1fr 40px;gap:10px;align-items:center;min-height:58px;padding:8px 10px 8px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:var(--text);width:100%}
.sritem:first-child{border-top:0}
.sritem .tchip{width:34px;height:34px}
.sritem .srtxt{display:flex;flex-direction:column;gap:2px;min-width:0}
.sritem .srtxt b{font-size:15px;line-height:1.25}
.sritem .srtxt b mark{background:none;color:var(--plan);font-weight:800}
.sritem .srtxt span{font-size:12.5px;color:var(--mute)}
.sradd{width:40px;height:40px;border-radius:12px;background:var(--plan);color:var(--plan-ink);display:grid;place-items:center}
.sradd .ic{width:20px;height:20px;stroke-width:2.4}
.sritem[disabled]{cursor:default}
.sritem[disabled] .sradd{background:var(--plan);opacity:.5}
.sritem[disabled] .srtxt b{color:var(--mute)}
.srnone{padding:14px;font-size:13.5px;color:var(--mute)}
.addmsg{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--plan);min-height:0;margin:-4px 0}
.addmsg:empty{display:none}
.addmsg .ic{width:18px;height:18px}
.addmsg.show{animation:addpop .5s cubic-bezier(.32,.72,0,1)}
@keyframes addpop{0%{opacity:0;transform:translateY(-4px)}100%{opacity:1;transform:none}}
.dayrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.dayrow::-webkit-scrollbar{display:none}
.dayrow .chip{flex:none}
.dayrow .chip[aria-pressed="true"]{background:var(--plan);color:var(--plan-ink)}
.btn.plan{background:var(--plan);color:var(--plan-ink);border-color:transparent}
.rtlbl{display:inline-block;white-space:nowrap;background:var(--plan);color:var(--plan-ink);font:800 12px/1 var(--sans);padding:5px 8px;border-radius:9px;border:1.5px solid #EAD9B8;box-shadow:0 2px 8px rgba(20,14,8,.35);transform:translate(-50%,-50%)}
.dpsum{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.dpsum span{display:inline-flex;align-items:center;gap:5px}
.dpsum .ic{width:16px;height:16px}
.dpempty{text-align:center;padding:22px 12px;color:var(--mute);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.dpempty .ic{width:30px;height:30px;color:var(--line2)}
@keyframes rowin{0%{background:color-mix(in srgb,var(--plan) 18%,transparent)}100%{background:transparent}}
.tlrow.added{animation:rowin 1.6s ease-out;border-radius:12px}
.sc-plan{position:absolute;top:8px;right:8px;background:var(--plan);color:var(--plan-ink);border-radius:999px;padding:3px 8px 3px 5px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:3px}
.sc-plan .ic{width:14px;height:14px;stroke-width:2.6}
.sc-plan.done{background:var(--surface);color:var(--mute);box-shadow:inset 0 0 0 1.5px var(--line2)}
.scard.done .sc-top img{opacity:.5}
.scard.done .sc-name{color:var(--mute)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 0}
.sheethead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.ph{display:flex;gap:12px;align-items:center;min-width:0}
.ph h2{font-family:var(--display);font-size:23px;line-height:1.15}
.tbig{width:54px;height:54px;border-radius:17px;background:var(--c);color:#FFFBF4;display:grid;place-items:center;flex:none}
.tbig .ic{width:30px;height:30px;stroke-width:2}
.closebtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px}
.fact{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;background:var(--surface);border-radius:14px;font-size:11.5px;color:var(--mute);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.fact .ic{width:22px;height:22px;color:var(--text)}
.fact .wx{display:flex;gap:1px}
.fact .wx .ic{width:17px;height:17px}
.why{border-left:3px solid var(--accent);padding-left:11px;font-size:14.5px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:800;text-decoration:none;cursor:pointer;padding:4px;color:var(--text)}
.act .ic{width:24px;height:24px}
.act.on{background:var(--gold);color:#FFFBF4;border-color:transparent}
.act.on .ic{fill:#FFFBF4}
.rates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate{border:1px solid var(--line);background:var(--surface);border-radius:16px;min-height:58px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:10.5px;font-weight:800}
.rate .ic{width:26px;height:26px}
.rate.down .ic{transform:rotate(180deg)}
.rate[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.rate.r-herz[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.rate.r-herz[aria-pressed="true"] .ic{fill:currentColor}
input[type=text],input[type=time],input[type=date],input[type=number],textarea{width:100%;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px}
textarea{min-height:80px;resize:vertical}
.etrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:11px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;cursor:pointer}
.etrow:first-child{border-top:0}
.etrow .tchip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--plan)}
.etrow .tchip .ic{width:19px;height:19px}
.etrow b{display:block;font-weight:800;overflow-wrap:anywhere}
.etrow .sub{display:block;font-size:13px;color:var(--mute);overflow-wrap:anywhere}
.etst{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;border:1.5px solid currentColor;white-space:nowrap}
.etst.idee{color:var(--mute)} .etst.geplant{color:var(--warn)} .etst.gebucht{color:var(--good)}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.formgrid label,.field{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--mute);min-width:0}
.formgrid .wide{grid-column:1/-1}
.etnote{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:10px 12px;font-size:13.5px;cursor:pointer;width:100%;text-align:left;color:inherit;font-family:inherit}
.etnote .ic{width:19px;height:19px;color:var(--plan);flex:none}
.note{background:var(--surface);border-radius:14px;padding:11px 12px;font-size:13.5px;color:var(--mute)}
details{border-top:1px solid var(--line);padding-top:6px}
details summary{cursor:pointer;font-weight:800;padding:8px 0;display:flex;align-items:center;gap:8px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary .ic{width:18px;height:18px;color:var(--mute)}
details>*:not(summary){margin-top:8px}
.credit{font-size:10.5px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:var(--surface2)}
.pill .ic{width:14px;height:14px}

/* timeline */
.tl{display:flex;flex-direction:column}
.tlrow{display:grid;grid-template-columns:50px 22px 1fr auto;gap:8px;align-items:start}
.tlrow .time{font-variant-numeric:tabular-nums;font-weight:800;padding-top:3px}
.rail{position:relative;align-self:stretch;display:flex;justify-content:center}
.rail:before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line2)}
.rail i{position:relative;margin-top:2px;width:22px;height:22px;border-radius:8px;background:var(--c,var(--surface2));color:#FFFBF4;display:grid;place-items:center}
.rail i .ic{width:14px;height:14px;stroke-width:2.4}
.tlrow.drive .rail i{width:8px;height:8px;border-radius:50%;background:var(--line2);margin-top:8px}
.tlbody{padding-bottom:14px;min-width:0}
.tlrow.drive .tlbody{font-size:12.5px;color:var(--mute);padding-bottom:8px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tlrow.drive .tlbody .ic{width:15px;height:15px}
.tlbody .nm{font-weight:800;border:0;background:none;padding:0;text-align:left;cursor:pointer;font-size:15px}
.tlbody .sub{font-size:12.5px;color:var(--mute)}
.tlbody a{color:var(--accent2);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.tlbody .stay,.sheet .stay{display:flex;width:max-content;align-items:center;gap:2px;margin-top:4px;font-size:12.5px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.tlbody .stay span,.sheet .stay span{min-width:44px;text-align:center}
.tlbody .stay button,.sheet .stay button{width:42px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:800 17px/1 var(--sans);cursor:pointer;display:grid;place-items:center}
.tledit{display:flex;gap:4px}
.tledit button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--mute)}
.tledit .ic{width:17px;height:17px}
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;z-index:2000;font-weight:800;font-size:14px;max-width:90%;text-align:center;display:flex;align-items:center;gap:8px}
.toast .ic{width:18px;height:18px}
.list{display:flex;flex-direction:column}
.listrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.listrow:first-child{border-top:0}
.checkrow{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.checkrow:first-child{border-top:0;padding-top:0}
.checkrow b{display:flex;align-items:center;gap:8px}
.sheet:focus{outline:none}
.daybtn{min-height:54px;font-size:16px;border-radius:16px}
.daybtn .ic{width:21px;height:21px}
.typepick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.typepick button{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:800;color:var(--mute);cursor:pointer}
.typepick button .ic{width:22px;height:22px;color:var(--c)}
.typepick button[aria-pressed="true"]{background:var(--c);color:#FFFBF4}
.typepick button[aria-pressed="true"] .ic{color:#FFFBF4}
</style>
</head>

function nearestTown({lat,lng}){ let best=null,bd=1e9; DATA.labels.forEach(([a,b,n]) => { const dd=(a-lat)**2+((b-lng)*Math.cos(lat*Math.PI/180))**2; if(dd<bd){bd=dd;best=n;} }); return best; }

const LMODES = {auto:{l:"Auto, Taxi", icon:"auto", gm:"driving", wort:"Fahrt"}, fuss:{l:"Zu Fuß", icon:"gehen1", gm:"walking", wort:"zu Fuß"}, frei:{l:"Boot, Bus, Bahn", icon:"faehre", gm:"transit", wort:"unterwegs"}};
const modeOf = plan => LMODES[plan?.modus] ? plan.modus : "auto";
const pkey = x => x.id + "@" + (+x.lat).toFixed(4) + "," + (+x.lng).toFixed(4);
const ckey = (a, b, mode) => (mode === "fuss" ? "fuss:" : "") + [pkey(a), pkey(b)].sort().join("|");
// vorab berechnete Routen (DATA.routes) gelten nur, solange keiner der beiden Punkte verschoben wurde
function routeFor(a,b,mode="auto"){ if(mode === "frei") return null; const ka = rid(a), kb = rid(b); if(!ka || !kb) return null; if(ka===kb) return [0,0,""]; return (mode === "auto" && !a.moved && !b.moved ? DATA.routes?.[rkey(ka,kb)] : null) || RCACHE[ckey(a, b, mode)] || null; }
function travel(a,b,mode="auto"){ const r = routeFor(a,b,mode); return r ? Math.round(r[0]*(mode === "auto" ? ROUTE_FACTOR : 1)) : null; } // null = noch keine Zeit
// Fahrzeit ab der Unterkunft des gerade geplanten Tages, nur für Spots im Umkreis (sonst null)
const hotelMin = p => { const b = baseFor(editDay()); if(!b || airKm(b, p) > NEAR_KM) return null; const m = travel(b, p); return m === null ? null : Math.max(5, Math.round(m/5)*5); };

const minTxt = m => m === null ? "–" : m + "′";
async function osrm(a,b,mode="auto"){
  const A = a, B = b, host = mode === "fuss" ? "https://routing.openstreetmap.de/routed-foot" : "https://router.project-osrm.org";
  const js = await fetch(`${host}/route/v1/driving/${A.lng},${A.lat};${B.lng},${B.lat}?overview=full&geometries=polyline`).then(r => r.json());
  if(js.code !== "Ok") throw new Error(js.code);

}
const rPending = new Set();
function ensureRoutes(pairs, mode="auto"){
  if(navigator.onLine === false || mode === "frei") return;
  const key = ([a,b]) => ckey(a, b, mode);
  // zu Fuß nur bis 25 km Luftlinie, darüber ist eine Gehzeit keine Planungsgrundlage
  const todo = pairs.filter(([a,b]) => rid(a) && rid(b) && rid(a)!==rid(b) && !routeFor(a,b,mode) && !rPending.has(key([a,b])) && (mode !== "fuss" || airKm(a,b) <= 25));
  if(!todo.length) return;
  todo.forEach(p => rPending.add(key(p)));

    let got = 0;
    for(const [a,b] of todo){ const k = key([a,b]); try{ RCACHE[k] = await osrm(a,b,mode); got++; }catch(e){} rPending.delete(k); await new Promise(r => setTimeout(r, 300)); }
    if(got){ LS.set("thailand2027-routes", RCACHE); reorderEditDay(); renderAll(); window._dpRefresh?.(); }
  })();
}
// Neue Zeiten können eine bessere Reihenfolge ergeben. Die Reihenfolge ist berechnet, kein Nutzereintrag, daher kein neuer Zeitstempel.
function reorderEditDay(){ const pl = dayPlanFor(editDay()); if(!pl || modeOf(pl.plan) === "frei") return; const vor = pl.plan.stationen.map(x => x.placeId).join(); optimizeOrder(pl.plan); if(pl.plan.stationen.map(x => x.placeId).join() !== vor) persist(); }
const polyCache = {};
function decodePoly(str){
  if(polyCache[str]) return polyCache[str];
  let i = 0, lat = 0, lng = 0; const out = [];
  while(i < str.length){ for(const k of [0,1]){ let b, sh = 0, r = 0; do{ b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; }while(b >= 32); const d = r & 1 ? ~(r >> 1) : r >> 1; if(k) lng += d; else lat += d; } out.push([lat/1e5, lng/1e5]); }

// Zwei Stände eines Spots zusammenführen: pro Feld gilt der neuere Zeitstempel (ältere Einträge ohne _t zählen mit at)
function mergeOver(a, b){
  if(!a) return b; if(!b) return a;
  const out = {}, t = {};
  for(const f of [...new Set([...Object.keys(a), ...Object.keys(b)])].sort()){
    if(f === "_t" || f === "at") continue;
    const ta = a._t?.[f] ?? a.at ?? 0, tb = b._t?.[f] ?? b.at ?? 0;

let map, markerLayer, routeLayer, poiLabelLayer, meLayer, placingCb = null;
const TILE_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
// Vorgeladen werden nur die Landesübersicht (Zoom 5 bis 8) und die Umgebung jeder Unterkunft (6 km, Zoom 10 bis 14),
// zusammen etwa 150 plus 70 Kacheln je Unterkunft. Alles andere hält der Service Worker vor, sobald es einmal angesehen wurde.
const VIEW = {center:[13.0, 101.0], bounds:[[4.5, 96.5], [21.5, 106.5]]};
function tileUrls(sw, ne, z0, z1){
  const out = [];
  for(let z = z0; z <= z1; z++){ const a = map.project([ne[0], sw[1]], z).divideBy(256).floor(), b = map.project([sw[0], ne[1]], z).divideBy(256).floor();
    for(let x = a.x; x <= b.x; x++) for(let y = a.y; y <= b.y; y++) out.push(TILE_URL.replace("{z}", z).replace("{y}", y).replace("{x}", x)); }
  return out;
}
const tileJobKey = u => "uk:" + u.lat.toFixed(3) + "," + u.lng.toFixed(3);
let prefetching = false;
async function prefetchTiles(){
  const con = navigator.connection;
  if(prefetching || !map || navigator.onLine === false || con?.saveData || !navigator.serviceWorker?.controller) return;
  const done = new Set(LS.get("thailand2027-tiles") || []), jobs = [];
  if(!done.has("land")) jobs.push(["land", tileUrls(VIEW.bounds[0], VIEW.bounds[1], 5, 8)]);
  ukList().forEach(u => { const k = tileJobKey(u); if(done.has(k)) return; const dy = 6/111, dx = dy/Math.cos(u.lat*Math.PI/180); jobs.push([k, tileUrls([u.lat-dy, u.lng-dx], [u.lat+dy, u.lng+dx], 10, 14)]); });
  if(!jobs.length) return;
  prefetching = true;
  try{
    for(const [k, urls] of jobs){
      let ok = 0;
      for(let i = 0; i < urls.length; i += 4){
        if(navigator.onLine === false) return;
        const r = await Promise.all(urls.slice(i, i+4).map(u => fetch(u, {mode:"cors"}).then(x => x.ok).catch(() => false)));
        ok += r.filter(Boolean).length; await new Promise(res => setTimeout(res, 120));
      }
      if(ok >= urls.length * 0.9){ done.add(k); LS.set("thailand2027-tiles", [...done]); }
    }
  } finally { prefetching = false; }
}
// Offline-Stand fürs Menü: was liegt auf diesem Gerät

    ["Karte rund um Unterkünfte", uks.length ? ukOk + " von " + uks.length : "keine Unterkünfte"],

      L.polyline(pts,{color:"#EAD9B8",opacity:1,weight:4.5,lineCap:"round",lineJoin:"round",dashArray:dash,interactive:false}).addTo(routeLayer);
      const min = lt.min;
      if(min !== null && min >= (bucket === 0 ? 20 : 3)) L.marker(midOf(pts),{interactive:false,keyboard:false,zIndexOffset:-800,icon:L.divIcon({className:"",html:`<span class="rtlbl">${lt.src === "eigen" ? "" : "ca. "}${min} Min${mode === "fuss" ? " zu Fuß" : ""}</span>`,iconSize:null,iconAnchor:[0,0]})}).addTo(routeLayer);
    });
  }
}
// Punkt auf halber Strecke einer Linie, für das Fahrzeit-Schild
function midOf(pts){
  const d = pts.slice(1).map((p,i) => Math.hypot(p[0]-pts[i][0], (p[1]-pts[i][1])*.77));
  let half = d.reduce((a,b) => a+b, 0)/2;
  for(let i = 0; i < d.length; i++){ if(half <= d[i]){ const f = d[i] ? half/d[i] : 0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f]; } half -= d[i]; }
  return pts[0];
}
function focusPlace(id){
  const p = P(id); if(!p) return;
  if(map) window.focusOn([p.lat,p.lng], Math.max(map.getZoom(), 12), .6);

}

  ov.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;

  sh.tabIndex = -1; sh.focus({preventScroll:true});

}

  ["cafe", /caf[eé]|coffee|kaffee|bäcker|backer|brunch|frühstück|eis|gelat|kuchen|ensa[iï]mad/i],

const tripRange = () => { const r = S.meta.reise; return r?.start && r?.end && r.end >= r.start ? r : null; };

/* Abgleich auf Ebene der Stopps: plan.log hält je Spot, ob er zuletzt hinzugefügt (in:true) oder entfernt wurde, mit Zeitstempel.

      if(clr) clr.onclick = () => { const pl = dayPlanFor(cur); if(!pl) return; while(pl.plan.stationen.length) removeFromPlan(cur, 0); draw(); search(); toast("Tag geleert", "x"); };
      const bl = body.querySelector(".tlrow.added"); if(bl && document.activeElement !== q) bl.scrollIntoView({block:"nearest"});
    };
    window._dpRefresh = () => { if(sh.isConnected) draw(); };
    const search = () => {
      const inPlan = new Set((dayPlanFor(cur)?.plan.stationen||[]).map(x => x.placeId));
      if(!q.value.trim()){ res.innerHTML = ""; return; }
      const hits = searchSpots(q.value);
      res.innerHTML = hits.length ? hits.map(p => { const on = inPlan.has(p.id); return `<button class="sritem" role="option" data-pick="${p.id}" ${on?`disabled aria-disabled="true"`:""}><span class="tchip" style="--c:var(${TYPES[p.typ][1]})">${ic(TIC(p.typ))}</span><span class="srtxt"><b>${markHit(p.name, q.value)}</b><span>${on ? "schon im Tagesplan" : esc([GROUPS[GOF[p.typ]||"spots"][0], p.region, hotelMin(p) !== null ? hotelMin(p)+"′ ab Unterkunft" : ""].filter(Boolean).join(" · "))}</span></span><span class="sradd">${ic(on ? "haken" : "plus")}</span></button>`; }).join("")
        : `<p class="srnone">Kein Spot gefunden. Neue Spots legt ihr mit + auf der Karte an.</p>`;
    };
    const pick = id => {
      const p = P(id); if(!p || !addToPlan(id, cur)) return;
      added = id; q.value = ""; search();
      msg.innerHTML = ic("haken") + `<span>${esc(p.name)} ist im Tagesplan</span>`; msg.classList.remove("show"); void msg.offsetWidth; msg.classList.add("show");
      draw();
    };
    q.addEventListener("input", search);
    q.addEventListener("keydown", e => { if(e.key === "Enter" || e.keyCode === 13){ e.preventDefault(); const first = res.querySelector("[data-pick]:not([disabled])"); if(first) pick(first.dataset.pick); } });
    // Tippen auf einen Treffer soll die Tastatur offen lassen, damit man direkt weitersuchen kann
    res.addEventListener("pointerdown", e => { if(e.target.closest("[data-pick]") && document.activeElement === q) e.preventDefault(); });
    res.addEventListener("click", e => { const b = e.target.closest("[data-pick]"); if(b && !b.disabled) pick(b.dataset.pick); });
    sh.querySelectorAll("[data-day]").forEach(b => b.onclick = () => {
      cur = b.dataset.day; S.meta.editDay = cur; persist(); renderAll();
      sh.querySelectorAll("[data-day]").forEach(x => x.setAttribute("aria-pressed", x.dataset.day===cur));
      msg.innerHTML = ""; draw(); search();
    });
    const plNow = dayPlanFor(cur); if(plNow && !plNow.eigen){ ensureDayPlan(cur); persist(); }
    if(plNow) ensureRoutes(planLegs(dayPlanFor(cur).plan), modeOf(dayPlanFor(cur).plan));
    draw();
  });
}

/* ---------- Reise und Etappen ----------
   Ebene A: Abschnitte zwischen Orten oder Unterkünften, auch die Flüge. Alles hier ist privat: es liegt nur lokal (S.etappen,
   S.meta.reise) und geht nur über den Abgleich ans andere Gerät, nie in die öffentlichen Dateien.
   Die App berechnet und ergänzt hier nichts. Zeiten, Dauer und Anbieter tragt ihr selbst ein; eine Dauer gilt als geschätzt,
   bis ihr sie als bestätigt markiert. Löschen hinterlässt {weg:true, at} für den Abgleich. */
const MODES = {flug:["Flug","flug"], zug:["Zug","zug"], bus:["Bus","bus"], faehre:["Fähre","faehre"], auto:["Auto/Taxi","auto"], sonst:["Sonstiges","reise"]};
const LSTATUS = {idee:"Idee", geplant:"Geplant", gebucht:"Gebucht"};
const etappen = () => Object.entries(S.etappen).filter(([,e]) => !e.weg).map(([id,e]) => ({...e, id}))
  .sort((a,b) => (a.datum||"9999").localeCompare(b.datum||"9999") || (a.ab||"99").localeCompare(b.ab||"99") || (a.createdAt||0)-(b.createdAt||0));
const hm = m => Math.floor(m/60) + " h" + (m%60 ? " " + m%60 + " min" : "");
const dauerTxt = e => e.dauerMin ? (e.dauerOk ? hm(e.dauerMin) : "ca. " + hm(e.dauerMin) + ", geschätzt") : "";
const zeitTxt = e => [e.datum ? fmtDate(e.datum) : "ohne Datum", e.ab && e.an ? e.ab + "–" + e.an + (e.anDatum && e.anDatum !== e.datum ? " (" + fmtDate(e.anDatum) + ")" : "") : e.ab ? "ab " + e.ab : e.an ? "an " + e.an : ""].filter(Boolean).join(" ");
const etappeRow = e => `<button class="etrow" data-et="${e.id}"><span class="tchip">${ic(MODES[e.art]?.[1] || "reise")}</span><span style="min-width:0"><b>${esc(e.von)} → ${esc(e.nach)}</b><span class="sub">${esc([MODES[e.art]?.[0], zeitTxt(e), dauerTxt(e), e.anbieter].filter(Boolean).join(" · "))}</span></span><span class="etst ${e.status||"idee"}">${LSTATUS[e.status||"idee"]}</span></button>`;
// Hinweis im Tagesplan, wenn an dem Tag eine Etappe abfährt oder ankommt
const etappenAm = d => etappen().filter(e => e.datum === d || e.anDatum === d).map(e => `<button class="etnote" data-et="${e.id}">${ic(MODES[e.art]?.[1] || "reise")}<span><b>${esc(e.von)} → ${esc(e.nach)}</b><br><span class="muted">${esc([MODES[e.art]?.[0], zeitTxt(e), dauerTxt(e)].filter(Boolean).join(" · "))}</span></span></button>`).join("");
function openReise(){

    <button class="btn plan" id="etNew">${ic("plus")}Etappe hinzufügen</button>
    <p class="small muted">Die App rechnet hier nichts aus und ergänzt nichts. Zeiten und Dauer kommen von euch, eine geschätzte Dauer ist als solche markiert. Die Etappen bleiben auf euren Handys und gehen nur über den Abgleich ans andere.</p>`, sh => {

/* ---------- Unterkünfte ----------
   Privat wie die Etappen: nur lokal (S.unterkuenfte) und über den Abgleich. Fahrzeiten ab einer Unterkunft werden nie
   vorab berechnet oder veröffentlicht, sondern auf dem Gerät über OSRM nachgeladen und dort gespeichert (braucht einmal Netz).
   Eine Unterkunft gilt für die Nächte von "von" bis vor "bis" (Abreisetag). Morgens startet der Tag dort, wo ihr geschlafen habt,
   abends endet er dort, wo ihr schlaft. Wechselt die Unterkunft (Reisetag), endet der Plan beim letzten Stopp,
   denn die Weiterreise ist eine Etappe und kein Autoabschnitt des Tagesplans. */
const NEAR_KM = 80;
const ukList = (alle) => Object.entries(S.unterkuenfte).filter(([,u]) => !u.weg && (alle || (Number.isFinite(u.lat) && u.von && u.bis))).map(([id,u]) => ({...u, id}))
  .sort((a,b) => (a.von||"9999").localeCompare(b.von||"9999") || a.name.localeCompare(b.name, "de"));
const ukNight = d => ukList().find(u => u.von <= d && d < u.bis) || null; // Nacht von d auf den nächsten Tag
const isTravelDay = d => { const a = ukNight(addDays(d,-1)), b = ukNight(d); return !!(a && b && a.id !== b.id); };
const dayStart = d => ukNight(addDays(d,-1)) || ukNight(d);
const dayEnd = d => isTravelDay(d) ? null : ukNight(d);
const baseFor = d => ukNight(d) || ukNight(addDays(d,-1));
function openNights(){ const r = tripRange(); if(!r) return []; const out = []; for(let d = r.start; d < r.end; d = addDays(d,1)) if(!ukNight(d)) out.push(d); return out; }
const nights = u => u.von && u.bis ? dayDiff(u.bis, u.von) : 0;
const ukRow = u => `<button class="etrow" data-uk="${u.id}"><span class="tchip">${ic("hotel")}</span><span style="min-width:0"><b>${esc(u.name)}</b><span class="sub">${esc([u.von && u.bis ? fmtDate(u.von) + " – " + fmtDate(u.bis) + " · " + nights(u) + (nights(u) === 1 ? " Nacht" : " Nächte") : "ohne Datum, noch kein Startpunkt", Number.isFinite(u.lat) ? "" : "Ort fehlt"].filter(Boolean).join(" · "))}</span></span><span class="etst ${u.status||"idee"}">${LSTATUS[u.status||"idee"]}</span></button>`;
// Prüft, wie weit der gesetzte Punkt von der nächsten Straße liegt (ein Punkt auf einer internen Zufahrt verfälscht Fahrzeiten)
async function roadGap(lat, lng){ const js = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}?number=1`).then(r => r.json()); if(js.code !== "Ok") throw new Error(js.code); return Math.round(js.waypoints[0].distance); }
function openUnterkunft(id, draft){
  const u = draft || (id ? {...S.unterkuenfte[id]} : {status:"idee"});
  openSheet(`<div class="sheethead"><div class="ph"><span class="tbig" style="--c:var(--plan)">${ic("hotel")}</span><div><div class="eyebrow">${id ? "Unterkunft bearbeiten" : "Neue Unterkunft"}</div><h2>${id && u.name ? esc(u.name) : "Wo schlaft ihr?"}</h2></div></div>${closeBtn}</div>

    </div>

      <p class="small" id="uGap"></p>

    <div class="chiprow" id="uSt" role="group" aria-label="Stand">${Object.entries(LSTATUS).map(([k,l]) => `<button type="button" class="chip" data-s="${k}" aria-pressed="${(u.status||"idee")===k}">${l}</button>`).join("")}</div>
    <textarea id="uNotiz" placeholder="Notiz, optional">${esc(u.notiz||"")}</textarea>
    <div class="btnrow"><button class="btn solid" id="uSave">${ic("haken")}Speichern</button>${id ? `<button class="btn" id="uDel">${ic("muell")}Löschen</button>` : ""}</div>`, sh => {

    };
    const setLL = ll => { u.lat = +ll.lat.toFixed(6); u.lng = +ll.lng.toFixed(6); sh.querySelector("#uWhere").textContent = `Gesetzt: ${u.lat.toFixed(5)}, ${u.lng.toFixed(5)}`; check(); showGap(); };

    sh.querySelector("#uHere").onclick = () => ME && Date.now()-ME.at < 60000 ? setLL(ME) : navigator.geolocation ? navigator.geolocation.getCurrentPosition(pos => setLL({lat:pos.coords.latitude, lng:pos.coords.longitude}), () => toast("Standort nicht freigegeben","info"), {enableHighAccuracy:true, timeout:8000}) : toast("Standort nicht verfügbar","info");

      const out = {name:u.name.slice(0,80), lat:u.lat, lng:u.lng, von:u.von || null, bis:u.bis || null, status:u.status || "idee", notiz:(u.notiz||"").slice(0,1000) || null, createdAt:u.createdAt || Date.now(), at:Date.now()};
      S.unterkuenfte[id || uid("uk-")] = out; persist(); renderAll(); toast("Unterkunft gespeichert", "hotel"); openReise(); prefetchTiles();
    };
    const del = sh.querySelector("#uDel");
    if(del) del.onclick = () => {
      if(!del.dataset.sure){ del.dataset.sure = "1"; del.innerHTML = ic("muell") + "Wirklich löschen?"; return; }
      S.unterkuenfte[id] = {weg:true, at:Date.now()}; persist(); renderAll(); toast("Unterkunft gelöscht", "muell"); openReise();
    };
  });
}

/* ---------- Abgleich zwischen zwei Handys ----------
   Jeder schickt seinen Stand als Link. Beim Öffnen wird zusammengeführt statt überschrieben:
   pro Eintrag gewinnt der neuere Zeitstempel. Gelöschte Bewertungen bleiben als {emoji:null, at} stehen,
   damit das Löschen beim anderen Gerät ankommt. Besucht-Listen der Tage werden vereinigt und danach
   auf Spots gekürzt, deren (per Zeitstempel entschiedener) Status noch „besucht“ ist.
   Geräteeigene Ansicht (editDay) wird nicht übertragen. */
const SYNC_KEY = "thailand2027";
const LOCAL_META = ["editDay"];
const sharedMeta = () => Object.fromEntries(Object.entries(S.meta).filter(([k]) => !LOCAL_META.includes(k)));
function snapshot(){ return {app:SYNC_KEY, t:Date.now(), over:S.over, ratings:S.ratings, days:S.days, plans:S.plans, meta:sharedMeta(), etappen:S.etappen, unterkuenfte:S.unterkuenfte}; }
function mergeState(js){
  let n = 0;
  const neuer = (a, b) => !a ? !!b : (b?.at || b?.erzeugtUm || 0) > (a?.at || a?.erzeugtUm || 0);
  for(const [k, v] of Object.entries(js.over || {})){ const m = mergeOver(S.over[k], v); if(JSON.stringify(m) !== JSON.stringify(S.over[k])) n++; S.over[k] = m; }
  for(const [k, v] of Object.entries(js.unterkuenfte || {})) if(neuer(S.unterkuenfte[k], v)){ if(JSON.stringify(S.unterkuenfte[k]) !== JSON.stringify(v)) n++; S.unterkuenfte[k] = v; }
  for(const [k, v] of Object.entries(js.etappen || {})) if(neuer(S.etappen[k], v)){ if(JSON.stringify(S.etappen[k]) !== JSON.stringify(v)) n++; S.etappen[k] = v; }
  for(const [k, v] of Object.entries(js.ratings || {})) if(neuer(S.ratings[k], v)){ if((S.ratings[k]?.emoji || null) !== (v.emoji || null)) n++; S.ratings[k] = v; }
  _placesCache = null; // ab hier Spots und Status aus dem eben zusammengeführten over lesen
  const samePlan = (x, y) => JSON.stringify(x) === JSON.stringify(y);
  for(const [k, v] of Object.entries(js.plans || {})){
    const a = S.plans[k];
    const m = !a ? v : v.eigen && a.eigen ? mergePlans(a, v) : neuer(a, v) ? v : a;
    if(!samePlan(a, m)) n++;
    S.plans[k] = m;
  }
  const visited = id => P(id)?.status === "besucht";
  for(const [k, v] of Object.entries(js.days || {})){
    const a = S.days[k] || {};
    const d = neuer(a, v) ? {...a, ...v} : {...v, ...a};
    // beide Geräte haben für den Tag einen eigenen Plan angelegt: zusammenführen, die kleinere ID gilt auf beiden Seiten
    if(a.planId && v.planId && a.planId !== v.planId && S.plans[a.planId]?.eigen && S.plans[v.planId]?.eigen){
      const [keep, drop] = [a.planId, v.planId].sort();
      S.plans[keep] = mergePlans(S.plans[keep], S.plans[drop]);
      d.planId = keep;
    }
    d.besucht = [...new Set([...(a.besucht || []), ...(v.besucht || [])])].filter(visited);
    d.at = Math.max(a.at || 0, v.at || 0);
    if(JSON.stringify(d) !== JSON.stringify(a)) n++;
    S.days[k] = d;
  }
  // auch lokale Tage kürzen, falls ein Spot nur durch den empfangenen Status wieder offen ist
  for(const [k, a] of Object.entries(S.days)) if(a.besucht?.some(id => !visited(id))) S.days[k] = {...a, besucht:a.besucht.filter(visited)};
  if((js.meta?.at || 0) > (S.meta.at || 0) && JSON.stringify(js.meta) !== JSON.stringify(sharedMeta())) n++;
  if((js.meta?.at || 0) > (S.meta.at || 0)) S.meta = {...S.meta, ...js.meta, ...Object.fromEntries(LOCAL_META.map(k => [k, S.meta[k]]))};
  return n;
}
const b64 = buf => { let out = ""; for(const c of new Uint8Array(buf)) out += String.fromCharCode(c); return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64 = str => { const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
async function packState(){
  const js = JSON.stringify(snapshot());
  if(window.CompressionStream){
    try{ return "z" + b64(await new Response(new Blob([js]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); }catch(e){}
  }
  return "p" + b64(new TextEncoder().encode(js));
}
async function unpackState(code){
  const art = code[0], daten = unb64(code.slice(1));
  if(art === "z") return JSON.parse(await new Response(new Blob([daten]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(daten));
}
async function shareState(){
  let url;
  try{ url = location.origin + location.pathname + "#sync=" + await packState(); }
  catch(e){ return toast("Stand lässt sich nicht packen", "info"); }
  if(url.length > 60000) return toast("Stand zu groß für einen Link, nehmt die Datei unten", "info", 4500);
  const text = "Mein Thailand-Stand, tipp drauf: " + url;
  if(navigator.share){ try{ await navigator.share({title:"Thailand-Stand", text}); return; }catch(e){ if(e.name === "AbortError") return; } }
  try{ await navigator.clipboard.writeText(url); toast("Link kopiert", "teilen"); }
  catch(e){ prompt("Diesen Link schicken:", url); }
}
async function applyCode(code, quelle = "Link"){
  let js;
  try{ js = await unpackState(code.trim().replace(/^.*#sync=/, "")); if(js.app !== SYNC_KEY) throw 0; }
  catch(e){ return toast(`Der ${quelle} passt nicht zur App`, "info", 3500); }
  const n = mergeState(js);
  persist(); renderAll();
  openSheet(`<div class="sheethead"><div class="ph"><span class="tbig" style="--c:var(--plan)">${ic("teilen")}</span><div><div class="eyebrow">Abgleich</div><h2>${n ? n + (n === 1 ? " Änderung" : " Änderungen") + " übernommen" : "Ihr wart schon gleichauf"}</h2></div></div>${closeBtn}</div>
    <p class="small muted">Zusammengeführt, nichts überschrieben: bei jedem Eintrag gilt die neuere Änderung, besuchte Spots von beiden Seiten bleiben erhalten.</p>
    <button class="btn plan daybtn" id="syncBack">${ic("teilen")}Meinen Stand zurückschicken</button>
    <p class="small muted">Erst danach hat die andere Seite auch euren Stand.</p>`,
    sh => sh.querySelector("#syncBack").onclick = () => { closeSheet(); shareState(); });
}
function syncFromLink(){
  const m = location.hash.match(/^#sync=(.+)$/);
  if(!m) return;
  history.replaceState(null, "", location.pathname + location.search);
  applyCode(m[1]);
}
// Code in die Zwischenablage, für den Weg über die installierte App
async function copyCode(){
  try{
    const code = await packState();
    await navigator.clipboard.writeText(code);
    toast("Code kopiert, im anderen Handy einfügen", "teilen", 3500);
  }catch(e){ toast("Kopieren hat nicht geklappt", "info"); }
}

/* ---------- Gelernt (lokal) ---------- */
const TAGTEXT = {"ruhig":"Ruhige Orte","Baden":"Baden","romantisch":"Romantische Orte","Sonnenuntergang":"Sonnenuntergänge","Foto-Spot":"Fotospots","Markt":"Märkte","Schlechtwetter":"Indoor-Ziele","kurzer Spaziergang":"Kurze Spaziergänge"};
function insights(){
  const rs = Object.entries(S.ratings).filter(([,r]) => r.emoji).map(([id,r]) => [P(id), SCORE[r.emoji]]).filter(x=>x[0]);
  const agg = {};
  const add = (k, label, v) => { (agg[k] ||= {label, n:0, sum:0}); agg[k].n++; agg[k].sum += v; };
  rs.forEach(([p,v]) => { add("typ:"+p.typ, TYPELONG[p.typ], v); (p.tags||[]).forEach(t => TAGTEXT[t] && add("tag:"+t, TAGTEXT[t], v)); if(p.aktivitaet) add("akt:"+p.aktivitaet, ["","Entspannte Orte","Orte mit etwas Bewegung","Aktive Ausflüge"][p.aktivitaet], v); if(p.region) add("reg:"+p.region, "Region "+p.region, v); });
  const out = [];
  Object.values(agg).forEach(a => { const avg = a.sum/a.n; if(a.n>=2 && avg>=1.25) out.push({good:true, text:`${a.label} gefallen euch`, beleg:`${a.n} Bewertungen, Schnitt ${avg.toFixed(1)}`}); if(a.n>=2 && avg<=-0.75) out.push({good:false, text:`${a.label} eher nicht euer Ding`, beleg:`${a.n} Bewertungen`}); });
  return out.sort((a,b)=>b.good-a.good).slice(0,8);
}

    <details><summary>${ic("herunter")}Offline auf diesem Gerät</summary>${offlineInfo().map(([a,b]) => `<div class="listrow"><span>${esc(a)}</span><span class="small muted">${esc(b)}</span></div>`).join("")}
      <p class="small muted">Spots, Pläne, Etappen und Unterkünfte liegen immer auf dem Gerät. Karte und Zeiten werden bei Netz nachgeladen und dann gespeichert. Installierte App und Safari speichern getrennt.</p></details>
    <details open><summary>${ic("teilen")}Mit dem anderen Handy abgleichen</summary>
      <p class="small muted">Eure Daten liegen nur auf dem eigenen Handy. Schickt euren Stand als Link, zum Beispiel über WhatsApp oder AirDrop. Wer ihn antippt, bekommt alles Neue dazu, nichts geht verloren. Danach einmal zurückschicken, dann sind beide gleich.</p>
      <div class="btnrow"><button class="btn plan" id="shareState">${ic("teilen")}Stand teilen</button><button class="btn" id="copyCode">${ic("link")}Code kopieren</button></div>
      <p class="small muted">Ist die App auf dem Home-Bildschirm installiert, öffnet ein angetippter Link nur Safari und nicht die App. Dann „Code kopieren“ nehmen, dem anderen schicken und dort unten einfügen.</p>
      <textarea id="syncIn" placeholder="Code von der anderen Seite hier einfügen" style="min-height:64px"></textarea>
      <button class="btn" id="syncApply">${ic("haken")}Code übernehmen</button>
    </details>
    <details><summary>${ic("herunter")}Sichern als Datei</summary>
      <p class="small muted">Für ein Backup oder wenn der Link zu groß wird.</p>
      <div class="btnrow"><button class="btn" id="exp">${ic("herunter")}Sichern</button><label class="btn" for="imp">${ic("teilen")}Laden</label><input type="file" id="imp" accept="application/json,.json" hidden></div>
    </details>
`;
  openSheet(html, sh => {
    sh.querySelectorAll("[data-open]").forEach(b => b.onclick = () => focusPlace(b.dataset.open));
    sh.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => openDayPlan(b.dataset.plan));
    sh.querySelectorAll("[data-unhide]").forEach(b => b.onclick = () => { setPlace(b.dataset.unhide,{status:"offen"}); openMenu(); });
    sh.querySelector("#shareState").onclick = shareState;
    sh.querySelector("#copyCode").onclick = copyCode;
    sh.querySelector("#syncApply").onclick = () => { const v = sh.querySelector("#syncIn").value.trim(); if(!v) return toast("Kein Code eingefügt", "info"); closeSheet(); applyCode(v, "Code"); };
    sh.querySelector("#exp").onclick = async () => {
      const data = JSON.stringify({app:SYNC_KEY, exportiertAm:new Date().toISOString(), over:S.over, ratings:S.ratings, days:S.days, plans:S.plans, meta:S.meta, etappen:S.etappen, unterkuenfte:S.unterkuenfte}, null, 1);
      const file = new File([data], `thailand-${today()}.json`, {type:"application/json"});
      if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:"Thailand Backup"}); return; }catch(e){ if(e.name==="AbortError") return; } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();}, 1000);
    };
    sh.querySelector("#imp").onchange = async e => {
      const f = e.target.files[0]; if(!f) return;
      try{
        const js = JSON.parse(await f.text()); if(js.app!==SYNC_KEY) throw 0;
        const n = mergeState(js);
        persist(); renderAll(); closeSheet(); toast(n ? n + (n===1?" Änderung":" Änderungen") + " übernommen" : "Ihr wart schon gleichauf", "teilen");
      }catch(err){ toast("Datei passt nicht","info"); }
    };

}

(function panelSwipe(){
  const panel = $("#panel"), grip = $("#grip"), wrap = $("#wrap"), bar = $(".bottombar");
  const relayout = () => { if(map) setTimeout(() => map.invalidateSize({pan:false}), 360); };
  const isFull = () => document.body.classList.contains("mapfull");
  window.panelPx = () => isFull() ? bar.offsetHeight + 30 : panel.offsetHeight;
  const setFull = on => {
    if(isFull() === on) return;
    const h = (isFull() ? (window._panelH || Math.round(innerHeight * 0.52)) : (window._panelH = panel.offsetHeight)) - (bar.offsetHeight + 30);
    document.body.classList.toggle("mapfull", on);
    grip.setAttribute("aria-label", on ? "Menü einblenden" : "Menü ausblenden");
    try{ localStorage.setItem("thailand2027-mapfull", on ? "1" : "0"); }catch(e){}
    if(map) map.panBy([0, on ? -h/2 : h/2], {animate:true, duration:.34});
    relayout();
  };
  window.setMapFull = setFull;
  grip.onclick = () => setFull(!isFull());
  grip.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); setFull(!isFull()); } };
  let y0 = 0, dy = 0, armed = false, dragging = false;
  const start = e => { y0 = e.touches ? e.touches[0].clientY : e.clientY; dy = 0; armed = true; dragging = false; };
  const move = e => {
    if(!armed) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY, d = y - y0;
    if(isFull()){ if(d < -25){ armed = false; setFull(false); } return; } // eingeklappt: hochwischen holt das Menü zurück
    if(!dragging){
      if(d < 6){ if(d < -4) armed = false; return; }
      dragging = true; panel.style.transition = "none";
    }
    dy = Math.max(0, d);
    panel.style.transform = `translateY(${dy}px)`;
    if(e.cancelable) e.preventDefault();
  };
  const end = () => { armed = false; if(!dragging) return; dragging = false; panel.style.transition = ""; panel.style.transform = ""; if(dy > 70) setFull(true); };
  [grip, panel, bar].forEach(el => {
    el.addEventListener("touchstart", e => { if(el === bar && !isFull()) return; if(el === panel && e.target.closest(".wrap") && wrap.scrollTop > 2) return; start(e); }, {passive:true});
    el.addEventListener("touchmove", move, {passive:false});
    el.addEventListener("touchend", end); el.addEventListener("touchcancel", end);
  });
  grip.addEventListener("mousedown", e => { start(e); const mm = ev => move(ev), mu = () => { end(); removeEventListener("mousemove", mm); removeEventListener("mouseup", mu); }; addEventListener("mousemove", mm); addEventListener("mouseup", mu); });
  try{ if(localStorage.getItem("thailand2027-mapfull") === "1"){ document.body.classList.add("mapfull"); grip.setAttribute("aria-label", "Menü einblenden"); } }catch(e){}
  requestAnimationFrame(() => window.fitIsland && window.fitIsland());
  addEventListener("resize", () => map && map.invalidateSize({pan:false}));
})();

/* ---------- Eigener Standort ---------- */
let ME = null, meWatch = null, meError = null, meFollow = false;
const IN_AREA = (lat,lng) => lat > VIEW.bounds[0][0] && lat < VIEW.bounds[1][0] && lng > VIEW.bounds[0][1] && lng < VIEW.bounds[1][1];
function drawMe(){
  if(!map || !meLayer) return; meLayer.clearLayers(); if(!ME) return;
  const stale = Date.now() - ME.at > 120000;
  if(ME.acc < 1500) L.circle([ME.lat, ME.lng], {radius:ME.acc, color:"#1E7BFF", weight:1, opacity:.5, fillOpacity:.1, interactive:false}).addTo(meLayer);
  L.marker([ME.lat, ME.lng], {zIndexOffset:4000, keyboard:false, title:"Du bist hier", icon:L.divIcon({className:"", html:`<div class="mepin${stale?" stale":""}"></div>`, iconSize:[20,20], iconAnchor:[10,10]})})
    .addTo(meLayer).on("click", () => toast("Du bist hier", "standort"));
}
function centerMe(){
  if(ME && ME.inArea) return window.focusOn([ME.lat, ME.lng], Math.max(map.getZoom(), 13), .7);
  if(ME) return toast("Du bist gerade nicht in Thailand", "standort");
  if(meError === 1) return toast("Standort nicht freigegeben. In den Einstellungen für diese Seite erlauben.", "info", 4000);
  if(!navigator.geolocation) return toast("Standort nicht verfügbar", "info");
  meFollow = true; startLocate(); toast("Standort wird gesucht", "standort");
}
function startLocate(){
  if(!navigator.geolocation || meWatch !== null) return;
  meWatch = navigator.geolocation.watchPosition(pos => {
    const {latitude:lat, longitude:lng, accuracy} = pos.coords;
    const first = !ME; meError = null;
    ME = {lat, lng, acc:accuracy, at:Date.now(), inArea:IN_AREA(lat,lng)};
    drawMe();
    if(meFollow){ meFollow = false; centerMe(); }
    $("#locBtn").classList.toggle("on", ME.inArea);
    if(first && ME.inArea) renderAll();
  }, err => { meError = err.code; if(err.code === 1){ stopLocate(); ME = null; drawMe(); $("#locBtn").classList.remove("on"); } },
  {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}
function stopLocate(){ if(meWatch !== null){ navigator.geolocation.clearWatch(meWatch); meWatch = null; } }
// Akku schonen: nur orten, solange die App sichtbar ist
document.addEventListener("visibilitychange", () => { if(document.hidden) stopLocate(); else if(meError !== 1) startLocate(); });
