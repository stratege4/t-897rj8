function pickSheet({title, text, items}){
  return new Promise(res => sheet(`<h3>${esc(title)}</h3>${text ? `<p>${text}</p>` : ""}${group(items.map((it, i) => `<button class="row" data-i="${i}">${it.icon ? `<span class="lead">${ic(it.icon)}</span>` : ""}<span class="txt"><span class="t">${esc(it.label)}</span>${it.sub ? `<span class="s">${esc(it.sub)}</span>` : ""}</span><span class="end">${it.on ? ic("haken") : ""}</span></button>`))}<button class="btn" data-i="-1">Abbrechen</button>`,
    sh => sh.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { closeSheets(); res(+b.dataset.i < 0 ? null : items[+b.dataset.i].value); })));
}
function toast(msg, icon = "haken", ms = 2400, warn = false){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast" + (warn ? " warn" : ""); t.setAttribute("role", "status");
  t.innerHTML = ic(icon) + `<span>${esc(msg)}</span>`; document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
// Zweistufiges Löschen ohne Dialog: erster Tipp fragt nach, zweiter löscht
function armDelete(btn, label, onDelete){
  btn.onclick = () => { if(!btn.dataset.sure){ btn.dataset.sure = "1"; btn.innerHTML = ic("muell") + esc(label); setTimeout(() => { if(btn.isConnected){ delete btn.dataset.sure; btn.innerHTML = ic("muell") + "Löschen"; } }, 4000); return; } onDelete(); };
}

/* ===== 11-reise-ui.js ===== */
/* ---------- Bereich Reise: Übersicht, Prüfung, Aufenthalte, Unterkünfte, Verbindungen ---------- */

// Formulare halten ihren Entwurf in den Parametern der Seite, damit er einen Abstecher (Ort auf der Karte wählen) übersteht
function keepDraft(root){ const p = current().params; p.draft = {...(p.draft || {}), ...readForm(root)}; return p.draft; }

// Entscheidungszustand als Zeile: gewählt (jade), Konflikt (rot), offen oder leer (bernstein). Konflikt nennt nie eine der Optionen als gewählt.
const ZUST_FARBE = {gewaehlt:"var(--accent)", konflikt:"var(--konflikt)", offen:"var(--fehlt)", leer:"var(--fehlt)"};
function lodgeLine(s){
  const ch = stayChoice(s.id), n = nights(s);
  if(ch.zustand === "gewaehlt"){ const pr = lodgingPrice(ch.item, n); return {t:esc(ch.item.name), s:[STATUS[ch.item.status], pr.nacht !== null ? money(pr.nacht, ch.item.waehrung) + " pro Nacht" : "Preis unbekannt"].join(" · "), z:ch.zustand}; }
  if(ch.zustand === "konflikt") return {t:`${ch.alle.length} Unterkünfte gleichzeitig gewählt`, s:"Ungeklärt, bitte eine behalten", z:ch.zustand};
  return {t:ch.aktiv ? `${plural(ch.aktiv, "Option", "Optionen")}, noch keine gewählt` : "Noch keine Unterkunft erfasst", s:ch.aktiv ? "Vergleichen und auswählen" : "Kandidaten sammeln", z:ch.zustand};
}
function connLine(c){
  const ch = connChoice(c.id), o = ch.item;
  if(o) return {icon:TRANSPORT[o.art]?.[1] || "reise", s:[TRANSPORT[o.art]?.[0], optWhen(o), STATUS[o.status]].filter(Boolean).join(" · "), z:ch.zustand};
  if(ch.zustand === "konflikt") return {icon:"warn", s:`${ch.alle.length} Optionen gleichzeitig gewählt, ungeklärt`, z:ch.zustand};
  return {icon:"reise", s:ch.aktiv ? `${plural(ch.aktiv, "Option", "Optionen")}, noch keine gewählt` : "Noch keine Option erfasst", z:ch.zustand};
}
const dateBox = iso => iso ? `<span class="date"><b>${+iso.slice(8,10)}</b><span>${MON[+iso.slice(5,7)-1].replace(".","")}</span></span>` : `<span class="date"><b>?</b><span>Datum</span></span>`;
function stayCard(s){
  const n = nights(s), l = lodgeLine(s);
  return `<div class="tlstay"><button class="top" ${attrGo("stay", {id:s.id})}>${dateBox(s.von)}<span class="info"><h3>${esc(stayName(s))}</h3><div class="meta">${esc(fmtRange(s.von, s.bis))}${n !== null && n > 0 ? " · " + plural(n, "Nacht", "Nächte") : ""}</div></span>${pill(s.status)}</button>
    <button class="lodge z-${l.z}" ${attrGo("stay", {id:s.id})}><span class="lead" style="color:${ZUST_FARBE[l.z]}">${ic(l.z === "konflikt" ? "warn" : "hotel")}</span><span class="t">${l.t}<small>${esc(l.s)}</small></span>${ic("weiter", "chev")}</button></div>`;
}
const linkCard = (inner, attrs, cls = "") => `<div class="tllink"><span class="rail"></span><button class="card ${cls}" ${attrs}>${inner}</button></div>`;
function connCard(c){ const l = connLine(c); return linkCard(`${ic(l.icon)}<span class="t">${esc(connTitle(c))}<small>${esc(l.s)}</small></span>${ic("weiter", "chev")}`, attrGo("conn", {id:c.id}), l.z === "gewaehlt" ? "" : l.z === "konflikt" ? "konflikt" : "warn"); }
const isZeitraumIssue = i => i.ziel?.[0] === "zeitraum";
// Eine Hinzufügen-Aktion für den ganzen Bereich: Aufenthalt oder Verbindung. Ein neuer Aufenthalt beginnt an der ersten Lücke.
function addToTrip(){
  const lk = overview().items.find(x => x.art === "luecke"), last = datedStays().filter(s => s.bis > s.von).pop();
  pickSheet({title:"Hinzufügen", items:[
    {label:"Aufenthalt", sub:lk ? `Ort mit An- und Abreise, Anreise vorbelegt mit ${fmtDate(lk.von)}` : "Ort mit An- und Abreise, danach Unterkünfte sammeln", icon:"hotel", value:"stay"},
    {label:"Verbindung", sub:"Flug, Zug, Bus oder Fähre zwischen zwei Orten", icon:"reise", value:"conn"},
  ]}).then(v => v === "stay" ? go("neuStay", lk ? {von:lk.von, luecke:lk.bis} : last ? {von:last.bis} : {}) : v === "conn" ? go("neuConn", {}) : null);
}
// Platzhalter „Verbindung fehlt“: eine vorhandene zuordnen (z. B. einen schon erfassten Flug) oder eine neue anlegen
function fillGap(x){
  const neu = () => go("neuConn", {vonStay:x.von?.id || null, nachStay:x.nach?.id || null});
  const cands = connCandidates(x); if(!cands.length) return neu();
  pickSheet({title:x.richtung === "anreise" ? `Anreise nach ${stayName(x.nach)}` : x.richtung === "abreise" ? `Abreise ab ${stayName(x.von)}` : `${stayName(x.von)} → ${stayName(x.nach)}`,
    text:"Eine schon erfasste Verbindung zuordnen oder eine neue anlegen.",
    items:[...cands.map(c => ({label:connTitle(c), sub:connLine(c).s, icon:connLine(c).icon, value:c.id})), {label:"Neue Verbindung anlegen", icon:"plus", value:"neu"}]})
    .then(v => { if(!v) return; if(v === "neu") return neu(); linkConn(v, x); commit("Verbindung zugeordnet"); });
}

VIEWS.reise = () => {
  const r = tripRange(), b = tripBounds(), all = stays(), cs = conns(), iss = planIssues().filter(i => !isZeitraumIssue(i));
  const add = `<button class="navbtn" data-act="add" aria-label="Aufenthalt oder Verbindung hinzufügen">${ic("plus")}</button>`;
  // Der Zeitraum steht genau einmal da: festgelegt als tippbare Zeile unter der Überschrift, sonst als Karte mit einer Hauptaktion
  const sub = r ? `<button class="subbtn" ${attrGo("zeitraum")}>${esc(fmtRange(r.start, r.end))} · ${plural(dayDiff(r.end, r.start), "Nacht", "Nächte")}${ic("weiter")}</button>` : "";
  const setup = r ? "" : `<div class="setup"><div class="setup-t">${ic("zeitraum")}<span><b>Reisezeitraum festlegen</b><small>${b ? `Eure Planung reicht bisher vom ${esc(fmtDateLong(b.start))} bis ${esc(fmtDateLong(b.end))}. Legt ihn fest, dann prüft die App jede Nacht darin.` : "Erster und letzter Reisetag. Danach prüft die App jede Nacht darin. Kann offen bleiben, bis er feststeht."}</small></span></div><button class="btn primary block" ${attrGo("zeitraum")}>Zeitraum festlegen</button></div>`;
  if(!all.length && !cs.length) return {title:"Reise", large:true, sub,
    html:`${empty("reise", "Plant eure Reise", "Aufenthaltsorte anlegen, je Ort Unterkünfte sammeln und eine wählen, dann die Verbindungen dazwischen. Die App wählt nichts selbst aus.",
      `<div class="btns" style="width:100%"><button class="btn primary" ${attrGo("neuStay", {})}>${ic("plus")}Ersten Aufenthalt anlegen</button><button class="btn" ${attrGo("neuConn", {})}>${ic("flug")}Flug oder Verbindung</button></div>`)}
      ${setup}
      ${sect("Schon vorhanden", group([row({icon:"karte", t:"Spots auf der Karte", s:"Eure Sammlung, unabhängig von der Reiseplanung", act:"zurKarte"})]))}`,
    mount(el){ el.querySelector('[data-act="zurKarte"]').onclick = () => switchTab("karte"); }};
  const ov = overview(), cnt = lvl => iss.filter(i => i.lvl === lvl).length;
  const tally = ["konflikt","fehlt","offen"].filter(cnt).map(l => `<span class="tal ${l}">${cnt(l)} ${l === "konflikt" ? (cnt(l) === 1 ? "Konflikt" : "Konflikte") : l}</span>`).join("");
  // Oben steht nur der nächste Schritt (alle Konflikte, sonst der früheste Punkt), der Rest ist im Ablauf und in „Prüfung“
  const naechste = cnt("konflikt") ? iss.filter(i => i.lvl === "konflikt").slice(0, 3) : iss.slice(0, 1);
  const status = iss.length ? sect(naechste.length > 1 ? "Zuerst klären" : "Nächster Schritt", `<div class="group">${issueRows(naechste)}${iss.length > naechste.length ? `<button class="lvl more" ${attrGo("pruefung")}><span class="tx">Alle ${plural(iss.length, "offenen Punkt", "offenen Punkte")}</span><span class="tally">${tally}</span>${ic("weiter", "chev")}</button>` : ""}</div>`)
    : r ? `<div class="allok">${ic("haken")}<span>Alles geprüft: keine Konflikte, keine Lücken, alles entschieden.</span></div>` : "";
  const tl = ov.items.map((x, i) => x.art === "stay" ? stayCard(x.s) : x.art === "conn" ? connCard(x.c)
    : x.art === "luecke" ? linkCard(`${ic("warn")}<span class="t">${plural(x.n, "Nacht", "Nächte")} ohne Aufenthalt<small>${esc(fmtRange(x.von, x.bis))} · Aufenthalt anlegen</small></span>${ic("plus")}`, attrGo("neuStay", {von:x.von, luecke:x.bis}), "warn")
    : linkCard(`${ic("plus")}<span class="t">${x.richtung === "anreise" ? "Anreise nach " + esc(stayName(x.nach)) : x.richtung === "abreise" ? "Abreise ab " + esc(stayName(x.von)) : esc(stayName(x.von)) + " → " + esc(stayName(x.nach))}<small>Verbindung fehlt · zuordnen oder anlegen</small></span>`, `data-gap="${i}"`, "dashed")).join("");
  return {title:"Reise", large:true, sub, right:add,
    html:`${setup}${status}
      ${sect("Ablauf", ov.items.length ? `<div class="tl">${tl}</div>` : `<p class="hint">Noch nichts mit Datum. Tippt oben auf +.</p>`)}
      ${ov.ohneDatum.length ? sect("Ohne gültiges Datum", ov.ohneDatum.map(stayCard).join("")) : ""}
      ${ov.rest.length ? sect("Noch ohne Datum", `<p class="hint">Verbindungen ohne gewählte Option und ohne verknüpften Aufenthalt.</p>` + group(ov.rest.map(c => { const l = connLine(c); return row({icon:l.icon, t:esc(connTitle(c)), s:esc(l.s), go:"conn", p:{id:c.id}}); }))) : ""}`,
    mount(el){
      el.querySelectorAll("[data-gap]").forEach(b => b.onclick = () => fillGap(ov.items[+b.dataset.gap]));
      el.querySelector('.nav [data-act="add"]')?.addEventListener("click", addToTrip);
    }};
};

VIEWS.pruefung = () => {
  const iss = planIssues(), by = l => iss.filter(i => i.lvl === l);
  const block = (l, title, text) => by(l).length ? sect(title, `<p class="hint">${text}</p><div class="group">${issueRows(by(l))}</div>`) : "";
  return {title:"Prüfung", large:true, sub:iss.length ? plural(iss.length, "Punkt", "Punkte") : "Nichts offen",
    html:iss.length ? block("konflikt", "Konflikte", "Echte Widersprüche, die ihr auflösen müsst. Bis dahin verwendet die App keine der beteiligten Angaben.") + block("fehlt", "Fehlt", "Hier fehlt ein Eintrag. Die App schätzt nichts.") + block("offen", "Offene Entscheidungen", "Noch nicht entschieden. Die App wählt nichts selbst aus.")
      : empty("haken", "Alles geprüft", "Keine Konflikte, keine Lücken, alle Entscheidungen getroffen.")};
};

VIEWS.zeitraum = p => {
  const b = tripBounds(), vorschlag = !S.meta.reise && b ? {start:b.start, end:b.end} : null;
  const r = p.draft || S.meta.reise || vorschlag || {};
  return {title:"Reisezeitraum", form:true,
    html:`<div class="form">${vorschlag && !p.draft ? `<p class="note">Vorschlag aus eurer Planung (gewählte Verbindungen und Aufenthalte). Prüft die Tage, gespeichert wird erst mit „Festlegen“.</p>` : ""}
      <div class="fgroup">${fRow(fText("start", "Erster Tag", r.start, {type:"date"}), fText("end", "Letzter Tag", r.end, {type:"date"}))}</div>
      <p class="fhint" id="zN"></p>
      <p class="fhint">Erster Tag ist der Abreisetag zu Hause, letzter der Rückreisetag. Bleibt auf euren Geräten und geht nur über den Abgleich ans andere Handy.</p>
      ${S.meta.reise ? `<button type="button" class="btn ghost" data-act="clear">Zeitraum wieder offen lassen</button>` : ""}</div>`,
    bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="save">Festlegen</button>`,
    mount(el){
      el.querySelector('[data-act="clear"]')?.addEventListener("click", () => confirmSheet({title:"Zeitraum offen lassen?", text:"Tage und Prüfung richten sich dann wieder nach euren Aufenthalten und gewählten Verbindungen.", ok:"Offen lassen"})
        .then(y => { if(!y) return; S.meta.reise = null; S.meta.at = Date.now(); persist(); back(); toast("Zeitraum ist wieder offen", "zeitraum"); }));
      const upd = () => { const f = readForm(el); el.querySelector("#zN").textContent = f.start && f.end ? (f.end >= f.start ? plural(dayDiff(f.end, f.start), "Nacht", "Nächte") : "Der letzte Tag liegt vor dem ersten.") : ""; };
      el.querySelectorAll("input").forEach(x => x.addEventListener("input", upd)); upd();
      el.querySelector('[data-act="save"]').onclick = () => {
        const f = readForm(el);
        if((f.start && !f.end) || (!f.start && f.end)) return toast("Beide Tage eintragen oder beide leer lassen", "warn", 3000, true);
        if(f.start && f.end < f.start) return toast("Der letzte Tag liegt vor dem ersten", "warn", 3000, true);
        S.meta.reise = f.start ? {start:f.start, end:f.end} : null; S.meta.at = Date.now();
        persist(); back(); toast(f.start ? "Zeitraum festgelegt" : "Zeitraum ist offen");
      };
    }};
};

/* ---------- Aufenthalt ---------- */
VIEWS.stay = ({id}) => {
  const s = rec("stays", id); if(!s) return {title:"Nicht gefunden", html:empty("info", "Dieser Aufenthalt wurde gelöscht.", "")};
  const n = nights(s), ls = lodgingsOf(id), ch = stayChoice(id), aktiv = ls.filter(l => !RAUS.has(l.status)), raus = ls.filter(l => RAUS.has(l.status));
  const cin = conns().filter(c => c.nachStay === id), cout = conns().filter(c => c.vonStay === id);
  const preisText = l => { const pr = lodgingPrice(l, n); return [pr.nacht !== null ? money(pr.nacht, l.waehrung) + " / Nacht" : "Preis unbekannt", pr.gesamt !== null && n ? money(pr.gesamt, l.waehrung) + " gesamt" : null].filter(Boolean).join(" · "); };
  const lrow = l => row({icon:"hotel", c:ch.zustand === "gewaehlt" && GEWAEHLT.has(l.status) ? "--accent" : null, t:esc(l.name), s:esc([l.art, preisText(l)].filter(Boolean).join(" · ")), s2:!Number.isFinite(l.lat) ? "Kartenpunkt fehlt" : "", end:pill(l.status), go:"lodging", p:{id:l.id}});
  const addRow = row({icon:"plus", t:"Unterkunftsoption hinzufügen", go:"lodgingEdit", p:{stayId:id}, cls:"addrow", chev:false});
  const keepRow = l => `<div class="row"><span class="lead c" style="--c:var(--konflikt)">${ic("hotel")}</span><span class="txt"><button class="t linkish" ${attrGo("lodging", {id:l.id})}>${esc(l.name)}</button><span class="s">${esc(STATUS[l.status] + " · " + preisText(l))}</span></span><button class="btn small" data-keep="${l.id}">Behalten</button></div>`;
  const andere = aktiv.filter(l => !(ch.zustand !== "offen" && GEWAEHLT.has(l.status)));
  const cmp = aktiv.length > 1 ? `<button class="link" ${attrGo("compare", {col:"lodgings", parent:id})}>Vergleichen</button>` : "";
  const unterkunft = ch.zustand === "gewaehlt" ? sect("Gewählte Unterkunft", group([lrow(ch.item)]) + `<p class="hint">Start und Ziel der Tagespläne in dieser Zeit.</p>`, cmp)
    : ch.zustand === "konflikt" ? sect("Unterkunft ungeklärt", `<p class="note konflikt">${ch.alle.length} Optionen sind gleichzeitig gewählt, meist nach einem Abgleich. Bis ihr eine behaltet, gilt keine: Tagespläne haben hier keinen Startpunkt. Die andere wird Favorit, nichts geht verloren.</p>` + `<div class="group">${ch.alle.map(keepRow).join("")}</div>`, cmp)
    : "";
  const optionen = ch.zustand === "leer" ? sect("Unterkunft", empty("hotel", "Noch keine Unterkunft", "Sammelt hier alle Kandidaten, die ihr recherchiert habt, mit Preis, Link und Lage. Danach vergleicht ihr und wählt eine.", `<button class="btn primary" ${attrGo("lodgingEdit", {stayId:id})}>${ic("plus")}Erste Option hinzufügen</button>`))
    : sect(ch.zustand === "offen" ? "Unterkunftsoptionen" : "Alternativen", (ch.zustand === "offen" ? `<p class="hint">Noch keine gewählt. Öffnet eine Option oder vergleicht sie.</p>` : "") + group([...andere.map(lrow), addRow]), ch.zustand === "offen" ? cmp : "");
  const days = s.von && s.bis && s.bis >= s.von ? Array.from({length:dayDiff(s.bis, s.von) + 1}, (_, i) => addDays(s.von, i)) : [];
  const crow = c => { const l = connLine(c); return row({icon:l.icon, c:l.z === "konflikt" ? "--konflikt" : null, t:esc(connTitle(c)), s:esc(l.s), go:"conn", p:{id:c.id}}); };
  return {title:stayName(s), large:true, sub:`${esc(fmtRange(s.von, s.bis))}${n !== null && n > 0 ? " · " + plural(n, "Nacht", "Nächte") : ""} · ${pill(s.status)}`,
    right:`<button class="navbtn" ${attrGo("stayEdit", {id})}>Bearbeiten</button>`,
    html:`${unterkunft}${optionen}
      ${raus.length ? `<details class="group"><summary class="row"><span class="txt"><span class="s">${plural(raus.length, "verworfene oder stornierte Option", "verworfene oder stornierte Optionen")}</span></span></summary>${raus.map(lrow).join("")}</details>` : ""}
      ${sect("An- und Weiterreise", group([...cin.map(crow), ...(cin.length ? [] : [row({icon:"plus", t:"Anreise zuordnen oder anlegen", act:"anreise", cls:"addrow", chev:false})]), ...cout.map(crow), ...(cout.length ? [] : [row({icon:"plus", t:"Weiterreise zuordnen oder anlegen", act:"abreise", cls:"addrow", chev:false})])]))}
      ${days.length ? sect("Tage hier", group(days.map(d => { const pl = dayPlanFor(d), k = pl ? pl.plan.stationen.filter(x => P(x.placeId)).length : 0; return row({icon:"kalender", t:esc(fmtDateLong(d)), s:d === s.von ? "Anreise" : d === s.bis ? "Abreise" : k ? plural(k, "Spot", "Spots") : "noch leer", end:k && d !== s.von && d !== s.bis ? "" : k ? plural(k, "Spot", "Spots") : "", go:"day", p:{d}}); }))) : ""}
      ${s.notiz ? sect("Notiz", `<div class="group rowx"><p class="prose">${esc(s.notiz)}</p></div>`) : ""}`,
    mount(el){
      el.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => keepOption("lodgings", b.dataset.keep));
      el.querySelector('[data-act="anreise"]')?.addEventListener("click", () => fillGap({nach:s, richtung:"anreise"}));
      el.querySelector('[data-act="abreise"]')?.addEventListener("click", () => fillGap({von:s, richtung:"abreise"}));
    }};
};
// Wählen bzw. bei einem Konflikt behalten. Blockiert eine gebuchte Option, sagt die App, was zu tun ist.
function keepOption(col, id){
  const r = chooseOption(col, id), o = rec(col, id);
  if(!r.ok && r.blockiert) return toast(`${r.blockiert.name || [TRANSPORT[r.blockiert.art]?.[0], r.blockiert.anbieter].filter(Boolean).join(" ") || "Eine andere Option"} ist gebucht. Setzt sie zuerst auf „Storniert“.`, "warn", 4200, true);
  commit(`${o?.name || [TRANSPORT[o?.art]?.[0], o?.anbieter].filter(Boolean).join(" ") || "Option"} gewählt`);
}

VIEWS.neuStay = p => VIEWS.stayEdit({...p, neu:true});
VIEWS.stayEdit = p => {
  const s = p.neu ? null : rec("stays", p.id);
  const d = p.draft || (s ? {ort:s.ort, von:s.von, bis:s.bis, status:s.status, notiz:s.notiz} : {ort:"", von:p.von || null, bis:p.bis || null, status:"idee", notiz:""});
  const lc = s ? lodgingsOf(s.id).length : 0;
  return {title:s ? "Aufenthalt bearbeiten" : "Neuer Aufenthalt", form:true,
    html:`<div class="form">
      <div class="fgroup">${fText("ort", "Ort", d.ort, {ph:"z. B. Stadt, Insel oder Region"})}</div>
      <div class="fgroup">${fRow(fText("von", "Anreise", d.von, {type:"date"}), fText("bis", "Abreise", d.bis, {type:"date"}))}
        <div class="field"><span>Nächte</span><div class="stepper"><button type="button" data-n="-1" aria-label="Eine Nacht weniger">−</button><output id="nN">–</output><button type="button" data-n="1" aria-label="Eine Nacht mehr">+</button></div></div>
        <div class="field"><span>Ganzen Aufenthalt um einen Tag verschieben</span><div class="btns"><button type="button" class="btn" data-shift="-1">${ic("zurueck")}Früher</button><button type="button" class="btn" data-shift="1">Später${ic("weiter")}</button></div></div></div>
      <p class="fhint">Abreise ist der Tag, an dem ihr weiterfahrt.${p.luecke && !s ? ` Die Lücke reicht bis ${esc(fmtDateLong(p.luecke))}.` : ""}</p>
      <div class="flabel">Stand</div>${fChips("status", Object.entries(STAY_STATUS), d.status || "idee", {req:true})}
      <div class="fgroup">${fArea("notiz", "Notiz", d.notiz, "Optional")}</div>

    html:`${entscheidung}
      ${sect("Angaben", group(facts))}

      ${l.notiz ? sect("Notiz", `<div class="group rowx"><p class="prose">${esc(l.notiz)}</p></div>`) : ""}

    mount(el){

let pickMap = null;
VIEWS.ortWahl = p => ({title:"Ort wählen", form:true,
  html:`<p class="hint">Karte verschieben, bis die Markierung auf der Einfahrt liegt. ${esc(p.titel || "")}</p>
    <div class="picker"><div class="pmap" id="pmap"></div><div class="cross">${ic("pin")}</div></div>

  bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="ok">Übernehmen</button>`,
  mount(el){
    if(!window.L){ el.querySelector("#pmap").innerHTML = '<p style="padding:20px">Karte nicht geladen. Koordinaten bitte als Text einfügen.</p>'; return; }
    const prev = stackOf()[stackOf().length - 2]?.params || {};
    const start = Number.isFinite(p.lat) ? [p.lat, p.lng] : ME?.inArea ? [ME.lat, ME.lng] : VIEW.center;

    el.querySelector('[data-act="me"]').onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(pos => pickMap.setView([pos.coords.latitude, pos.coords.longitude], 16), () => toast("Standort nicht freigegeben", "warn", 2600, true), {enableHighAccuracy:true, timeout:8000}) : toast("Standort nicht verfügbar", "warn", 2600, true);

/* ---------- Vergleich (Unterkünfte oder Transportoptionen) ---------- */
VIEWS.compare = ({col, parent, alle}) => {
  const isL = col === "lodgings", owner = isL ? rec("stays", parent) : rec("conns", parent);
  if(!owner) return {title:"Vergleich", html:empty("info", "Nicht mehr vorhanden.", "")};
  // feste Reihenfolge nach Erfassung: nach dem Wählen springt keine Karte unter dem Finger weg
  const n = isL ? nights(owner) : null, listAll = (isL ? lodgingsOf(parent) : optsOf(parent)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id)), list = alle ? listAll : listAll.filter(o => !RAUS.has(o.status));
  if(list.length < 1) return {title:"Vergleich", html:empty("vergleich", "Nichts zu vergleichen", "Legt mindestens zwei Optionen an.")};
  const ch = chosenOf(list), unb = `<span class="muted">unbekannt</span>`, val = v => v === null || v === undefined || v === "" ? unb : v;
  // günstigste je Währung hervorheben, Währungen werden nie umgerechnet. Unterkünfte nach Gesamtpreis, solange die Nächte feststehen.
  const priceOf = o => isL ? (n ? lodgingPrice(o, n).gesamt : lodgingPrice(o, n).nacht) : o.preis;
  const best = {}; list.forEach(o => { const v = priceOf(o); if(Number.isFinite(v)) best[o.waehrung || "THB"] = Math.min(best[o.waehrung || "THB"] ?? Infinity, v); });
  const isBest = o => { const v = priceOf(o); return Number.isFinite(v) && best[o.waehrung || "THB"] === v && list.filter(x => Number.isFinite(priceOf(x)) && (x.waehrung || "THB") === (o.waehrung || "THB")).length > 1; };
  // Jede Karte hat dieselben Zeilen in derselben Reihenfolge, Unbekanntes steht als „unbekannt“ da statt zu fehlen
  const price = o => { if(!isL) return Number.isFinite(o.preis) ? money(o.preis, o.waehrung) : null; const pr = lodgingPrice(o, n); return pr.nacht === null && pr.gesamt === null ? null : [pr.nacht !== null ? money(pr.nacht, o.waehrung) + " / Nacht" : null, pr.gesamt !== null ? money(pr.gesamt, o.waehrung) + " gesamt" : null].filter(Boolean).join(" · "); };
  const facts = o => isL ? [
    ["Lage", esc(o.adresse || "") || (Number.isFinite(o.lat) ? "auf der Karte gesetzt" : null)],
    ["Art", esc(o.art || "")],
    ["Eure Wertung", o.bewertung ? "★".repeat(o.bewertung) : null],
    ["Check-in/out", [o.checkin, o.checkout].filter(Boolean).join(" / ")],
  ] : [
    ["Abfahrt", [o.datum ? fmtDate(o.datum) : null, o.ab].filter(Boolean).join(" ")],
    ["Ankunft", [o.anDatum && o.anDatum !== o.datum ? fmtDate(o.anDatum) : null, o.an].filter(Boolean).join(" ")],
    ["Dauer", o.dauerMin ? esc(optDauer(o)) + (o.dauerOk ? "" : " (geschätzt)") : null],
    ["Anbieter", esc([o.anbieter, o.nummer].filter(Boolean).join(" "))],
  ];
  const head = o => isL ? esc(o.name) : esc([TRANSPORT[o.art]?.[0], o.anbieter].filter(Boolean).join(" · ") || "Option");
  const action = o => GEWAEHLT.has(o.status) && ch.mehrere ? `<button class="btn primary" data-choose="${o.id}">Behalten</button>`
    : GEWAEHLT.has(o.status) ? `<span class="chosen">${ic("haken")}${o.status === "gebucht" ? "Gebucht" : "Gewählt"}</span>`
    : RAUS.has(o.status) ? "" : `<button class="btn" data-choose="${o.id}">Wählen</button>`;
  const card = o => `<article class="ccard${GEWAEHLT.has(o.status) ? (ch.mehrere ? " konflikt" : " on") : ""}">
      <header><button class="t" ${attrGo(isL ? "lodging" : "opt", {id:o.id})}>${head(o)}</button>${pill(o.status)}</header>
      <div class="cprice${isBest(o) ? " best" : ""}">${val(price(o))}${isBest(o) ? `<span class="tag">günstigste</span>` : ""}</div>
      <dl>${facts(o).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${val(v)}</dd>`).join("")}</dl>
      ${o.notiz ? `<p class="cnote">${esc(o.notiz.slice(0, 140))}${o.notiz.length > 140 ? " …" : ""}</p>` : ""}
      <footer>${o.link ? `<a class="btn ghost" href="${esc(o.link)}" target="_blank" rel="noopener">${ic("extern")}Seite</a>` : ""}${action(o)}</footer>
    </article>`;
  return {title:"Vergleich", large:true, sub:esc(isL ? stayName(owner) + (n ? " · " + plural(n, "Nacht", "Nächte") : "") : connTitle(owner)),
    html:`${ch.mehrere ? `<p class="note konflikt">${ch.alle.length} Optionen sind gleichzeitig gewählt. Behaltet eine, die andere wird Favorit.</p>` : ""}
      <div class="ccards">${list.map(card).join("")}</div>
      <p class="hint">Hervorgehoben ist der niedrigste ${isL && n ? "Gesamtpreis" : "Preis"} innerhalb derselben Währung. Euro und Baht werden nicht umgerechnet, Unbekanntes bleibt unbekannt.</p>
      ${listAll.length > list.length || alle ? `<button class="btn ghost" ${attrGo("compare", {col, parent, alle:!alle})}>${alle ? "Verworfene ausblenden" : "Auch verworfene zeigen"}</button>` : ""}`,
    mount(el){ el.querySelectorAll("[data-choose]").forEach(b => b.onclick = () => keepOption(col, b.dataset.choose)); }};
};

/* ---------- Verbindung und Transportoptionen ---------- */
VIEWS.conn = ({id}) => {
  const c = rec("conns", id); if(!c) return {title:"Nicht gefunden", html:empty("info", "Diese Verbindung wurde gelöscht.", "")};
  const os = optsOf(id), ch = connChoice(id), aktiv = os.filter(o => !RAUS.has(o.status)), raus = os.filter(o => RAUS.has(o.status));

/* ===== 13-karte-ui.js ===== */
/* ---------- Bereich Karte: Spots, Unterkünfte, Route des aktiven Tages ----------
   Die Karte (Leaflet) wird einmal angelegt und bleibt bestehen, Detailseiten legen sich darüber.
   Vorgeladen werden die Landesübersicht (Zoom 5 bis 8) und 6 km um jede Unterkunft (Zoom 10 bis 14). */
let map = null, markerLayer, routeLayer, poiLabelLayer, meLayer;
const TILE_URL = "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
const VIEW = {center:[13.0, 101.0], bounds:[[4.5, 96.5], [21.5, 106.5]]};
UI.karteModus = "karte";
const zoomBucket = z => z < 11 ? 0 : z < 12 ? 1 : 2;
let lastBucket = -1;

function tileUrls(sw, ne, z0, z1){
  const out = [];
  for(let z = z0; z <= z1; z++){ const a = map.project([ne[0], sw[1]], z).divideBy(256).floor(), b = map.project([sw[0], ne[1]], z).divideBy(256).floor();
    for(let x = a.x; x <= b.x; x++) for(let y = a.y; y <= b.y; y++) out.push(TILE_URL.replace("{z}", z).replace("{y}", y).replace("{x}", x)); }
  return out;
}
const tileJobKey = u => "uk:" + u.lat.toFixed(3) + "," + u.lng.toFixed(3);
let prefetching = false;
async function prefetchTiles(){
  const con = navigator.connection;
  if(prefetching || !map || navigator.onLine === false || con?.saveData || !navigator.serviceWorker?.controller) return;
  const done = new Set(LS.get("thailand2027-tiles") || []), jobs = [];
  if(!done.has("land")) jobs.push(["land", tileUrls(VIEW.bounds[0], VIEW.bounds[1], 5, 8)]);
  mapLodgings().forEach(u => { const k = tileJobKey(u); if(done.has(k)) return; const dy = 6/111, dx = dy/Math.cos(u.lat*Math.PI/180); jobs.push([k, tileUrls([u.lat-dy, u.lng-dx], [u.lat+dy, u.lng+dx], 10, 14)]); });
  if(!jobs.length) return;
  prefetching = true;
  try{
    for(const [k, urls] of jobs){
      let ok = 0;
      for(let i = 0; i < urls.length; i += 4){
        if(navigator.onLine === false) return;
        const r = await Promise.all(urls.slice(i, i+4).map(u => fetch(u, {mode:"cors"}).then(x => x.ok).catch(() => false)));
        ok += r.filter(Boolean).length; await new Promise(res => setTimeout(res, 120));
      }
      if(ok >= urls.length * 0.9){ done.add(k); LS.set("thailand2027-tiles", [...done]); }
    }
  } finally { prefetching = false; }
}
function offlineInfo(){
  const done = new Set(LS.get("thailand2027-tiles") || []), uks = mapLodgings();
  const legs = Object.values(S.plans).filter(pl => pl.datum >= today() && pl.plan.stationen.length).flatMap(pl => planLegs(pl.plan).map(l => ({pl, l})));
  const fehlt = legs.filter(({pl, l}) => modeOf(pl.plan) !== "frei" && legTime(pl.plan, l[0], l[1]).min === null).length;
  return [["Karte, Landesübersicht", done.has("land") ? "gespeichert" : "noch nicht"],
    ["Karte rund um Unterkünfte", uks.length ? uks.filter(u => done.has(tileJobKey(u))).length + " von " + uks.length : "keine mit Ort"],
    ["Fahr- und Gehzeiten geplanter Tage", legs.length ? (fehlt ? fehlt + " fehlen" : "alle da") : "nichts geplant"]];
}

  map.on("zoomend", () => { if(map.getZoom() >= 11) townMinor.addTo(map); else townMinor.remove(); if(zoomBucket(map.getZoom()) !== lastBucket) renderMarkers(); });

function renderFilter(){

function renderMarkers(){
  if(!map) return; markerLayer.clearLayers(); routeLayer.clearLayers(); poiLabelLayer.clearLayers();

  const ad = editDay(), pl = dayPlanFor(ad), inPlan = new Set((pl?.plan.stationen || []).map(x => x.placeId));

    const done = p.status === "besucht";

      .addTo(markerLayer).on("click", () => go("spot", {id:p.id}));
    if(bucket === 2 && !TOWNNAMES.has(p.name)) L.marker([p.lat, p.lng], {interactive:false, keyboard:false, zIndexOffset:-500, icon:L.divIcon({className:"", html:`<span class="lbl poi${done ? " done" : ""}">${esc(p.name)}</span>`, iconSize:null, iconAnchor:[-size/2-4, 10]})}).addTo(poiLabelLayer);
  });
  const box = $("#mDay");
  if(pl && pl.plan.stationen.some(s => P(s.placeId))){
    const legs = planLegs(pl.plan), mode = modeOf(pl.plan);
    ensureRoutes(legs, mode);
    legs.forEach(([a, b]) => {
      const r = routeFor(a, b, mode), lt = legTime(pl.plan, a, b);
      const pts = r && r[2] ? decodePoly(r[2]) : [[a.lat, a.lng], [b.lat, b.lng]];
      const dash = r ? null : "2 10"; // ohne berechnete Route nur gestrichelt, keine Straßenlinie
      L.polyline(pts, {color:"#0B1411", opacity:.55, weight:8, lineCap:"round", lineJoin:"round", dashArray:dash, interactive:false}).addTo(routeLayer);
      L.polyline(pts, {color:"#7FE0C6", opacity:1, weight:4, lineCap:"round", lineJoin:"round", dashArray:dash, interactive:false}).addTo(routeLayer);
      if(lt.min !== null && lt.min >= (bucket === 0 ? 20 : 3)) L.marker(midOf(pts), {interactive:false, keyboard:false, zIndexOffset:-800, icon:L.divIcon({className:"", html:`<span class="rtlbl">${lt.src === "eigen" ? "" : "ca. "}${lt.min} min${mode === "fuss" ? " zu Fuß" : ""}</span>`, iconSize:null, iconAnchor:[0,0]})}).addTo(routeLayer);
    });
    if(box){ box.hidden = false; box.innerHTML = `${ic("route")}<span>Route ${esc(fmtDate(ad))} · ${plural(pl.plan.stationen.filter(s => P(s.placeId)).length, "Spot", "Spots")}</span><button class="navbtn" data-openday>Tag öffnen</button>`; box.querySelector("[data-openday]").onclick = () => go("day", {d:ad}); }
  } else if(box) box.hidden = true;
}
function midOf(pts){
  const d = pts.slice(1).map((p, i) => Math.hypot(p[0]-pts[i][0], (p[1]-pts[i][1])*.77));
  let half = d.reduce((a, b) => a + b, 0)/2;
  for(let i = 0; i < d.length; i++){ if(half <= d[i]){ const f = d[i] ? half/d[i] : 0; return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f, pts[i][1]+(pts[i+1][1]-pts[i][1])*f]; } half -= d[i]; }
  return pts[0];
}

/* ---------- Eigener Standort ---------- */
let ME = null, meWatch = null, meError = null, meFollow = false;
const IN_AREA = (lat, lng) => lat > VIEW.bounds[0][0] && lat < VIEW.bounds[1][0] && lng > VIEW.bounds[0][1] && lng < VIEW.bounds[1][1];
function drawMe(){
  if(!map || !meLayer) return; meLayer.clearLayers(); if(!ME) return;
  const stale = Date.now() - ME.at > 120000;
  if(ME.acc < 1500) L.circle([ME.lat, ME.lng], {radius:ME.acc, color:"#1E7BFF", weight:1, opacity:.5, fillOpacity:.1, interactive:false}).addTo(meLayer);
  L.marker([ME.lat, ME.lng], {zIndexOffset:4000, keyboard:false, title:"Du bist hier", icon:L.divIcon({className:"", html:`<div class="mepin${stale ? " stale" : ""}"></div>`, iconSize:[18,18], iconAnchor:[9,9]})}).addTo(meLayer);
}
function centerMe(){
  if(ME && ME.inArea) return map?.setView([ME.lat, ME.lng], Math.max(map.getZoom(), 14));
  if(ME) return toast("Du bist gerade nicht in Thailand", "standort");
  if(meError === 1) return toast("Standort nicht freigegeben. In den Einstellungen für diese Seite erlauben.", "warn", 4000, true);
  if(!navigator.geolocation) return toast("Standort nicht verfügbar", "warn", 2600, true);
  meFollow = true; startLocate(); toast("Standort wird gesucht", "standort");
}
function startLocate(){
  if(!navigator.geolocation || meWatch !== null) return;
  meWatch = navigator.geolocation.watchPosition(pos => {
    const {latitude:lat, longitude:lng, accuracy} = pos.coords;
    meError = null; ME = {lat, lng, acc:accuracy, at:Date.now(), inArea:IN_AREA(lat, lng)};
    drawMe(); if(meFollow){ meFollow = false; centerMe(); }
    $("#mLoc")?.classList.toggle("on", ME.inArea);
  }, err => { meError = err.code; if(err.code === 1){ stopLocate(); ME = null; drawMe(); } }, {enableHighAccuracy:true, maximumAge:15000, timeout:30000});
}
function stopLocate(){ if(meWatch !== null){ navigator.geolocation.clearWatch(meWatch); meWatch = null; } }

  const hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if(hadCtrl && !window._reloaded){ window._reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
}

</script>
