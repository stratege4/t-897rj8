}
function deleteConn(id){ optsOf(id).forEach(o => setRec("opts", o.id, {weg:true})); setRec("conns", id, {weg:true}); }

/* ===== 04-routen.js ===== */
/* ---------- Routen (OpenStreetMap) ----------
   Vorab berechnete Autorouten stehen in DATA.routes (routen.js), alles andere wird bei Netz nachgeladen und nur auf
   dem Gerät gespeichert (RCACHE). Fahrzeiten ab Unterkünften entstehen nur hier, nie in den öffentlichen Dateien.
   Verkehrsmittel eines Tagesplans, Autozeiten gelten nie für andere Verkehrsmittel:
   auto  Straßenrouten über router.project-osrm.org (der Dienst rechnet nur Auto, auch wenn man "foot" anfragt)
   fuss  Fußrouten über routing.openstreetmap.de (FOSSGIS, Profil routed-foot), ohne Puffer
   frei  Boot, Bus, Bahn: keine Berechnung, nur von euch eingetragene Zeiten je Abschnitt */
const ROUTE_FACTOR = 1.15; // Puffer für Ortsdurchfahrten, Parkplatzsuche, Verkehr
const RCACHE = LS.get("thailand2027-routes") || {};
const rid = x => (x && x.id) || null;
const rkey = (a,b) => [a,b].sort().join("|");
const LMODES = {auto:{l:"Auto, Taxi", icon:"auto", gm:"driving", wort:"Fahrt"}, fuss:{l:"Zu Fuß", icon:"gehen1", gm:"walking", wort:"zu Fuß"}, frei:{l:"Boot, Bus, Bahn", icon:"faehre", gm:"transit", wort:"unterwegs"}};
const modeOf = plan => LMODES[plan?.modus] ? plan.modus : "auto";
// Cache-Schlüssel mit Koordinaten: ein verschobener Punkt bekommt nie eine alte Route
const pkey = x => x.id + "@" + (+x.lat).toFixed(4) + "," + (+x.lng).toFixed(4);
const ckey = (a, b, mode) => (mode === "fuss" ? "fuss:" : "") + [pkey(a), pkey(b)].sort().join("|");
function routeFor(a,b,mode="auto"){ if(mode === "frei") return null; const ka = rid(a), kb = rid(b); if(!ka || !kb) return null; if(ka===kb) return [0,0,""]; return (mode === "auto" && !a.moved && !b.moved ? DATA.routes?.[rkey(ka,kb)] : null) || RCACHE[ckey(a, b, mode)] || null; }
function travel(a,b,mode="auto"){ const r = routeFor(a,b,mode); return r ? Math.round(r[0]*(mode === "auto" ? ROUTE_FACTOR : 1)) : null; } // null = noch keine Zeit
// Fahrzeit ab der Unterkunft des aktiven Tages, nur für Spots im Umkreis (sonst null)
const hotelMin = p => { const b = baseFor(editDay()); if(!b || airKm(b, p) > NEAR_KM) return null; const m = travel(b, p); return m === null ? null : Math.max(5, Math.round(m/5)*5); };
async function osrm(a,b,mode="auto"){
  const host = mode === "fuss" ? "https://routing.openstreetmap.de/routed-foot" : "https://router.project-osrm.org";
  const js = await fetch(`${host}/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=polyline`).then(r => r.json());
  if(js.code !== "Ok") throw new Error(js.code);
  const r = js.routes[0]; return [Math.round(r.duration/6)/10, Math.round(r.distance/100)/10, r.geometry];
}
const rPending = new Set();
function ensureRoutes(pairs, mode="auto"){
  if(navigator.onLine === false || mode === "frei") return;
  const key = ([a,b]) => ckey(a, b, mode);
  // zu Fuß nur bis 25 km Luftlinie, darüber ist eine Gehzeit keine Planungsgrundlage
  const todo = pairs.filter(([a,b]) => rid(a) && rid(b) && rid(a)!==rid(b) && !routeFor(a,b,mode) && !rPending.has(key([a,b])) && (mode !== "fuss" || airKm(a,b) <= 25));
  if(!todo.length) return;
  todo.forEach(p => rPending.add(key(p)));
  (async () => {
    let got = 0;
    for(const [a,b] of todo){ const k = key([a,b]); try{ RCACHE[k] = await osrm(a,b,mode); got++; }catch(e){} rPending.delete(k); await new Promise(r => setTimeout(r, 300)); }
    if(got){ LS.set("thailand2027-routes", RCACHE); reorderEditDay(); onDataChanged({quiet:true}); }
  })();
}
// Neue Zeiten können eine bessere Reihenfolge ergeben. Die Reihenfolge ist berechnet, kein Nutzereintrag, daher kein neuer Zeitstempel.
function reorderEditDay(){ const pl = dayPlanFor(editDay()); if(!pl || modeOf(pl.plan) === "frei") return; const vor = pl.plan.stationen.map(x => x.placeId).join(); optimizeOrder(pl.plan); if(pl.plan.stationen.map(x => x.placeId).join() !== vor) persist(); }
const polyCache = {};
function decodePoly(str){
  if(polyCache[str]) return polyCache[str];
  let i = 0, lat = 0, lng = 0; const out = [];
  while(i < str.length){ for(const k of [0,1]){ let b, sh = 0, r = 0; do{ b = str.charCodeAt(i++) - 63; r |= (b & 31) << sh; sh += 5; }while(b >= 32); const d = r & 1 ? ~(r >> 1) : r >> 1; if(k) lng += d; else lat += d; } out.push([lat/1e5, lng/1e5]); }
  return polyCache[str] = out;
}
// Abstand des Punkts zur nächsten Straße (ein Punkt auf einer internen Zufahrt verfälscht Fahrzeiten)
async function roadGap(lat, lng){ const js = await fetch(`https://router.project-osrm.org/nearest/v1/driving/${lng},${lat}?number=1`).then(r => r.json()); if(js.code !== "Ok") throw new Error(js.code); return Math.round(js.waypoints[0].distance); }
const mapsLeg = (from, to, mode="auto") => `https://www.google.com/maps/dir/?api=1&origin=${from.lat},${from.lng}&destination=${encodeURIComponent(to.mapsQuery || `${to.lat},${to.lng}`)}&travelmode=${LMODES[mode].gm}`;
const mapsDir = p => `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.mapsQuery || `${p.lat},${p.lng}`)}`;
const mapsPlace = p => `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;

/* ===== 05-tagesplan.js ===== */
/* ---------- Tagesplan ----------
   Ihr wählt die Spots, die App bestimmt nur die Reihenfolge mit der kürzesten Zeit im Verkehrsmittel des Tages
   (Unterkunft → Spots → Unterkunft, ohne gewählte Unterkunft: erster bis letzter Stopp).
   Es werden nie Spots hinzugefügt, die ihr nicht selbst ausgewählt habt. Unverändert aus Version 1 übernommen. */
function defaultDay(){
  const d = today(), b = tripBounds();
  if(b && d < b.start) return b.start;
  return (!b || d < b.end) && nowParts().hh >= 17 ? addDays(d, 1) : d;
}
// Der aktive Tag: gilt für Spot-Suche, Fahrzeiten ab Unterkunft und die Route auf der Karte gleichermaßen (geräteeigen)
function editDay(){ const e = S.meta.editDay; return e && e >= today() ? e : defaultDay(); }
const dayPlanFor = date => { const pid = S.days[date]?.planId; return (pid && S.plans[pid]) || null; };
function dayStartMin(date){
  let m = 9*60 + 30;
  if(date === today()) m = Math.max(m, Math.ceil((nowParts().min + 20)/15)*15);
  return m;
}
const stationFor = p => ({placeId:p.id, name:p.name, art:"station", dauerMin:Math.max(30, Math.round((p.dauerMin||60)/15)*15), notiz:null});
function ensureDayPlan(date){
  let pid = S.days[date]?.planId, pl = pid && S.plans[pid];
  if(pl && pl.eigen) return pid;
  // ältere, automatisch erzeugte Pläne: nur die Spots übernehmen, Pausen und Einschübe fallen weg
  const stationen = pl ? pl.plan.stationen.filter(x => x.placeId && P(x.placeId)).map(x => stationFor(P(x.placeId))) : [];
  if(!pl){ // feste ID je Tag: legen beide Geräte denselben Tag an, ist es derselbe Plan
    pid = "plan-" + date;
    if(S.plans[pid]?.eigen){ touchDay(date, {planId:pid}); return pid; }
  }
  const now = Date.now();
  S.plans[pid] = {datum:date, erzeugtUm:now, at:now, status:"übernommen", eigen:true, plan:{titel:"", start:toHHMM(dayStartMin(date)), stationen, datum:date, log:Object.fromEntries(stationen.map(x => [x.placeId, {in:true, at:now}]))}};
  touchDay(date, {planId:pid});
  retitle(S.plans[pid].plan);
  return pid;
}
function retitle(plan){ const regions = [...new Set(plan.stationen.map(x => P(x.placeId)?.region).filter(Boolean))]; plan.titel = WDL[weekday(plan.datum)] + (regions.length ? " · " + regions.slice(0,2).join(" & ") : ""); }
const planOrigin = plan => dayStart(plan.datum), planEnd = plan => dayEnd(plan.datum);
function planLegs(plan){ const pts = [planOrigin(plan), ...plan.stationen.map(x => x.placeId && P(x.placeId)).filter(Boolean), planEnd(plan)].filter(Boolean); return pts.slice(1).map((b,i) => [pts[i], b]); }
// Zeit eines Abschnitts im Verkehrsmittel des Tages: berechnet (route), selbst eingetragen (eigen) oder unbekannt (min null)
function legTime(plan, a, b){
  const mode = modeOf(plan);
  if(mode === "frei"){ const e = rid(a) && rid(b) ? plan.leg?.[rkey(rid(a), rid(b))] : null; return {min: e && Number.isFinite(e.min) ? e.min : null, km:null, src: e ? "eigen" : null, mode}; }
  const min = travel(a, b, mode); return {min, km: routeFor(a, b, mode)?.[1] ?? null, src: min === null ? null : "route", mode};
}
// Kosten einer Reihenfolge. Fehlt eine Zeit, zählt die Luftlinie (Auto 1,5, zu Fuß 12, Boot/Bus/Bahn 2 Minuten je km), nur zum Sortieren.
const AIRMIN = {auto:1.5, fuss:12, frei:2};
const legCost = (plan, a, b) => legTime(plan, a, b).min ?? airKm(a,b)*AIRMIN[modeOf(plan)];
function planDrive(plan, order=plan.stationen){ let t = 0, prev = planOrigin(plan); for(const x of order){ const p = P(x.placeId); if(!p) continue; if(prev) t += legCost(plan, prev, p); prev = p; } const end = planEnd(plan); return t + (prev && end ? legCost(plan, prev, end) : 0); }
function setMode(date, mode){
  const pl = dayPlanFor(date); if(!pl || modeOf(pl.plan) === mode) return;
  pl.plan.modus = mode; pl.plan.modusAt = pl.at = Date.now();
  optimizeOrder(pl.plan); ensureRoutes(planLegs(pl.plan), mode); persist();
}
// eigene Zeit für einen Abschnitt (Boot, Bus, Bahn), in 5-Minuten-Schritten, erster Tipp setzt 15 Minuten
function setLeg(date, key, delta){
  const pl = dayPlanFor(date); if(!pl) return;
  const cur = pl.plan.leg?.[key]?.min;
  const min = Number.isFinite(cur) ? Math.min(12*60, Math.max(0, cur + delta)) : delta > 0 ? 15 : null;
  if(min === null) return;
  pl.plan.leg = {...(pl.plan.leg || {}), [key]:{min, at:Date.now()}}; pl.at = Date.now(); persist();
}
function optimizeOrder(plan){
  const st = plan.stationen.filter(x => x.placeId && P(x.placeId));
  let best = st, bc = planDrive(plan, st);
  if(st.length <= 8){ // alle Reihenfolgen durchprobieren
    const perm = (rest, pre) => { if(!rest.length){ const c = planDrive(plan, pre); if(c < bc - .01){ bc = c; best = pre; } return; } rest.forEach((x,i) => perm([...rest.slice(0,i), ...rest.slice(i+1)], [...pre, x])); };
    perm(st, []);
  } else { // viele Stopps: Abschnitte umdrehen, solange es kürzer wird (2-opt)
    let better = true;
    while(better){ better = false;
      for(let i = 0; i < best.length-1; i++) for(let j = i+1; j < best.length; j++){ const cand = [...best.slice(0,i), ...best.slice(i,j+1).reverse(), ...best.slice(j+1)]; const c = planDrive(plan, cand); if(c < bc - .01){ best = cand; bc = c; better = true; } } }
  }
  plan.stationen = best;
}
function addToPlan(id, date=editDay()){
  const p = P(id); if(!p) return false;
  const pl = S.plans[ensureDayPlan(date)];
  if(pl.plan.stationen.some(x => x.placeId===id)) return false;
  logStop(pl, id, true);
  pl.plan.stationen.push(stationFor(p));
  optimizeOrder(pl.plan); retitle(pl.plan); pl.at = Date.now();
  syncPlanStatus(pl);
  return true;
}
function removeFromPlan(date, idx){
  const pl = dayPlanFor(date); if(!pl) return;
  const gone = pl.plan.stationen[idx]; if(!gone) return;
  if(gone.placeId) logStop(pl, gone.placeId, false);
  pl.plan.stationen.splice(idx, 1);
  if(gone.placeId && P(gone.placeId)?.status==="geplant") setOver(gone.placeId, {status:"offen"});
  retitle(pl.plan); pl.at = Date.now(); persist();
}
function setStay(date, idx, delta){
  const pl = dayPlanFor(date); const x = pl?.plan.stationen[idx]; if(!x) return;

/* Abgleich auf Ebene der Stopps: plan.log hält je Spot, ob er zuletzt hinzugefügt (in:true) oder entfernt wurde, mit Zeitstempel.
   Ältere Pläne ohne log: alle Stopps gelten als zum Zeitpunkt pl.at hinzugefügt. */
const logOf = pl => pl.plan.log || Object.fromEntries(pl.plan.stationen.filter(x => x.placeId).map(x => [x.placeId, {in:true, at:pl.at || pl.erzeugtUm || 0}]));
function logStop(pl, id, inn){ pl.plan.log = {...logOf(pl), [id]:{in:inn, at:Date.now()}}; }
// Zwei Stände desselben Tages zusammenführen: pro Spot gilt die neuere Aktion, pro Stopp die neuere Aufenthaltsdauer.
// Die Reihenfolge wird neu optimiert (sie ist ohnehin nur berechnet), Eingabe sortiert, damit beide Geräte dasselbe Ergebnis bekommen.
function mergePlans(a, b){
  const la = logOf(a), lb = logOf(b), log = {};
  for(const id of [...new Set([...Object.keys(la), ...Object.keys(lb)])].sort()) log[id] = !la[id] || (lb[id] && lb[id].at > la[id].at) ? lb[id] : la[id];
  const st = {};
  [...a.plan.stationen, ...b.plan.stationen].forEach(x => { if(x.placeId && (!st[x.placeId] || (x.dAt || 0) > (st[x.placeId].dAt || 0))) st[x.placeId] = x; });
  const base = (b.at || 0) > (a.at || 0) ? b : a;
  const mb = (b.plan.modusAt || 0) > (a.plan.modusAt || 0) ? b.plan : a.plan;
  const leg = {}; for(const k of [...new Set([...Object.keys(a.plan.leg || {}), ...Object.keys(b.plan.leg || {})])].sort()){ const x = a.plan.leg?.[k], y = b.plan.leg?.[k]; leg[k] = !x || (y && y.at > x.at) ? y : x; }
  const out = {...base, at:Math.max(a.at || 0, b.at || 0), plan:{...base.plan, log, modus:mb.modus || "auto", modusAt:mb.modusAt || 0, leg,
    stationen:Object.keys(log).filter(id => log[id].in && st[id]).sort().map(id => st[id])}};
  optimizeOrder(out.plan); retitle(out.plan);

}
function syncPlanStatus(pl){ pl.plan.stationen.forEach(x => { if(x.placeId && P(x.placeId) && P(x.placeId).status!=="besucht") setOver(x.placeId, {status:"geplant"}); }); persist(); }
function timeline(plan){
  const rows = []; let t = toMin(plan.start), prev = planOrigin(plan);
  if(prev) rows.push({kind:"stop", time:t, name:"Ab " + prev.name, icon:"hotel"});
  plan.stationen.forEach((x,i) => {
    const place = x.placeId ? P(x.placeId) : null;
    if(!place) return;
    const lt = prev ? legTime(plan, prev, place) : null;
    if(lt && (lt.min === null || lt.min >= 1 || lt.src === "eigen")){ rows.push({kind:"drive", time:t, ...lt, from:prev, to:place}); t += lt.min ?? 0; }
    prev = place;
    rows.push({kind:"stop", time:t, name:place.name, place, dauer:x.dauerMin, index:i});
    t += x.dauerMin;
  });
  const fin = planEnd(plan);
  if(fin && prev && prev.id !== fin.id){ const lt = legTime(plan, prev, fin); rows.push({kind:"drive", time:t, ...lt, from:prev, to:fin}); t += lt.min ?? 0; rows.push({kind:"stop", time:t, name:(fin.id === planOrigin(plan)?.id ? "Zurück: " : "Ankunft: ") + fin.name, icon:"hotel", end:true}); }
  else rows.push({kind:"end", time:t});

}
/* Spot-Suche */
const SEARCH_LIMIT = 8;
function searchSpots(q){
  const n = norm(q.trim()); if(!n) return [];
  const words = n.split(/\s+/);
  return Object.values(places()).filter(p => p.status!=="abgelehnt").map(p => {
    const name = norm(p.name), hay = name + " " + norm(p.region) + " " + norm(GROUPS[GOF[p.typ]||"kultur"][0]);
    if(!words.every(w => hay.includes(w))) return null;
    const rank = name.startsWith(n) ? 0 : name.split(/[\s(']+/).some(w => w.startsWith(words[0])) ? 1 : name.includes(words[0]) ? 2 : 3;
    return {p, rank};
  }).filter(Boolean).sort((a,b) => a.rank-b.rank || a.p.name.localeCompare(b.p.name, "de")).slice(0, SEARCH_LIMIT).map(x => x.p);
}
function markHit(name, q){ const n = norm(name), w = norm(q.trim()).split(/\s+/)[0]; const i = w ? n.indexOf(w) : -1; return i < 0 ? esc(name) : esc(name.slice(0,i)) + "<mark>" + esc(name.slice(i, i+w.length)) + "</mark>" + esc(name.slice(i+w.length)); }

/* ===== 06-abgleich.js ===== */
/* ---------- Abgleich zwischen zwei Handys ----------
   Der Stand geht als Code (gzip, base64url) oder Link (#sync=) ans andere Gerät und wird dort zusammengeführt, nie überschrieben:
   - Datensätze (Spots, Aufenthalte, Unterkunfts- und Transportoptionen, Verbindungen) feldweise nach Zeitstempel,
     Löschungen bleiben als weg:true stehen und werden von älteren Ständen nicht zurückgeholt.
   - Tagespläne stoppweise (mergePlans), Bewertungen nach Zeitstempel, Besucht-Listen vereinigt und auf den Status gekürzt.
   - Geräteeigene Ansicht (editDay) wird nicht übertragen.
   Danach läuft die Übernahme alter Daten (Codes aus Version 1 enthalten noch etappen und unterkuenfte). */
const SYNC_KEY = "thailand2027";
const LOCAL_META = ["editDay"];
const sharedMeta = () => Object.fromEntries(Object.entries(S.meta).filter(([k]) => !LOCAL_META.includes(k)));
function snapshot(){ return {app:SYNC_KEY, v:2, t:Date.now(), ...Object.fromEntries(COLLECTIONS.filter(c => c !== "meta").map(c => [c, S[c]])), meta:sharedMeta()}; }
// Vergleich unabhängig von der Reihenfolge der Felder, sonst zählt ein bloß umsortierter Eintrag als Änderung
const canon = x => JSON.stringify(x, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(f => [f, v[f]])) : v);
function mergeState(js){
  let n = 0;
  const neuer = (a, b) => !a ? !!b : (b?.at || b?.erzeugtUm || 0) > (a?.at || a?.erzeugtUm || 0);
  for(const col of RECORDS) for(const [k, v] of Object.entries(js[col] || {})){ const m = mergeRec(S[col][k], v); if(canon(m) !== canon(S[col][k])) n++; S[col][k] = m; }
  for(const col of ["unterkuenfte", "etappen"]) for(const [k, v] of Object.entries(js[col] || {})) if(neuer(S[col][k], v)) S[col][k] = v;
  for(const [k, v] of Object.entries(js.ratings || {})) if(neuer(S.ratings[k], v)){ if((S.ratings[k]?.emoji || null) !== (v.emoji || null)) n++; S.ratings[k] = v; }
  _placesCache = null; // ab hier Spots und Status aus dem eben zusammengeführten over lesen
  for(const [k, v] of Object.entries(js.plans || {})){
    const a = S.plans[k];
    const m = !a ? v : v.eigen && a.eigen ? mergePlans(a, v) : neuer(a, v) ? v : a;
    if(canon(a) !== canon(m)) n++;
    S.plans[k] = m;
  }
  const visited = id => P(id)?.status === "besucht";
  for(const [k, v] of Object.entries(js.days || {})){
    const a = S.days[k] || {};
    const d = neuer(a, v) ? {...a, ...v} : {...v, ...a};
    // beide Geräte haben für den Tag einen eigenen Plan angelegt: zusammenführen, die kleinere ID gilt auf beiden Seiten
    if(a.planId && v.planId && a.planId !== v.planId && S.plans[a.planId]?.eigen && S.plans[v.planId]?.eigen){
      const [keep, drop] = [a.planId, v.planId].sort();
      S.plans[keep] = mergePlans(S.plans[keep], S.plans[drop]);
      d.planId = keep;
    }
    d.besucht = [...new Set([...(a.besucht || []), ...(v.besucht || [])])].filter(visited);
    d.at = Math.max(a.at || 0, v.at || 0);
    if(canon(d) !== canon(a)) n++;
    S.days[k] = d;
  }
  for(const [k, a] of Object.entries(S.days)) if(a.besucht?.some(id => !visited(id))) S.days[k] = {...a, besucht:a.besucht.filter(visited)};
  if((js.meta?.at || 0) > (S.meta.at || 0) && canon(js.meta) !== canon(sharedMeta())) n++;
  if((js.meta?.at || 0) > (S.meta.at || 0)) S.meta = {...S.meta, ...js.meta, ...Object.fromEntries(LOCAL_META.map(k => [k, S.meta[k]]))};
  n += migrateLegacy();

}
const b64 = buf => { let out = ""; for(const c of new Uint8Array(buf)) out += String.fromCharCode(c); return btoa(out).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const unb64 = str => { const bin = atob(str.replace(/-/g, "+").replace(/_/g, "/")); const u = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; };
async function packState(){
  const js = JSON.stringify(snapshot());
  if(window.CompressionStream){
    try{ return "z" + b64(await new Response(new Blob([js]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer()); }catch(e){}
  }
  return "p" + b64(new TextEncoder().encode(js));
}
async function unpackState(code){
  const art = code[0], daten = unb64(code.slice(1));
  if(art === "z") return JSON.parse(await new Response(new Blob([daten]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  return JSON.parse(new TextDecoder().decode(daten));
}
// Code prüfen und übernehmen. Ergebnis: {ok, n} oder {ok:false, grund}
async function importCode(code){
  let js;
  try{ js = await unpackState(String(code).trim().replace(/^.*#sync=/, "").replace(/\s+/g, "")); }
  catch(e){ return {ok:false, grund:"Der Code ist unvollständig oder beschädigt."}; }
  if(js?.app !== SYNC_KEY) return {ok:false, grund:"Der Code gehört nicht zu diesem Reiseplaner."};
  const n = mergeState(js); persist();
  return {ok:true, n};
}

/* ===== 10-ui.js ===== */
/* ---------- Oberfläche: Navigation und Bausteine ----------
   Vier Bereiche in der Tab-Leiste, jeder mit eigenem Verlauf (Stapel). Detailseiten schieben sich darüber, Zurück oben links.
   Ansichten sind Funktionen in VIEWS: name(params) → {title, html, mount, large, form, map, right}.
   Klicks laufen über data-Attribute: data-go="ansicht" data-p='{"id":…}' öffnet eine Seite, data-back geht zurück. */
const VIEWS = {};
const TABS = [["reise","Reise","reise"],["tage","Tage","kalender"],["karte","Karte","karte"],["mehr","Mehr","mehr"]];
const UI = {tab:"reise", stacks:{reise:[], tage:[], karte:[], mehr:[]}, scroll:{}};
const screenEl = () => $("#screen");
const stackOf = () => UI.stacks[UI.tab];
const current = () => stackOf()[stackOf().length - 1] || {view:UI.tab, params:{}};
const scrollKey = () => UI.tab + ":" + stackOf().length;
function go(view, params = {}){ UI.scroll[scrollKey()] = screenEl().scrollTop; stackOf().push({view, params}); render({top:true}); }
function back(){ if(!stackOf().length) return; stackOf().pop(); render({restore:true}); }
function replaceView(view, params = {}){ stackOf().pop(); stackOf().push({view, params}); render({top:true}); }
function switchTab(t){
  if(UI.tab === t){ if(stackOf().length){ UI.stacks[t] = []; render({top:true}); } else screenEl().scrollTo({top:0, behavior:"smooth"}); return; }
  UI.scroll[scrollKey()] = screenEl().scrollTop; UI.tab = t; render({restore:true});
}
function openInTab(t, view, params){ UI.scroll[scrollKey()] = screenEl().scrollTop; UI.tab = t; UI.stacks[t] = view ? [{view, params:params || {}}] : []; render({top:true}); }
let _formDirty = false;
function render(opt = {}){
  const cur = current(), V = (VIEWS[cur.view] || VIEWS.reise)(cur.params || {});
  const hasBack = stackOf().length > 0, scr = screenEl();
  document.body.classList.toggle("formmode", !!V.form);
  scr.classList.toggle("formmode", !!V.form);
  $("#tabbar").classList.toggle("versteckt", !!V.form);
  _formDirty = false;
  if(V.map){ scr.hidden = true; $("#mapWrap").hidden = false; scr.innerHTML = ""; V.mount?.(null, cur.params || {}); }
  else {
    $("#mapWrap").hidden = true; scr.hidden = false;
    // V.hero ersetzt Navigationsleiste und große Überschrift (nur auf Startseiten ohne Zurück)
    const hero = V.hero && !hasBack;
    const nav = hero ? "" : hasBack || V.right || V.left ? `<header class="nav"><div>${hasBack ? `<button class="navbtn" data-back aria-label="Zurück">${ic("zurueck")}${esc(V.backLabel || "Zurück")}</button>` : V.left || ""}</div><div class="navtitle">${V.large ? "" : esc(V.title)}</div><div class="right">${V.right || ""}</div></header>` : `<div style="height:calc(var(--safe-t) + 12px)"></div>`;
    const head = hero ? V.hero : V.large ? `<div class="head"><h1>${esc(V.title)}</h1>${V.sub ? `<div class="sub">${V.sub}</div>` : ""}</div>` : "";
    // V.bar: feste Leiste unten. In Formularen ganz unten, auf Detailseiten über der Tab-Leiste: die Hauptaktion sitzt immer an derselben Stelle
    scr.innerHTML = `<div class="page${V.bar ? " hasbar" : ""}">${nav}${head}<div class="content">${V.html}</div></div>${V.bar ? `<div class="formbar${V.form ? "" : " overtab"}">${V.bar}</div>` : ""}${V.fab || ""}`;
    V.mount?.(scr, cur.params || {});
    if(V.form) scr.querySelectorAll("input,select,textarea").forEach(x => x.addEventListener("input", () => _formDirty = true));
    if(opt.restore) scr.scrollTop = UI.scroll[scrollKey()] || 0; else if(opt.top) scr.scrollTop = 0;
    const nv = scr.querySelector(".nav"); if(nv) nv.classList.toggle("scrolled", scr.scrollTop > 4);

function armDelete(btn, label, onDelete){
  btn.onclick = () => { if(!btn.dataset.sure){ btn.dataset.sure = "1"; btn.innerHTML = ic("muell") + esc(label); setTimeout(() => { if(btn.isConnected){ delete btn.dataset.sure; btn.innerHTML = ic("muell") + "Löschen"; } }, 4000); return; } onDelete(); };
}

/* ===== 11-reise-ui.js ===== */
/* ---------- Bereich Reise: Übersicht, Prüfung, Aufenthalte, Unterkünfte, Verbindungen ---------- */

// Formulare halten ihren Entwurf in den Parametern der Seite, damit er einen Abstecher (Ort auf der Karte wählen) übersteht
function keepDraft(root){ const p = current().params; p.draft = {...(p.draft || {}), ...readForm(root)}; return p.draft; }

// Entscheidungszustand als Zeile: gewählt (jade), Konflikt (rot), offen oder leer (bernstein). Konflikt nennt nie eine der Optionen als gewählt.
const ZUST_FARBE = {gewaehlt:"var(--accent)", konflikt:"var(--konflikt)", offen:"var(--offen)", leer:"var(--offen)"};
function lodgeLine(s){
  const ch = stayChoice(s.id), n = nights(s);
  if(ch.zustand === "gewaehlt"){ const pr = lodgingPrice(ch.item, n); return {t:esc(ch.item.name), s:[STATUS[ch.item.status], pr.nacht !== null ? money(pr.nacht, ch.item.waehrung) + " pro Nacht" : "ohne Preis", Number.isFinite(ch.item.lat) ? null : "Kartenpunkt fehlt"].filter(Boolean).join(" · "), z:ch.zustand}; }
  if(ch.zustand === "konflikt") return {t:`${ch.alle.length} Unterkünfte gleichzeitig gewählt`, s:"Ungeklärt, bitte eine behalten", z:ch.zustand};
  return {t:ch.aktiv ? `${plural(ch.aktiv, "Option", "Optionen")}, noch keine gewählt` : "Noch keine Unterkunft erfasst", s:ch.aktiv ? "Vergleichen und auswählen" : "Kandidaten sammeln", z:ch.zustand};
}
function connLine(c){
  const ch = connChoice(c.id), o = ch.item;
  if(o) return {icon:TRANSPORT[o.art]?.[1] || "reise", s:[TRANSPORT[o.art]?.[0], optWhen(o), STATUS[o.status]].filter(Boolean).join(" · "), z:ch.zustand};
  if(ch.zustand === "konflikt") return {icon:"warn", s:`${ch.alle.length} Optionen gleichzeitig gewählt, ungeklärt`, z:ch.zustand};
  // noch nichts gewählt: haben alle erfassten Optionen dasselbe Verkehrsmittel, steht dessen Symbol da, sonst das allgemeine
  const arten = new Set(optsOf(c.id).filter(x => !RAUS.has(x.status)).map(x => x.art));
  return {icon:arten.size === 1 ? TRANSPORT[[...arten][0]]?.[1] || "reise" : "reise", s:ch.aktiv ? `${plural(ch.aktiv, "Option", "Optionen")}, noch keine gewählt` : "Noch keine Option erfasst", z:ch.zustand};
}
const dateBox = iso => iso ? `<span class="date"><b>${+iso.slice(8,10)}</b><span>${MON[+iso.slice(5,7)-1].replace(".","")}</span></span>` : `<span class="date"><b>?</b><span>Datum</span></span>`;
function stayCard(s){
  const n = nights(s), l = lodgeLine(s);
  return `<div class="tlstay"><button class="top" ${attrGo("stay", {id:s.id})}>${dateBox(s.von)}<span class="info"><h3>${esc(stayName(s))}</h3><div class="meta">${esc(fmtRange(s.von, s.bis))}${n !== null && n > 0 ? " · " + plural(n, "Nacht", "Nächte") : ""}</div></span>${pill(s.status)}</button>
    <button class="lodge z-${l.z}" ${attrGo("stay", {id:s.id})}><span class="lead" style="color:${ZUST_FARBE[l.z]}">${ic(l.z === "konflikt" ? "warn" : "hotel")}</span><span class="t">${l.t}<small>${esc(l.s)}</small></span>${ic("weiter", "chev")}</button></div>`;
}
const linkCard = (inner, attrs, cls = "") => `<div class="tllink"><span class="rail"></span><button class="card ${cls}" ${attrs}>${inner}</button></div>`;
function connCard(c){ const l = connLine(c); return linkCard(`${ic(l.icon)}<span class="t">${esc(connTitle(c))}<small>${esc(l.s)}</small></span>${ic("weiter", "chev")}`, attrGo("conn", {id:c.id}), l.z === "gewaehlt" ? (connOpt(c.id)?.status === "gebucht" ? "gebucht" : "") : l.z === "konflikt" ? "konflikt" : "offen"); } // Lücken haben eigenes Aussehen (warn)
const isZeitraumIssue = i => i.ziel?.[0] === "zeitraum";
// Kartenpunkt einer Unterkunft: gesetzt (jade) oder fehlt. Bernstein nur, wenn die Prüfung es meldet (eindeutig gewählte Unterkunft),
// sonst neutral: bei einem bloßen Kandidaten ist ein fehlender Punkt noch kein Problem.
const pinState = (l, relevant) => Number.isFinite(l.lat) ? `<span class="pt ok">${ic("pin")}Kartenpunkt gesetzt</span>` : `<span class="pt${relevant ? " fehlt" : ""}">${ic("pin")}Kartenpunkt fehlt</span>`;
const pinBtn = l => `<button class="pinbtn${Number.isFinite(l.lat) ? "" : " leer"}" data-pin="${l.id}" aria-label="${pinLabel(l)}: ${esc(l.name)}">${ic("pin")}</button>`;
const bindPins = el => el.querySelectorAll("[data-pin]").forEach(b => b.onclick = e => { e.stopPropagation(); go("ortWahl", {lodgingId:b.dataset.pin}); });
// Eine Hinzufügen-Aktion für den ganzen Bereich. Ein neuer Aufenthalt beginnt an der ersten Lücke. Fehlende Verbindungen aus dem
// Ablauf stehen direkt zur Wahl, dann sind Start und Ziel schon gesetzt. „Andere Verbindung“ bleibt ohne Vorbelegung.
function addToTrip(){
  const items = overview().items, lk = items.find(x => x.art === "luecke"), last = datedStays().filter(s => s.bis > s.von).pop();
  const fehlend = items.filter(x => x.art === "connFehlt");
  pickSheet({title:"Hinzufügen", items:[
    {label:"Aufenthalt", sub:lk ? `Ort mit An- und Abreise, Anreise vorbelegt mit ${fmtDate(lk.von)}` : "Ort mit An- und Abreise, danach Unterkünfte sammeln", icon:"hotel", value:"stay"},
    ...fehlend.slice(0, 4).map((x, i) => ({label:gapTitle(x), sub:"Verbindung fehlt im Ablauf", icon:"reise", value:"gap" + i})),
    {label:fehlend.length ? "Andere Verbindung" : "Verbindung", sub:"Flug, Zug, Bus oder Fähre, Start und Ziel wählt ihr selbst", icon:"reise", value:"conn"},
  ]}).then(v => v === "stay" ? go("neuStay", lk ? {von:lk.von, luecke:lk.bis} : last ? {von:last.bis} : {}) : v === "conn" ? go("neuConn", {}) : v?.startsWith("gap") ? fillGap(fehlend[+v.slice(3)]) : null);
}
const gapTitle = x => x.von && x.nach ? `${stayName(x.von)} → ${stayName(x.nach)}` : x.nach ? `Anreise nach ${stayName(x.nach)}` : `Abreise ab ${stayName(x.von)}`;
// Platzhalter „Verbindung fehlt“: eine vorhandene zuordnen (z. B. einen schon erfassten Flug) oder eine neue anlegen.
// Die neue Verbindung bekommt genau die Aufenthalte des Platzhalters, nichts darüber hinaus.
function fillGap(x){
  const neu = () => go("neuConn", {vonStay:x.von?.id || null, nachStay:x.nach?.id || null});
  const cands = connCandidates(x); if(!cands.length) return neu();
  pickSheet({title:gapTitle(x),
    text:"Eine schon erfasste Verbindung zuordnen oder eine neue anlegen.",
    items:[...cands.map(c => ({label:connTitle(c), sub:connLine(c).s, icon:connLine(c).icon, value:c.id})), {label:"Neue Verbindung anlegen", icon:"plus", value:"neu"}]})
    .then(v => { if(!v) return; if(v === "neu") return neu(); linkConn(v, x); commit("Verbindung zugeordnet"); });
}

// Kopfbild: eigene, ruhige Küstenillustration (Inline-SVG, offline, kein Foto, zeigt keinen bestimmten Ort).
// Farben kommen aus CSS-Variablen der .trip-hero, damit Hell- und Dunkelmodus stimmen.

  <defs><linearGradient id="hSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--h-sky1)"/><stop offset="1" style="stop-color:var(--h-sky2)"/></linearGradient>
  <linearGradient id="hSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--h-sea1)"/><stop offset="1" style="stop-color:var(--h-sea2)"/></linearGradient>
  <linearGradient id="hFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--bg);stop-opacity:0"/><stop offset="1" style="stop-color:var(--bg);stop-opacity:1"/></linearGradient></defs>
  <rect width="400" height="220" fill="url(#hSky)"/>
  <circle cx="268" cy="96" r="38" style="fill:var(--h-sun)" opacity=".28"/><circle cx="268" cy="96" r="23" style="fill:var(--h-sun)" opacity=".6"/>
  <path d="M206 150c4-22 9-31 15-28 3-17 13-21 17-8 4-6 11-3 12 10 3 9 6 18 12 26z" style="fill:var(--h-isle2)"/>
  <path d="M268 152c3-30 10-44 18-40 4-24 18-30 24-12 6-9 15-5 17 14 4 13 9 26 17 38z" style="fill:var(--h-isle)"/>
  <path d="M0 150c40-6 86-8 140-4 60 4 120 6 180 1 30-2 58-2 80 0v73H0z" fill="url(#hSea)"/>
  <path d="M28 168c18-3 34-3 52 0M150 176c22-3 40-3 60 0M262 166c16-2 30-2 44 0M90 190c20-3 38-3 58 0M300 186c18-2 34-2 50 0" style="stroke:var(--h-wave)" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".8"/>
  <rect y="170" width="400" height="50" fill="url(#hFade)"/></svg>`;
function tripHero(sub){
  return `<div class="trip-hero">${HERO_SCENE}<button class="hadd" data-act="add" aria-label="Aufenthalt oder Verbindung hinzufügen">${ic("plus")}</button>
    <div class="ht"><h1>Thailand 2027</h1><div class="sub">${sub}</div></div></div>`;
}
// Planung im Überblick: vier Bereiche, Zahlen nur aus euren Daten. Markierung nur bei Konflikt, Fehlendem oder Offenem.
function planOverview(ov){
  const ds = datedStays().filter(s => s.bis > s.von), alleStays = stays(), cs = conns(), b = tripBounds();
  const flag = (lvl, txt) => `<span class="flag ${lvl}">${ic(lvl === "konflikt" ? "warn" : lvl === "ok" ? "haken" : lvl === "offen" ? "uhr" : "info")}${esc(txt)}</span>`;
  const lueckeN = ov.items.filter(x => x.art === "luecke").reduce((a, x) => a + x.n, 0), naechte = b ? dayDiff(b.end, b.start) : 0;
  const lz = ds.map(s => stayChoice(s.id).zustand), cz = cs.map(c => connChoice(c.id).zustand), fehlendeConns = ov.items.filter(x => x.art === "connFehlt").length;
  const n = (arr, z) => arr.filter(x => x === z).length;
  const tage = tripDays(), mitSpots = typeof planCount === "function" ? tage.filter(d => planCount(d)).length : 0;
  const rows = [
    {icon:"pin", t:"Aufenthalte", s:alleStays.length ? `<b>${alleStays.length}</b> ${alleStays.length === 1 ? "Ort" : "Orte"}${b ? ` · ${naechte - lueckeN} von ${plural(naechte, "Nacht", "Nächten")} geplant` : ""}` : "Noch keine angelegt",
      end:lueckeN ? flag("fehlt", plural(lueckeN, "Nacht", "Nächte") + " frei") : alleStays.length && b ? flag("ok", "lückenlos") : "", go:"liste", p:{art:"stays"}},
    {icon:"hotel", t:"Unterkünfte", s:ds.length ? `<b>${n(lz, "gewaehlt")}</b> von ${ds.length} gewählt` : "Erst Aufenthalte anlegen",
      end:n(lz, "konflikt") ? flag("konflikt", plural(n(lz, "konflikt"), "Konflikt", "Konflikte")) : n(lz, "offen") + n(lz, "leer") ? flag("offen", `${n(lz, "offen") + n(lz, "leer")} offen`) : ds.length ? flag("ok", "entschieden") : "", go:"liste", p:{art:"lodgings"}},
    {icon:"reise", t:"Verbindungen", s:cs.length || fehlendeConns ? `<b>${n(cz, "gewaehlt")}</b> von ${cs.length} gewählt${fehlendeConns ? ` · ${fehlendeConns} fehlen` : ""}` : "Noch keine angelegt",
      end:n(cz, "konflikt") ? flag("konflikt", plural(n(cz, "konflikt"), "Konflikt", "Konflikte")) : fehlendeConns ? flag("fehlt", `${fehlendeConns} fehlen`) : n(cz, "offen") + n(cz, "leer") ? flag("offen", `${n(cz, "offen") + n(cz, "leer")} offen`) : cs.length ? flag("ok", "entschieden") : "", go:"liste", p:{art:"conns"}},
    {icon:"kalender", t:"Tagespläne", s:b ? `<b>${mitSpots}</b> von ${plural(tage.length, "Tag", "Tagen")} mit Spots` : mitSpots ? `<b>${mitSpots}</b> Tage mit Spots` : "Noch keine Spots eingeplant", end:"", act:"tage"},
  ];
  return sect("Planung im Überblick", `<div class="group ovw">${rows.map(r => row({...r, end:r.end})).join("")}</div>`);
}

VIEWS.reise = () => {
  const r = tripRange(), b = tripBounds(), all = stays(), cs = conns(), iss = planIssues().filter(i => !isZeitraumIssue(i));
  // Der Zeitraum steht genau einmal da: festgelegt als tippbare Zeile im Kopf, sonst als Karte mit einer Hauptaktion
  const sub = r ? `<button class="subbtn" ${attrGo("zeitraum")}>${esc(fmtRange(r.start, r.end))} · ${plural(dayDiff(r.end, r.start), "Nacht", "Nächte")}${ic("weiter")}</button>`
    : `<span>Unsere Reise${all.length ? ` · ${plural(all.length, "Ort", "Orte")}` : ""}</span>`;
  const setup = r ? "" : `<div class="setup"><div class="setup-t">${ic("zeitraum")}<span><b>Reisezeitraum festlegen</b><small>${b ? `Eure Planung reicht bisher vom ${esc(fmtDateLong(b.start))} bis ${esc(fmtDateLong(b.end))}. Legt ihn fest, dann prüft die App jede Nacht darin.` : "Erster und letzter Reisetag. Danach prüft die App jede Nacht darin. Kann offen bleiben, bis er feststeht."}</small></span></div><button class="btn primary block" ${attrGo("zeitraum")}>Zeitraum festlegen${ic("weiter")}</button></div>`;
  const mountAdd = el => el.querySelector('[data-act="add"]')?.addEventListener("click", addToTrip);
  if(!all.length && !cs.length) return {title:"Reise", hero:tripHero(sub),
    html:`${empty("reise", "Plant eure Reise", "Aufenthaltsorte anlegen, je Ort Unterkünfte sammeln und eine wählen, dann die Verbindungen dazwischen. Die App wählt nichts selbst aus.",
      `<div class="btns" style="width:100%"><button class="btn primary" ${attrGo("neuStay", {})}>${ic("plus")}Ersten Aufenthalt anlegen</button><button class="btn" ${attrGo("neuConn", {})}>${ic("flug")}Flug oder Verbindung</button></div>`)}
      ${setup}
      ${sect("Schon vorhanden", group([row({icon:"karte", t:"Spots auf der Karte", s:"Eure Sammlung, unabhängig von der Reiseplanung", act:"zurKarte"})]))}`,
    mount(el){ mountAdd(el); el.querySelector('[data-act="zurKarte"]').onclick = () => switchTab("karte"); }};
  const ov = overview(), cnt = lvl => iss.filter(i => i.lvl === lvl).length;
  const tally = ["konflikt","fehlt","offen"].filter(cnt).map(l => `<span class="tal ${l}">${cnt(l)} ${l === "konflikt" ? (cnt(l) === 1 ? "Konflikt" : "Konflikte") : l}</span>`).join("");
  // Oben steht nur der nächste Schritt (alle Konflikte, sonst der früheste Punkt), der Rest ist im Ablauf und in „Prüfung“
  const naechste = cnt("konflikt") ? iss.filter(i => i.lvl === "konflikt").slice(0, 3) : iss.slice(0, 1);
  const status = iss.length ? sect(naechste.length > 1 ? "Zuerst klären" : "Nächster Schritt", `<div class="group">${issueRows(naechste)}${iss.length > naechste.length ? `<button class="lvl more" ${attrGo("pruefung")}><span class="tx">Alle ${plural(iss.length, "offenen Punkt", "offenen Punkte")}</span><span class="tally">${tally}</span>${ic("weiter", "chev")}</button>` : ""}</div>`)
    : r ? `<div class="allok">${ic("haken")}<span>Alles geprüft: keine Konflikte, keine Lücken, alles entschieden.</span></div>` : "";
  const tl = ov.items.map((x, i) => x.art === "stay" ? stayCard(x.s) : x.art === "conn" ? connCard(x.c)
    : x.art === "luecke" ? linkCard(`${ic("warn")}<span class="t">${plural(x.n, "Nacht", "Nächte")} ohne Aufenthalt<small>${esc(fmtRange(x.von, x.bis))} · Aufenthalt anlegen</small></span>${ic("plus")}`, attrGo("neuStay", {von:x.von, luecke:x.bis}), "warn")
    : linkCard(`${ic("plus")}<span class="t">${x.richtung === "anreise" ? "Anreise nach " + esc(stayName(x.nach)) : x.richtung === "abreise" ? "Abreise ab " + esc(stayName(x.von)) : esc(stayName(x.von)) + " → " + esc(stayName(x.nach))}<small>Verbindung fehlt · zuordnen oder anlegen</small></span>`, `data-gap="${i}"`, "dashed")).join("");
  return {title:"Reise", hero:tripHero(sub),
    html:`${setup}${status}${planOverview(ov)}
      ${sect("Reiseverlauf", ov.items.length ? `<div class="tl">${tl}</div>` : `<p class="hint">Noch nichts mit Datum. Tippt oben auf +.</p>`)}
      ${ov.ohneDatum.length ? sect("Ohne gültiges Datum", ov.ohneDatum.map(stayCard).join("")) : ""}
      ${ov.rest.length ? sect("Noch ohne Datum", `<p class="hint">Verbindungen ohne gewählte Option und ohne verknüpften Aufenthalt.</p>` + group(ov.rest.map(c => { const l = connLine(c); return row({icon:l.icon, t:esc(connTitle(c)), s:esc(l.s), go:"conn", p:{id:c.id}}); }))) : ""}`,
    mount(el){
      mountAdd(el);
      el.querySelector('[data-act="tage"]')?.addEventListener("click", () => switchTab("tage"));
      el.querySelectorAll("[data-gap]").forEach(b => b.onclick = () => fillGap(ov.items[+b.dataset.gap]));
    }};
};

// Bereichslisten aus dem Überblick: Aufenthalte, Unterkünfte (je Aufenthalt die Entscheidung), Verbindungen samt fehlenden
VIEWS.liste = ({art}) => {
  const ov = overview(), alle = [...ov.items.filter(x => x.art === "stay").map(x => x.s), ...ov.ohneDatum];
  const nRow = s => { const n = nights(s); return `${esc(fmtRange(s.von, s.bis))}${n !== null && n > 0 ? " · " + plural(n, "Nacht", "Nächte") : ""}`; };
  if(art === "stays") return {title:"Aufenthalte", large:true, sub:plural(alle.length, "Ort", "Orte") + " · chronologisch",
    html:group([...alle.map(s => row({icon:"pin", t:esc(stayName(s)), s:nRow(s), end:pill(s.status), go:"stay", p:{id:s.id}})), row({icon:"plus", t:"Aufenthalt hinzufügen", go:"neuStay", p:{}, cls:"addrow", chev:false})])
      + (ov.items.some(x => x.art === "luecke") ? `<p class="hint">Nächte ohne Aufenthalt stehen im Reiseverlauf und lassen sich dort direkt füllen.</p>` : "")};
  if(art === "lodgings") return {title:"Unterkünfte", large:true, sub:"Je Aufenthalt eure Entscheidung",
    html:alle.length ? group(alle.map(s => { const l = lodgeLine(s); return row({icon:l.z === "konflikt" ? "warn" : "hotel", c:l.z === "gewaehlt" ? "--accent" : l.z === "konflikt" ? "--konflikt" : null, t:esc(stayName(s)), s:l.t + " · " + esc(l.s), go:"stay", p:{id:s.id}}); }))
      : empty("hotel", "Noch keine Aufenthalte", "Unterkünfte gehören immer zu einem Aufenthalt. Legt zuerst einen Ort mit An- und Abreise an.", `<button class="btn primary" ${attrGo("neuStay", {})}>${ic("plus")}Aufenthalt anlegen</button>`)};
  const items = ov.items.filter(x => x.art === "conn" || x.art === "connFehlt");
  return {title:"Verbindungen", large:true, sub:"In der Reihenfolge der Reise",
    html:(items.length || ov.rest.length ? group([...items.map((x, i) => x.art === "conn" ? (l => row({icon:l.icon, c:l.z === "gewaehlt" ? "--accent" : l.z === "konflikt" ? "--konflikt" : null, t:esc(connTitle(x.c)), s:esc(l.s), go:"conn", p:{id:x.c.id}}))(connLine(x.c))
        : row({icon:"plus", t:esc(gapTitle(x)), s:"Verbindung fehlt · zuordnen oder anlegen", act:"gap", id:String(i), cls:"addrow", chev:false})),
        ...ov.rest.map(c => (l => row({icon:l.icon, t:esc(connTitle(c)), s:esc(l.s) + " · ohne Datum", go:"conn", p:{id:c.id}}))(connLine(c)))]) : empty("reise", "Noch keine Verbindungen", "Flüge, Fähren, Busse oder Züge zwischen euren Aufenthalten.", ""))
      + `<button class="btn ghost" ${attrGo("neuConn", {})}>${ic("plus")}Andere Verbindung anlegen</button>`,
    mount(el){ el.querySelectorAll('[data-act="gap"]').forEach(b => b.onclick = () => fillGap(items[+b.dataset.id])); }};
};

VIEWS.pruefung = () => {
  const iss = planIssues(), by = l => iss.filter(i => i.lvl === l);
  const block = (l, title, text) => by(l).length ? sect(title, `<p class="hint">${text}</p><div class="group">${issueRows(by(l))}</div>`) : "";
  return {title:"Prüfung", large:true, sub:iss.length ? plural(iss.length, "Punkt", "Punkte") : "Nichts offen",
    html:iss.length ? block("konflikt", "Konflikte", "Echte Widersprüche, die ihr auflösen müsst. Bis dahin verwendet die App keine der beteiligten Angaben.") + block("fehlt", "Fehlt", "Hier fehlt ein Eintrag. Die App schätzt nichts.") + block("offen", "Offene Entscheidungen", "Noch nicht entschieden. Die App wählt nichts selbst aus.")
      : empty("haken", "Alles geprüft", "Keine Konflikte, keine Lücken, alle Entscheidungen getroffen.")};
};

VIEWS.zeitraum = p => {
  const b = tripBounds(), vorschlag = !S.meta.reise && b ? {start:b.start, end:b.end} : null;
  const r = p.draft || S.meta.reise || vorschlag || {};
  return {title:"Reisezeitraum", form:true,
    html:`<div class="form">${vorschlag && !p.draft ? `<p class="note">Vorschlag aus eurer Planung (gewählte Verbindungen und Aufenthalte). Prüft die Tage, gespeichert wird erst mit „Festlegen“.</p>` : ""}
      <div class="fgroup">${fRow(fText("start", "Erster Tag", r.start, {type:"date"}), fText("end", "Letzter Tag", r.end, {type:"date"}))}</div>
      <p class="fhint" id="zN"></p>

    bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="save">${l ? "Speichern" : "Hinzufügen"}</button>`,
    mount(el){
      bindChips(el);
      const showGap = (lat, lng) => { if(navigator.onLine === false) return; roadGap(lat, lng).then(m => { const g = el.querySelector("#gap"); if(!g?.isConnected) return; g.textContent = m > 150 ? `Achtung: ${m} m bis zur nächsten Straße. Liegt der Punkt an der Einfahrt?` : `Nächste Straße ${m} m entfernt.`; g.classList.toggle("warn", m > 150); }).catch(() => {}); };
      if(Number.isFinite(d.lat)) showGap(d.lat, d.lng);
      el.querySelector('[data-f="coords"]').addEventListener("change", e => { const c = parseCoords(e.target.value); if(c) showGap(c.lat, c.lng); else if(e.target.value.trim()) toast("Darin stehen keine Koordinaten", "warn", 2600, true); });
      el.querySelector('[data-act="pick"]').onclick = () => { const dr = keepDraft(el); const c = parseCoords(dr.coords); go("ortWahl", {titel:dr.name || "Unterkunft", lat:c?.lat ?? null, lng:c?.lng ?? null}); };
      el.querySelector('[data-act="save"]').onclick = () => {
        const f = readForm(el);
        if(!f.name) return toast("Bitte einen Namen eintragen", "warn", 2600, true);
        const c = f.coords ? parseCoords(f.coords) : null;
        if(f.coords && !c) return toast("Die Koordinaten sind nicht lesbar", "warn", 3000, true);
        const preis = num(f.preis); if(f.preis && preis === null) return toast("Der Preis ist keine Zahl", "warn", 2600, true);
        if(f.link && !/^https?:\/\//i.test(f.link)) f.link = "https://" + f.link;
        const patch = {name:f.name.slice(0, 100), art:f.art, preis, waehrung:f.waehrung || "THB", bezug:f.bezug || "nacht", adresse:f.adresse, lat:c ? c.lat : null, lng:c ? c.lng : null, link:f.link, checkin:f.checkin, checkout:f.checkout, bewertung:f.bewertung ? +f.bewertung : null, notiz:(f.notiz || "").slice(0, 3000) || null};
        const st = f.status || "kandidat";
        if(l){
          if(!f.stayId) return toast("Bitte einem Aufenthalt zuordnen", "warn", 2600, true);
          const mv = moveOption("lodgings", l.id, f.stayId);
          if(!mv.ok && mv.blockiert) return toast(`Dort ist schon „${mv.blockiert.name}“ gewählt. Setzt diese Option zuerst auf Favorit.`, "warn", 4200, true);
          const ch = Object.fromEntries(Object.entries(patch).filter(([k, v]) => JSON.stringify(v ?? null) !== JSON.stringify(l[k] ?? null)));
          if(Object.keys(ch).length) setRec("lodgings", l.id, ch);
          if(st !== l.status){ const r = setOptionStatus("lodgings", l.id, st); if(!r.ok && r.blockiert){ persist(); return toast(`${r.blockiert.name} ist gebucht. Status nicht geändert.`, "warn", 4200, true); } }
          persist(); back(); toast("Unterkunft gespeichert");
        } else {
          const nid = uid("lo-"); setRec("lodgings", nid, {...patch, stayId, status:"kandidat", createdAt:Date.now()});
          if(st !== "kandidat"){ const r = setOptionStatus("lodgings", nid, st); if(!r.ok && r.blockiert) toast(`${r.blockiert.name} ist gebucht, die neue Option bleibt Kandidat.`, "warn", 4200, true); }
          persist(); back(); toast(`${patch.name} hinzugefügt`);
        }
      };
      const del = el.querySelector('[data-act="del"]');
      if(del) del.onclick = () => confirmSheet({title:`${l.name} löschen?`, text:"Nur diese Option wird gelöscht, der Aufenthalt bleibt. Statt zu löschen könnt ihr sie auch auf „Verworfen“ setzen.", ok:"Löschen", danger:true})
        .then(y => { if(!y) return; setRec("lodgings", l.id, {weg:true}); persist(); UI.stacks[UI.tab] = stackOf().filter(x => x.params?.id !== l.id); render({top:true}); toast("Option gelöscht", "muell"); });
    }};
};

/* ---------- Kartenpunkt wählen (eine kleine Karte, der Mittelpunkt zählt) ----------
   Zwei Wege, eine Logik: mit lodgingId speichert „Übernehmen“ den Punkt direkt in der Unterkunftsoption (aus Liste, Detail
   oder Vergleich), ohne lodgingId geht er als Entwurf zurück ins Formular. Abbrechen ändert nie etwas. Kein Geocoding:
   den Punkt setzt ihr selbst, „Mein Standort“ nutzt nur das GPS des Handys. */
let pickMap = null;
// Start der Karte: eigener Punkt, sonst ein Punkt einer anderen Option desselben Aufenthalts (nur als Kartenausschnitt), sonst Standort oder Thailand
function pickStart(p, l){
  if(l && Number.isFinite(l.lat)) return [[l.lat, l.lng], 16];
  if(Number.isFinite(p.lat)) return [[p.lat, p.lng], 16];
  const nb = l ? lodgingsOf(l.stayId).find(x => x.id !== l.id && Number.isFinite(x.lat)) : null;
  if(nb) return [[nb.lat, nb.lng], 14];
  return ME?.inArea ? [[ME.lat, ME.lng], 15] : [VIEW.center, 6];
}
const pinLabel = l => Number.isFinite(l?.lat) ? "Kartenpunkt ändern" : "Kartenpunkt setzen";
VIEWS.ortWahl = p => {
  const l = p.lodgingId ? rec("lodgings", p.lodgingId) : null, name = l ? l.name : p.titel || "";
  if(p.lodgingId && !l) return {title:"Nicht gefunden", html:empty("info", "Diese Option wurde gelöscht.", "")};
  return {title:l ? pinLabel(l) : "Ort wählen", form:true,
    html:`<p class="hint">Karte verschieben und zoomen, bis die Markierung auf der Einfahrt ${name ? "von " + esc(name) : "der Unterkunft"} liegt.${l?.adresse ? ` Eure Adressangabe: ${esc(l.adresse)}.` : ""}</p>
      <div class="picker"><div class="pmap" id="pmap"></div><div class="cross">${ic("pin")}</div></div>
      <div class="pickrow"><span class="hint" id="pc"></span><button class="btn small" data-act="me">${ic("standort")}Mein Standort</button></div>`,
    bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="ok">Übernehmen</button>`,
    mount(el){
      if(pickMap){ try{ pickMap.remove(); }catch(e){} pickMap = null; } // Rest einer abgebrochenen Auswahl
      if(!window.L){ el.querySelector("#pmap").innerHTML = '<p style="padding:20px">Karte nicht geladen. Koordinaten bitte im Formular als Text einfügen.</p>'; el.querySelector('[data-act="ok"]').disabled = true; return; }
      const prev = stackOf()[stackOf().length - 2]?.params || {}, [start, zoom] = pickStart(p, l);
      pickMap = L.map(el.querySelector("#pmap"), {zoomControl:false, attributionControl:false, maxBounds:VIEW.bounds, minZoom:5, maxZoom:18}).setView(start, zoom);
      L.tileLayer(TILE_URL, {maxNativeZoom:17, maxZoom:18, crossOrigin:true}).addTo(pickMap); // Satellit: Einfahrt und Gebäude sind darauf erkennbar
      refLayer({zIndex:3}).addTo(pickMap); // Ortsnamen zur Orientierung
      // Nach Abbrechen oder Zurück ist die Ansicht weg: Karte dann abräumen statt ins Leere zu schreiben (Nachlauf beim Ziehen)
      const pc = el.querySelector("#pc"), mapNow = pickMap;
      const show = () => { if(!pc.isConnected){ setTimeout(() => { try{ mapNow.remove(); }catch(e){} if(pickMap === mapNow) pickMap = null; }); return; } const c = mapNow.getCenter(); pc.textContent = mapNow.getZoom() < 13 ? "Zum Setzen näher heranzoomen" : `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}`; };
      pickMap.on("move zoomend", show); show();
      el.querySelector('[data-act="me"]').onclick = () => navigator.geolocation ? navigator.geolocation.getCurrentPosition(pos => pickMap.setView([pos.coords.latitude, pos.coords.longitude], 16), () => toast("Standort nicht freigegeben", "warn", 2600, true), {enableHighAccuracy:true, timeout:8000}) : toast("Standort nicht verfügbar", "warn", 2600, true);
      el.querySelector('[data-act="ok"]').onclick = () => {
        const c = pickMap.getCenter();
        if(pickMap.getZoom() < 13) return toast("Bitte näher heranzoomen, damit der Punkt genau sitzt", "info", 3000);
        const lat = +c.lat.toFixed(6), lng = +c.lng.toFixed(6);
        pickMap.remove(); pickMap = null;
        if(!l){ prev.draft = {...(prev.draft || {}), coords:`${lat}, ${lng}`}; back(); return toast("Ort übernommen", "pin"); }
        // Nur lat und lng ändern sich, mit eigenem Zeitstempel je Feld: der Abgleich führt das feldweise zusammen.
        // Routen- und Kachel-Cache hängen an den Koordinaten, ein verschobener Punkt bekommt also nie eine alte Route.
        const neu = !Number.isFinite(l.lat);
        setRec("lodgings", l.id, {lat, lng}); persist(); back(); onDataChanged();
        toast(neu ? "Kartenpunkt gesetzt" : "Kartenpunkt geändert", "pin");
        if(typeof prefetchTiles === "function") prefetchTiles();
        if(navigator.onLine !== false) roadGap(lat, lng).then(m => { if(m > 150) toast(`${m} m bis zur nächsten Straße. Liegt der Punkt an der Einfahrt?`, "warn", 4200, true); }).catch(() => {});
      };
    }};
};

/* ---------- Vergleich (Unterkünfte oder Transportoptionen) ----------
   Karten untereinander, in jeder Karte dieselben Zeilen an derselben Stelle. Vier Arten von Leere, nie vermischt:
   –                    optionales Feld, nicht ausgefüllt (Art, Adresse, Wertung, Check-in, Anbieter, Nummer, Dauer, Link)
   „nicht eingetragen“  wichtige Angabe fehlt, ist für einen bloßen Kandidaten aber noch kein Problem (neutral)
   „… fehlt“            dieselbe Angabe fehlt bei der eindeutig gewählten Option: das meldet auch die Prüfung (bernstein)
   Konflikt             mehrere gewählt, Karte rot, „Behalten“
   Die App setzt nie Standardwerte ein, Unbekanntes bleibt sichtbar unbekannt. */
const V_LEER = `<span class="v-leer" aria-label="keine Angabe">–</span>`;
const vOpt = v => v === null || v === undefined || v === "" ? V_LEER : v;
const V_NICHT = `<span class="v-nicht">nicht eingetragen</span>`;
const vFehlt = was => `<span class="v-fehlt">${ic("info")}${esc(was)} fehlt</span>`;
VIEWS.compare = ({col, parent, alle, f}) => {
  const isL = col === "lodgings", owner = isL ? rec("stays", parent) : rec("conns", parent);
  if(!owner) return {title:"Vergleich", html:empty("info", "Nicht mehr vorhanden.", "")};
  // feste Reihenfolge nach Erfassung: nach dem Wählen springt keine Karte unter dem Finger weg
  const n = isL ? nights(owner) : null, listAll = (isL ? lodgingsOf(parent) : optsOf(parent)).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0) || a.id.localeCompare(b.id)), list = alle ? listAll : listAll.filter(o => !RAUS.has(o.status));
  if(list.length < 1) return {title:"Vergleich", html:empty("vergleich", "Nichts zu vergleichen", "Legt mindestens zwei Optionen an.")};
  const ch = chosenOf(list), relevant = o => GEWAEHLT.has(o.status) && !ch.mehrere; // genau die Option, die die Prüfung prüft
  // Filter nur über vorhandene Status. Konflikt, Preise und „günstigste“ gelten immer über alle aktiven Optionen.
  const FILTER = [["alle", "Alle", () => true], ["kandidat", "Kandidaten", o => o.status === "kandidat"], ["favorit", "Favoriten", o => o.status === "favorit"], ["gewaehlt", "Gewählt", o => GEWAEHLT.has(o.status)]];
  const fk = FILTER.some(x => x[0] === f) ? f : "alle", shown = list.filter(FILTER.find(x => x[0] === fk)[2]);
  const chips = list.length > 2 ? `<div class="chips scroll" role="group" aria-label="Filter">${FILTER.map(([k, t, fn]) => `<button class="chip" data-filter="${k}" aria-pressed="${k === fk}">${t} <small>${list.filter(fn).length}</small></button>`).join("")}</div>` : "";
  // günstigste je Währung hervorheben, Währungen werden nie umgerechnet. Unterkünfte nach Gesamtpreis, solange die Nächte feststehen.
  const priceOf = o => isL ? (n ? lodgingPrice(o, n).gesamt : lodgingPrice(o, n).nacht) : o.preis;
  const best = {}; list.forEach(o => { const v = priceOf(o); if(Number.isFinite(v)) best[o.waehrung || "THB"] = Math.min(best[o.waehrung || "THB"] ?? Infinity, v); });
  const isBest = o => { const v = priceOf(o); return Number.isFinite(v) && best[o.waehrung || "THB"] === v && list.filter(x => Number.isFinite(priceOf(x)) && (x.waehrung || "THB") === (o.waehrung || "THB")).length > 1; };
  const preis = o => {
    // wie in der Prüfung: bei der gewählten Transportoption fehlt ein Preis, bei einer gebuchten nicht (steht in der Buchung)
    if(!isL) return Number.isFinite(o.preis) ? `<b>${money(o.preis, o.waehrung)}</b>` : relevant(o) && o.status !== "gebucht" ? vFehlt("Preis") : `<span class="cp-leer">Preis ${V_NICHT}</span>`;
    const pr = lodgingPrice(o, n);
    if(pr.nacht === null && pr.gesamt === null) return `<span class="cp-leer">Preis ${V_NICHT}</span>`;
    return `<b>${pr.nacht !== null ? money(pr.nacht, o.waehrung) + " / Nacht" : money(pr.gesamt, o.waehrung) + " gesamt"}</b>${pr.nacht !== null ? `<small>${pr.gesamt !== null ? money(pr.gesamt, o.waehrung) + ` gesamt für ${plural(n, "Nacht", "Nächte")}` : "Gesamtpreis, sobald die Nächte feststehen"}</small>` : `<small>für den ganzen Aufenthalt, Nächte noch offen</small>`}`;
  };
  const link = o => o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener">${ic("extern")}öffnen</a>` : V_LEER;
  // Zeiten sind wichtig, aber erst bei der gewählten Option Pflicht (Prüfung: Datum, Abfahrt, Ankunft)
  const zeit = (o, datum, uhr, brauchtDatum) => {
    const t = esc([datum ? fmtDate(datum) : null, uhr].filter(Boolean).join(" ")), fehlt = [brauchtDatum && !datum && "Datum", !uhr && "Uhrzeit"].filter(Boolean);
    return relevant(o) && fehlt.length ? (t ? t + " · " : "") + vFehlt(fehlt.join(", ")) : t || V_NICHT;
  };
  const facts = o => isL ? [
    ["Art", vOpt(esc(o.art || ""))],
    ["Lage", vOpt(esc(o.adresse || ""))],
    ["Karte", `<span class="kp">${pinState(o, relevant(o))}<button class="btn small" data-pin="${o.id}">${Number.isFinite(o.lat) ? "Ändern" : "Setzen"}</button></span>`],
    ["Wertung", o.bewertung ? `<span class="stars" aria-label="${o.bewertung} von 5">${"★".repeat(o.bewertung)}<span>${"★".repeat(5 - o.bewertung)}</span></span>` : V_LEER],
    ["Check-in/out", vOpt([o.checkin, o.checkout].filter(Boolean).join(" / "))],
    ["Link", link(o)],
  ] : [
    ["Anbieter", vOpt(esc(o.anbieter || ""))],
    ["Nummer", vOpt(esc(o.nummer || ""))],
    ["Abfahrt", zeit(o, o.datum, o.ab, true)],
    ["Ankunft", zeit(o, o.anDatum && o.anDatum !== o.datum ? o.anDatum : null, o.an, false)],
    ["Dauer", o.dauerMin ? esc(legTxt(o.dauerMin)) + `<span class="v-nicht"> · ${o.dauerOk ? "laut Fahrplan" : "geschätzt"}</span>` : V_LEER],
    ["Link", link(o)],
  ];
  // Kein Bildfeld im Datenmodell: statt erfundener Hotelfotos eine ruhige Fläche mit Symbol
  const head = o => isL ? `<span class="who"><span class="thumb">${ic("hotel")}</span><span class="tt"><span class="t">${esc(o.name)}</span></span></span>` : `<span class="who"><span class="thumb">${ic(TRANSPORT[o.art]?.[1] || "reise")}</span><span class="tt"><span class="t">${esc(TRANSPORT[o.art]?.[0] || "Option")}</span></span></span>`;
  const action = o => GEWAEHLT.has(o.status) && ch.mehrere ? `<button class="btn primary" data-choose="${o.id}">Behalten</button>`
    : GEWAEHLT.has(o.status) ? `<span class="chosen">${ic("haken")}${o.status === "gebucht" ? "Gebucht" : "Gewählt"}</span>`
    : RAUS.has(o.status) ? "" : `<button class="btn" data-choose="${o.id}">Wählen</button>`;
  const card = o => `<article class="ccard${GEWAEHLT.has(o.status) ? (ch.mehrere ? " konflikt" : " on") : ""}">
      <header>${head(o)}${pill(o.status)}</header>
      <div class="cprice${isBest(o) ? " best" : ""}"><div>${preis(o)}</div>${isBest(o) ? `<span class="tag">günstigste</span>` : ""}</div>
      <dl>${facts(o).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}</dl>
      ${o.notiz ? `<p class="cnote">${esc(o.notiz.slice(0, 140))}${o.notiz.length > 140 ? " …" : ""}</p>` : ""}
      <footer><button class="btn ghost" ${attrGo(isL ? "lodging" : "opt", {id:o.id})}>Details</button>${action(o)}</footer>
    </article>`;
  return {title:"Vergleich", large:true, sub:esc(isL ? stayName(owner) + (n ? " · " + plural(n, "Nacht", "Nächte") : "") : connTitle(owner)),
    html:`${ch.mehrere ? `<p class="note konflikt">${ch.alle.length} Optionen sind gleichzeitig gewählt. Behaltet eine, die andere wird Favorit.</p>` : ""}
      ${chips}<div class="ccards">${shown.length ? shown.map(card).join("") : `<p class="hint">Keine Option mit diesem Status.</p>`}</div>
      <p class="hint">„–“ heißt: nicht ausgefüllt, optional. „fehlt“ steht nur bei der gewählten Option, wenn die Angabe für die Planung nötig ist. Hervorgehoben ist der niedrigste ${isL && n ? "Gesamtpreis" : "Preis"} je Währung, Euro und Baht werden nicht umgerechnet.</p>
      ${listAll.length > list.length || alle ? `<button class="btn ghost" ${attrGo("compare", {col, parent, alle:!alle})}>${alle ? "Verworfene ausblenden" : "Auch verworfene zeigen"}</button>` : ""}`,
    mount(el){ bindPins(el); el.querySelectorAll("[data-choose]").forEach(b => b.onclick = () => keepOption(col, b.dataset.choose)); el.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => replaceView("compare", {col, parent, alle, f:b.dataset.filter})); }};
};

/* ---------- Verbindung und Transportoptionen ---------- */
VIEWS.conn = ({id}) => {
  const c = rec("conns", id); if(!c) return {title:"Nicht gefunden", html:empty("info", "Diese Verbindung wurde gelöscht.", "")};
  const os = optsOf(id), ch = connChoice(id), aktiv = os.filter(o => !RAUS.has(o.status)), raus = os.filter(o => RAUS.has(o.status));
  const v = c.vonStay && rec("stays", c.vonStay), n = c.nachStay && rec("stays", c.nachStay);
  const optLabel = o => [TRANSPORT[o.art]?.[0], o.anbieter, o.nummer].filter(Boolean).join(" · ");
  const optInfo = o => [optWhen(o) || "ohne Zeit", optDauer(o), Number.isFinite(o.preis) ? money(o.preis, o.waehrung) : "ohne Preis"].filter(Boolean).join(" · ");
  const orow = o => row({icon:TRANSPORT[o.art]?.[1] || "reise", c:ch.zustand === "gewaehlt" && GEWAEHLT.has(o.status) ? "--accent" : null, t:esc(optLabel(o)), s:esc(optInfo(o)), end:pill(o.status), go:"opt", p:{id:o.id}});
  const keepRow = o => `<div class="row"><span class="lead c" style="--c:var(--konflikt)">${ic(TRANSPORT[o.art]?.[1] || "reise")}</span><span class="txt"><button class="t linkish" ${attrGo("opt", {id:o.id})}>${esc(optLabel(o))}</button><span class="s">${esc(STATUS[o.status] + " · " + optInfo(o))}</span></span><button class="btn small" data-keep="${o.id}">Behalten</button></div>`;
  const addRow = row({icon:"plus", t:"Transportoption hinzufügen", go:"optEdit", p:{connId:id}, cls:"addrow", chev:false});
  const andere = aktiv.filter(o => !(ch.zustand !== "offen" && GEWAEHLT.has(o.status)));
  const cmp = aktiv.length > 1 ? `<button class="link" ${attrGo("compare", {col:"opts", parent:id})}>Vergleichen</button>` : "";
  const kontext = [v?.bis ? `Abreise aus ${stayName(v)} am ${fmtDateLong(v.bis)}` : null, n?.von ? `Anreise in ${stayName(n)} am ${fmtDateLong(n.von)}` : null].filter(Boolean);
  const gewaehlt = ch.zustand === "gewaehlt" ? sect("Gewählte Option", group([orow(ch.item)]), cmp)
    : ch.zustand === "konflikt" ? sect("Auswahl ungeklärt", `<p class="note konflikt">${ch.alle.length} Optionen sind gleichzeitig gewählt, meist nach einem Abgleich. Bis ihr eine behaltet, gilt keine, und die App prüft keine ihrer Zeiten. Die andere wird Favorit.</p><div class="group">${ch.alle.map(keepRow).join("")}</div>`, cmp) : "";
  const optionen = ch.zustand === "leer" ? sect("Optionen", empty("reise", "Noch keine Option", "Tragt Flüge, Züge, Busse oder Fähren ein, die ihr gefunden habt. Zeiten und Preise nur, wenn bekannt.", `<button class="btn primary" ${attrGo("optEdit", {connId:id})}>${ic("plus")}Erste Option hinzufügen</button>`))
    : sect(ch.zustand === "offen" ? "Optionen" : "Alternativen", (ch.zustand === "offen" ? `<p class="hint">Noch keine gewählt. Öffnet eine Option oder vergleicht sie.</p>` : "") + group([...andere.map(orow), addRow]), ch.zustand === "offen" ? cmp : "");
  return {title:connTitle(c), large:true, sub:kontext.length ? esc(kontext.join(" · ")) : "",
    right:`<button class="navbtn" ${attrGo("connEdit", {id})}>Bearbeiten</button>`,
    html:`${gewaehlt}${optionen}
      ${raus.length ? `<details class="group"><summary class="row"><span class="txt"><span class="s">${plural(raus.length, "verworfene oder stornierte Option", "verworfene oder stornierte Optionen")}</span></span></summary>${raus.map(orow).join("")}</details>` : ""}
      ${sect("Orte", group([v ? row({icon:"hotel", t:"Von " + esc(stayName(v)), go:"stay", p:{id:v.id}}) : row({icon:"pin", t:"Von " + esc(c.vonText || "?"), s:"Kein Aufenthalt verknüpft", go:"connEdit", p:{id}}), n ? row({icon:"hotel", t:"Nach " + esc(stayName(n)), go:"stay", p:{id:n.id}}) : row({icon:"pin", t:"Nach " + esc(c.nachText || "?"), s:"Kein Aufenthalt verknüpft", go:"connEdit", p:{id}})]))}
      ${c.notiz ? sect("Notiz", `<div class="group rowx"><p class="prose">${esc(c.notiz)}</p></div>`) : ""}`,
    mount(el){ el.querySelectorAll("[data-keep]").forEach(b => b.onclick = () => keepOption("opts", b.dataset.keep)); }};
};
const endOptions = () => [["", "Anderer Ort (Text)"], ...stays().map(s => ["st:" + s.id, `${stayName(s)}${s.von ? " · " + fmtRange(s.von, s.bis) : ""}`])];
VIEWS.neuConn = p => VIEWS.connEdit({...p, neu:true});
// Kopf des Verbindungsformulars: welche Orte verbunden werden und an welchen Tagen die Aufenthalte enden bzw. beginnen
function routeSummary(f){
  const v = f.von ? rec("stays", f.von.slice(3)) : null, n = f.nach ? rec("stays", f.nach.slice(3)) : null;
  const seite = (s, txt, wann, leer) => s ? `<b>${esc(stayName(s))}</b><small>${s[wann] ? (wann === "bis" ? "Abreise " : "Anreise ") + esc(fmtDate(s[wann])) : "ohne Datum"}</small>` : txt ? `<b>${esc(txt)}</b><small>freier Ort, ohne Datumsprüfung</small>` : `<b class="offen">${leer}</b><small>noch nicht gewählt</small>`;
  return `<div class="rs-end">${seite(v, f.vonText, "bis", "Start offen")}</div><span class="rs-arrow">${ic("weiter")}</span><div class="rs-end">${seite(n, f.nachText, "von", "Ziel offen")}</div>`;
}
VIEWS.connEdit = p => {
  const c = p.neu ? null : rec("conns", p.id);
  // Neue Verbindung: was der Aufruf mitgibt (Platzhalter, Aufenthalt). Fehlt eine Seite und grenzt genau ein Aufenthalt an, wird sie ergänzt.
  let auto = null;
  if(!c && !p.draft && (p.vonStay ? !p.nachStay : p.nachStay)){
    const s = rec("stays", p.vonStay || p.nachStay), nb = neighborStay(s, p.vonStay ? "nach" : "vor");
    if(nb){ auto = p.vonStay ? "nach" : "von"; p = {...p, [p.vonStay ? "nachStay" : "vonStay"]:nb.id}; }
  }
  const d = p.draft || (c ? {von:c.vonStay ? "st:" + c.vonStay : "", vonText:c.vonText, nach:c.nachStay ? "st:" + c.nachStay : "", nachText:c.nachText, notiz:c.notiz} : {von:p.vonStay ? "st:" + p.vonStay : "", nach:p.nachStay ? "st:" + p.nachStay : "", vonText:"", nachText:""});
  const vorbelegt = !c && !p.draft && (p.vonStay || p.nachStay);
  return {title:c ? "Verbindung bearbeiten" : "Neue Verbindung", form:true,
    html:`<div class="form">
      <div class="routesum" id="rs">${routeSummary(d)}</div>
      <p class="fhint" id="rsHint">${vorbelegt ? `Aus euren Aufenthalten vorbelegt${auto ? `, ${auto === "nach" ? "Ziel" : "Start"} ist der direkt angrenzende Aufenthalt` : ""}. Unten änderbar.` : ""}</p>
      <div class="flabel">Von</div><div class="fgroup">${fSelect("von", "Aufenthalt", d.von, endOptions())}${fText("vonText", "oder Ort", d.vonText, {ph:"z. B. Flughafen oder Heimatort"})}</div>
      <div class="flabel">Nach</div><div class="fgroup">${fSelect("nach", "Aufenthalt", d.nach, endOptions())}${fText("nachText", "oder Ort", d.nachText, {ph:"z. B. Flughafen"})}</div>
      <p class="fhint">Mit einem Aufenthalt verknüpft, prüft die App, ob Abfahrt und Ankunft zu dessen Daten passen. Danach ergänzt ihr die Transportoptionen.</p>
      <div class="fgroup">${fArea("notiz", "Notiz", d.notiz, "Optional")}</div>
      ${c ? `<button class="btn danger block" data-act="del">${ic("muell")}Verbindung löschen</button>` : ""}
    </div>`,
    bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="save">${c ? "Speichern" : "Anlegen"}</button>`,
    mount(el){
      const sel = sd => el.querySelector(`[data-f="${sd}"]`), txt = sd => el.querySelector(`[data-f="${sd}Text"]`);
      const sync = sd => { txt(sd).closest(".field").hidden = !!sel(sd).value; el.querySelector("#rs").innerHTML = routeSummary(readForm(el)); };
      // Was ihr selbst gewählt oder getippt habt, wird nie überschrieben. Nur eine leere, unberührte Gegenseite wird ergänzt.
      const touched = {von:!!(d.von || d.vonText), nach:!!(d.nach || d.nachText)};
      ["von", "nach"].forEach(sd => {
        const other = sd === "von" ? "nach" : "von";
        txt(sd).addEventListener("input", () => { touched[sd] = true; sync(sd); });
        sel(sd).addEventListener("change", () => {
          touched[sd] = true;
          const s = sel(sd).value ? rec("stays", sel(sd).value.slice(3)) : null, nb = s && neighborStay(s, sd === "von" ? "nach" : "vor");
          if(nb && !touched[other] && !sel(other).value && !txt(other).value.trim()){
            sel(other).value = "st:" + nb.id; sync(other);
            el.querySelector("#rsHint").textContent = `${sd === "von" ? "Ziel" : "Start"} ergänzt: ${stayName(nb)} grenzt direkt an. Änderbar.`;
          }
          sync(sd);
        });
        sync(sd);
      });
      el.querySelector('[data-act="save"]').onclick = () => {
        const f = readForm(el);
        const patch = {vonStay:f.von ? f.von.slice(3) : null, vonText:f.von ? null : f.vonText, nachStay:f.nach ? f.nach.slice(3) : null, nachText:f.nach ? null : f.nachText, notiz:f.notiz};
        if(!patch.vonStay && !patch.vonText && !patch.nachStay && !patch.nachText) return toast("Bitte Start oder Ziel angeben", "warn", 2600, true);
        if(patch.vonStay && patch.vonStay === patch.nachStay) return toast("Start und Ziel sind derselbe Aufenthalt", "warn", 2800, true);
        if(c){ const ch = Object.fromEntries(Object.entries(patch).filter(([k, v]) => (v ?? null) !== (c[k] ?? null))); if(Object.keys(ch).length) setRec("conns", c.id, ch); persist(); back(); toast("Verbindung gespeichert"); }
        else { const nid = uid("cn-"); setRec("conns", nid, {...patch, createdAt:Date.now()}); persist(); replaceView("conn", {id:nid}); toast("Verbindung angelegt"); }
      };
      const del = el.querySelector('[data-act="del"]');
      if(del) del.onclick = () => confirmSheet({title:"Verbindung löschen?", text:`${esc(connTitle(c))} mit ${plural(optsOf(c.id).length, "Option", "Optionen")} wird gelöscht. Aufenthalte bleiben.`, ok:"Löschen", danger:true})
        .then(y => { if(!y) return; deleteConn(c.id); persist(); UI.stacks[UI.tab] = stackOf().filter(x => x.params?.id !== c.id); render({top:true}); toast("Verbindung gelöscht", "muell"); });
    }};
};
VIEWS.opt = ({id}) => {
  const o = rec("opts", id); if(!o) return {title:"Nicht gefunden", html:empty("info", "Diese Option wurde gelöscht.", "")};
  const c = rec("conns", o.connId), gew = GEWAEHLT.has(o.status), st = optStart(o), en = optEnd(o);
  const v = c?.vonStay && rec("stays", c.vonStay), n = c?.nachStay && rec("stays", c.nachStay), anD = o.anDatum || o.datum;
  const warn = [st && en && en < st ? "Ankunft liegt vor der Abfahrt." : null, v?.bis && o.datum && o.datum !== v.bis ? `Abfahrt am ${fmtDate(o.datum)}, Abreise aus ${stayName(v)} ist am ${fmtDate(v.bis)}.` : null, n?.von && anD && o.an && anD !== n.von ? `Ankunft am ${fmtDate(anD)}, Aufenthalt in ${stayName(n)} beginnt am ${fmtDate(n.von)}.` : null].filter(Boolean);
  const konfliktO = gew && c && connChoice(c.id).zustand === "konflikt";
  const bar = !c ? "" : konfliktO ? `<button class="btn primary" data-act="choose">${ic("haken")}Diese behalten</button>` : gew ? `<span class="status">${ic("haken")}${o.status === "gebucht" ? "Gebucht" : "Gewählt"} für diese Verbindung</span>` : `<button class="btn primary" data-act="choose">Diese Option wählen</button>`;
  return {title:[TRANSPORT[o.art]?.[0], o.anbieter].filter(Boolean).join(" · ") || "Option", large:true, sub:`${esc(c ? connTitle(c) : "")} ${pill(o.status)}`,
    right:`<button class="navbtn" ${attrGo("optEdit", {id})}>Bearbeiten</button>`, bar,
    html:`${warn.map(w => `<p class="note konflikt">${esc(w)}</p>`).join("")}
      ${!c ? `<p class="note konflikt">Diese Option gehört zu einer Verbindung, die gelöscht wurde. Ordnet sie unter „Bearbeiten“ einer Verbindung zu oder löscht sie.</p>`
        : konfliktO ? `<p class="note konflikt">Gleichzeitig mit einer anderen Option gewählt. Bis ihr eine behaltet, gilt keine.</p>` : ""}
      ${sect("Angaben", group([
        row({icon:"uhr", t:optWhen(o) ? esc(optWhen(o)) : "Keine Zeiten eingetragen", s:optDauer(o) ? "Dauer " + esc(optDauer(o)) + (o.dauerMin && !o.dauerOk ? " (geschätzt)" : "") : "Ortszeit"}),
        row({icon:"euro", t:Number.isFinite(o.preis) ? money(o.preis, o.waehrung) : "Kein Preis eingetragen"}),
        (o.anbieter || o.nummer) && row({icon:TRANSPORT[o.art]?.[1] || "reise", t:esc([o.anbieter, o.nummer].filter(Boolean).join(" · "))}),
        o.link && row({icon:"link", t:"Buchung oder Information", s:esc(o.link.replace(/^https?:\/\//, "").slice(0, 48)), href:o.link}),
      ].filter(Boolean)))}
      ${sect("Status", statusChips(o.status))}
      ${o.notiz ? sect("Notiz", `<div class="group rowx"><p class="prose">${esc(o.notiz)}</p></div>`) : ""}`,
    mount(el){
      bindStatus(el, "opts", id);
      el.querySelector('[data-act="choose"]')?.addEventListener("click", () => keepOption("opts", id));
    }};
};
VIEWS.optEdit = p => {
  const o = p.id ? rec("opts", p.id) : null, connId = o ? o.connId : p.connId, c = rec("conns", connId);
  const v = c?.vonStay && rec("stays", c.vonStay);
  const d = p.draft || (o ? {...o, preis:o.preis ?? "", dh:o.dauerMin ? Math.floor(o.dauerMin / 60) : "", dm:o.dauerMin ? o.dauerMin % 60 : "", dauerOk:o.dauerOk ? "1" : "0"} : {art:null, status:"kandidat", waehrung:"THB", datum:v?.bis || null, dauerOk:"0"});
  return {title:o ? "Option bearbeiten" : "Transportoption", form:true,
    html:`<div class="form">
      ${o ? `<div class="fgroup">${fSelect("connId", "Gehört zu", c ? (d.connId || o.connId) : "", [...(c ? [] : [["", "Bitte einer Verbindung zuordnen"]]), ...conns().map(x => [x.id, connTitle(x)])])}</div>` : `<p class="hint">${esc(c ? connTitle(c) : "")}</p>`}
      <div class="flabel">Verkehrsmittel</div>${fChips("art", Object.entries(TRANSPORT).map(([k, [l, icon]]) => [k, l, icon]), d.art || "", {req:true})}
      <div class="fgroup">${fRow(fText("datum", "Abfahrt am", d.datum, {type:"date"}), fText("ab", "um", d.ab, {type:"time"}))}${fRow(fText("anDatum", "Ankunft am", d.anDatum || "", {type:"date"}), fText("an", "um", d.an, {type:"time"}))}</div>
      <p class="fhint">Ortszeit. Ankunftsdatum nur, wenn es ein anderer Tag ist.</p>
      <div class="fgroup">${fRow(fText("dh", "Dauer Stunden", d.dh, {type:"number", im:"numeric", min:0}), fText("dm", "Minuten", d.dm, {type:"number", im:"numeric", min:0, step:5}))}</div>
      ${fChips("dauerOk", [["0", "Dauer geschätzt"], ["1", "laut Fahrplan oder Buchung"]], d.dauerOk || "0", {req:true})}
      <div class="fgroup">${fText("anbieter", "Anbieter", d.anbieter, {ph:"z. B. Airline, Bahn, Busfirma"})}${fText("nummer", "Flug-, Zug- oder Linien-Nr.", d.nummer, {ac:false})}</div>
      <div class="fgroup">${fRow(fText("preis", "Preis", d.preis, {im:"decimal", ph:"unbekannt"}), fSelect("waehrung", "Währung", d.waehrung || "THB", WAEHRUNG.map(w => [w, w])))}${fText("link", "Link zur Buchung oder Information", d.link, {type:"url", im:"url", ph:"https://…", ac:false})}</div>
      <div class="flabel">Status</div>${fChips("status", Object.entries(STATUS), d.status || "kandidat", {req:true})}
      <div class="fgroup">${fArea("notiz", "Notiz", d.notiz, "Gepäck, Umstieg, Treffpunkt …")}</div>
      ${o ? `<button class="btn danger block" data-act="del">${ic("muell")}Option löschen</button>` : ""}
    </div>`,
    bar:`<button class="btn" data-back>Abbrechen</button><button class="btn primary" data-act="save">${o ? "Speichern" : "Hinzufügen"}</button>`,
    mount(el){
      bindChips(el);
      el.querySelector('[data-act="save"]').onclick = () => {
        const f = readForm(el);
        if(!f.art) return toast("Bitte ein Verkehrsmittel wählen", "warn", 2600, true);
        if(f.datum && f.anDatum && f.anDatum < f.datum) return toast("Ankunft liegt vor der Abfahrt", "warn", 2800, true);
        const preis = num(f.preis); if(f.preis && preis === null) return toast("Der Preis ist keine Zahl", "warn", 2600, true);
        const dauer = (Math.max(0, num(f.dh) || 0)) * 60 + Math.max(0, Math.min(59, num(f.dm) || 0));
        if(f.link && !/^https?:\/\//i.test(f.link)) f.link = "https://" + f.link;
        const patch = {art:f.art, datum:f.datum, ab:f.ab, anDatum:f.anDatum && f.anDatum !== f.datum ? f.anDatum : null, an:f.an, dauerMin:dauer || null, dauerOk:!!(dauer && f.dauerOk === "1"), anbieter:f.anbieter, nummer:f.nummer, preis, waehrung:f.waehrung || "THB", link:f.link, notiz:(f.notiz || "").slice(0, 3000) || null};
        const st = f.status || "kandidat";
        if(o){
          if(!f.connId) return toast("Bitte einer Verbindung zuordnen", "warn", 2600, true);
          const mv = moveOption("opts", o.id, f.connId);
          if(!mv.ok && mv.blockiert) return toast("Dort ist schon eine Option gewählt. Setzt diese zuerst auf Favorit.", "warn", 4200, true);
          const ch = Object.fromEntries(Object.entries(patch).filter(([k, v]) => JSON.stringify(v ?? null) !== JSON.stringify(o[k] ?? null)));
          if(Object.keys(ch).length) setRec("opts", o.id, ch);
          if(st !== o.status){ const r = setOptionStatus("opts", o.id, st); if(!r.ok && r.blockiert){ persist(); return toast("Eine andere Option ist gebucht. Status nicht geändert.", "warn", 4200, true); } }
          persist(); back(); toast("Option gespeichert");
        } else {
          const nid = uid("op-"); setRec("opts", nid, {...patch, connId, status:"kandidat", createdAt:Date.now()});
          if(st !== "kandidat"){ const r = setOptionStatus("opts", nid, st); if(!r.ok && r.blockiert) toast("Eine andere Option ist gebucht, die neue bleibt Kandidat.", "warn", 4200, true); }
          persist(); back(); toast("Option hinzugefügt");
        }
      };
      const del = el.querySelector('[data-act="del"]');
      if(del) del.onclick = () => confirmSheet({title:"Option löschen?", text:"Nur diese Option wird gelöscht, die Verbindung bleibt. Alternativ auf „Verworfen“ setzen.", ok:"Löschen", danger:true})
        .then(y => { if(!y) return; setRec("opts", o.id, {weg:true}); persist(); UI.stacks[UI.tab] = stackOf().filter(x => x.params?.id !== o.id); render({top:true}); toast("Option gelöscht", "muell"); });
    }};
};

/* ---------- Bereich Tage: Reisetage und Tagesplan ----------
   Rahmen eines Tages kommt aus der Reise (gewählte Unterkunft, Verbindungen). Die Stopps wählt ihr selbst,
   die App ordnet sie nur. Logik unverändert aus Version 1 (05-tagesplan.js). */
const planCount = d => { const pl = dayPlanFor(d); return pl ? pl.plan.stationen.filter(x => P(x.placeId)).length : 0; };
function setActiveDay(d){ if(S.meta.editDay !== d){ S.meta.editDay = d; persist(); } }

VIEWS.tage = () => {
  const days = tripDays(), b = tripBounds(), ad = editDay();
  const groups = []; days.forEach(d => { const s = stayForNight(d) || (d === b?.end ? stayForNight(addDays(d, -1)) : null); const last = groups[groups.length - 1]; if(last && last.s?.id === s?.id) last.days.push(d); else groups.push({s, days:[d]}); });
  const drow = d => {
    const k = planCount(d), cs = connsOnDay(d), travel = isTravelDay(d);
    const info = [k ? plural(k, "Spot", "Spots") : "noch leer", travel ? "Reisetag" : null, cs.length ? cs.map(({c, o}) => (o ? TRANSPORT[o.art]?.[0] : "Verbindung") + " " + connEnd(c, "nach")).join(", ") : null].filter(Boolean);
    return row({icon:travel ? "reise" : "kalender", c:d === ad ? "--accent" : null, t:esc(fmtDateLong(d)) + (d === today() ? " · heute" : ""), s:esc(info.join(" · ")), go:"day", p:{d}});
  };
  return {title:"Tage", large:true, sub:b ? `${plural(days.length, "Tag", "Tage")}${b.quelle !== "eingetragen" ? ", aus eurer Planung" : ""}` : "Ohne Reisezeitraum: die nächsten 7 Tage",
    html:`${!b ? `<p class="note">Legt in „Reise“ den Zeitraum oder Aufenthalte an, dann erscheinen hier eure Reisetage mit Startpunkt.</p>` : ""}
      ${groups.map(g => sect(g.s ? `${stayName(g.s)}` : "Ohne Aufenthalt", group(g.days.map(drow)), g.s ? `<button class="link" ${attrGo("stay", {id:g.s.id})}>Aufenthalt</button>` : "")).join("")}`};
};

VIEWS.day = ({d}) => {
